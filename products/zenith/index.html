<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Zenith</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .barrow { display: flex; align-items: center; gap: 10px; }
  .barrow .lab { flex: 0 0 120px; font-size: 13px; }
  .barrow .track { flex: 1; height: 10px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; }
  .barrow .fill { height: 100%; border-radius: 999px; background: var(--iris); }
  .barrow .val { flex: 0 0 56px; text-align: right; font-family: var(--font-mono); font-size: 12px; }
  .deid { font-family: var(--font-mono); font-size: 11px; color: var(--verified); background: var(--verified-tint); border-radius: 999px; padding: 4px 11px; display: inline-flex; gap: 7px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('zenith');
  var orgs = X.orgsFor('zenith');
  var cur = X.org('ORG-MOH-LRG');
  var mod = 'command';

  var DISEASES = [
    { name: 'Dengue', trend: 'rising', districts: 7, cases: 1840, change: '+34%' },
    { name: 'Diarrhoeal disease', trend: 'stable', districts: 12, cases: 2210, change: '+3%' },
    { name: 'Respiratory infection', trend: 'stable', districts: 18, cases: 4120, change: '-2%' },
    { name: 'Hypertension (new dx)', trend: 'rising', districts: 22, cases: 3650, change: '+11%' }
  ];
  var COVERAGE = [
    { prog: 'Immunisation (DPT3)', pct: 89 }, { prog: 'Antenatal (4+ visits)', pct: 74 },
    { prog: 'Skilled birth attendance', pct: 68 }, { prog: 'Essential medicines', pct: 82 }
  ];
  var STOCKOUTS = [
    { item: 'Insulin', districts: 'Sylhet, Barisal, Rangpur', days: 12 },
    { item: 'ORS', districts: 'Rangpur', days: 4 },
    { item: 'BCG vaccine', districts: 'Khulna', days: 7 }
  ];
  var FACILITIES = [
    { tier: 'Community clinics', count: 14280, onExchange: 92 },
    { tier: 'Upazila complexes', count: 424, onExchange: 88 },
    { tier: 'District hospitals', count: 64, onExchange: 97 },
    { tier: 'Tertiary hospitals', count: 37, onExchange: 100 }
  ];

  var MODS = [
    { key: 'command', label: 'National command', ic: 'NC', group: 'Oversight' },
    { key: 'surveillance', label: 'Disease surveillance', ic: 'DS', group: 'Oversight' },
    { key: 'coverage', label: 'Coverage', ic: 'CV', group: 'Oversight' },
    { key: 'stockouts', label: 'Stockouts', ic: 'SO', group: 'Supply' },
    { key: 'facilities', label: 'Facility registry', ic: 'FR', group: 'System' },
    { key: 'score', label: 'Impact score', ic: 'IS', group: 'System' },
    { key: 'reporting', label: 'SDG and donor', ic: 'SD', group: 'System' },
    { key: 'governance', label: 'Data governance', ic: 'DG', group: 'System' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'System' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  function moduleBody() {
    var rx = X.prescriptions().length, disp = X.dispenses().length;
    var refs = X.referrals().length, adm = X.admissions().length;
    var labs = X.labResults().length, abn = X.labResults().filter(function (l) { return l.flag; }).length;
    var pubs = X.gicPublications().length;
    if (mod === 'command') {
      return head('National command', 'The country at a glance, de-identified and live. Every number rolls up from the exchange across all institutions.') +
        '<div style="margin-bottom:14px"><span class="deid">de-identified aggregates only</span></div>' +
        kpis([[(rx + disp + labs + adm), 'care events today'], [adm + '/' + refs, 'admitted / referred'], [abn, 'abnormal lab signals'], ['A-', 'national impact score']]) +
        '<div class="split"><div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:12px">Needs national attention</div>' +
        natRow('crit', 'Dengue rising in 7 districts', '+34% week on week, Sylhet leads') +
        natRow('warn', 'Insulin stockout, 3 divisions', '12 days and counting') +
        natRow('warn', 'Skilled birth attendance 68%', 'below the 75% national target') +
        '</div></div><div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">IRIS briefing</div><div class="sub" style="font-size:13px">Care volume is normal for a Saturday. The one real signal is dengue: seven districts rising together points to a seasonal outbreak, not noise. Pre-position ORS and fluids in Sylhet and Barisal now. ' + pubs + ' institutions have published verified outcomes to the Commons this quarter.</div></div>' +
        '</div></div>' + prov('reads every event type on the exchange and aggregates; posts nothing itself');
    }
    if (mod === 'surveillance') {
      return head('Disease surveillance', 'Syndromic signal by condition, built from de-identified encounters and lab results across the country.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Condition</th><th>Trend</th><th class="num">Districts</th><th class="num">Cases, 7d</th><th class="num">Change</th></tr></thead><tbody>' +
        DISEASES.map(function (d) { var up = d.trend === 'rising'; return '<tr><td class="nm">' + esc(d.name) + '</td><td>' + (up ? '<span class="chip inconsistent">rising</span>' : '<span class="chip verified">stable</span>') + '</td><td class="num">' + d.districts + '</td><td class="num">' + d.cases.toLocaleString() + '</td><td class="num" style="color:' + (up ? 'var(--inconsistent)' : 'var(--mid)') + '">' + esc(d.change) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a rising signal across many districts triggers a public-health review, not a single-clinic alert');
    }
    if (mod === 'coverage') {
      return head('Coverage', 'Programme coverage against national targets. Two programmes are below target.') +
        '<div class="card shadow"><div class="bars">' + COVERAGE.map(function (c) { var cls = c.pct < 75 ? 'crit' : 'ok'; return '<div class="barrow"><span class="lab">' + esc(c.prog) + '</span><span class="track"><span class="fill ' + cls + '" style="width:' + c.pct + '%;background:' + (cls === 'crit' ? 'var(--inconsistent)' : 'var(--iris)') + '"></span></span><span class="val">' + c.pct + '%</span></div>'; }).join('') + '</div></div>' +
        prov('coverage is computed from service events, not from a periodic survey');
    }
    if (mod === 'stockouts') {
      return head('Stockouts', 'Essential medicine and vaccine stockouts by district, with days out. Insulin is the pressing one.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th>Districts affected</th><th class="num">Days out</th><th></th></tr></thead><tbody>' +
        STOCKOUTS.map(function (s) { return '<tr><td class="nm">' + esc(s.item) + '</td><td>' + esc(s.districts) + '</td><td class="num" style="color:' + (s.days > 7 ? 'var(--inconsistent)' : 'var(--claimed)') + '">' + s.days + '</td><td style="text-align:right"><button class="btn btn-primary btn-sm">Redistribute via Relay</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('stockouts aggregate from facility and supply events; redistribution routes through Relay');
    }
    if (mod === 'facilities') {
      return head('Facility registry', 'The national health estate and how much of it is live on the exchange.') +
        kpis([['14,805', 'facilities'], ['92%', 'on the exchange'], ['18.4M', 'people with a record'], ['3', 'onboarding this week']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Tier</th><th class="num">Facilities</th><th class="num">On exchange</th><th>Status</th></tr></thead><tbody>' +
        FACILITIES.map(function (f) { return '<tr><td class="nm">' + esc(f.tier) + '</td><td class="num">' + f.count.toLocaleString() + '</td><td class="num">' + f.onExchange + '%</td><td><div class="meter" style="width:120px"><div class="fill ' + (f.onExchange < 90 ? 'warn' : 'ok') + '" style="width:' + f.onExchange + '%"></div></div></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('every connected facility is a node in Core, the HIE operator console');
    }
    if (mod === 'score') {
      return head('Impact score', 'The national EESG Health Impact score, by pillar and front, as it feeds the Commons.') +
        '<div class="cards3">' + [['Economic', 'B+'], ['Environment', 'B'], ['Social', 'A-'], ['Governance', 'A']].map(function (p) {
          return '<div class="card shadow"><div class="sub2">' + esc(p[0]) + '</div><div style="font-family:var(--font-mono);font-size:34px;font-weight:600;margin-top:4px">' + esc(p[1]) + '</div></div>';
        }).join('') + '</div>' +
        '<div style="margin-top:16px">' + UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Population on the exchange', value: '18.4M', status: 'Claimed' },
          { front: 'Supply integrity and pharmacovigilance', measure: 'Stockout districts', value: '3', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'Institutions publishing to GIC', value: String(pubs), status: pubs ? 'Verified' : 'Unmeasured' }
        ] }) + '</div>' + prov('the national score is the audited sum of what institutions verify, not a self-assessment');
    }
    if (mod === 'reporting') {
      return head('SDG and donor', 'How verified outcomes map to the SDGs and to the donor and DFI reports that fund them.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>SDG target</th><th>Indicator</th><th>Value</th><th>Verified</th></tr></thead><tbody>' +
        [['3.8 UHC', 'Service coverage index', '0.61', 'Claimed'], ['3.b Essential medicines', 'Availability', '82%', 'Claimed'], ['3.2 Child mortality', 'Under-5 per 1,000', '28', 'Verified'], ['3.1 Maternal health', 'ANC 4+ coverage', '74%', 'Claimed']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td>' + UI.statusChip(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('donor reports draw from the same verified records, so there is one number, not a reporting copy');
    }
    if (mod === 'governance') {
      return head('Data governance', 'The rules that keep the national view de-identified and the exchange trustworthy.') +
        '<div class="cards3">' + [['De-identification', 'All ministry views are aggregate; no patient or provider identity is ever shown.'], ['Data residency', 'Records stay in country; only verified aggregates reach the Commons.'], ['Access control', 'Role-based, enforced at the exchange, audited in Core.']].map(function (c) {
          return '<div class="card shadow"><div style="font-weight:700;font-size:14px;margin-bottom:6px">' + esc(c[0]) + '</div><div class="sub" style="font-size:13px">' + esc(c[1]) + '</div></div>';
        }).join('') + '</div>' + prov('neutrality and privacy are structural; the ministry sees the picture, never the person');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The national contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Population on the exchange', value: '18.4M', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'Under-5 mortality per 1,000', value: '28', status: 'Claimed' },
          { front: 'Governance', measure: 'Facilities audited this year', value: '1,204', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function natRow(sev, t, s) { return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + sev + '" style="margin-top:6px"></span><div><div style="font-size:13px;font-weight:600">' + esc(t) + '</div><div class="sub2">' + esc(s) + '</div></div></div>'; }

  function render() {
    var who = cur.personas[0];
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Zenith', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(MODS, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'National health system performance, Q current', measures: UI.verifiedMeasures(), status: 'Verified' }, { app: 'zenith', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified national record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
