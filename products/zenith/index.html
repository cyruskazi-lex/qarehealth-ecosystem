<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Zenith</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar .lab { font-size: 13px; flex: 0 0 150px; }
  .bar .track { flex: 1; height: 10px; background: var(--surface-alt); border-radius: 999px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--iris); border-radius: 999px; }
  .bar .val { font-family: var(--font-mono); font-size: 12px; flex: 0 0 48px; text-align: right; }
  .deid { font-family: var(--font-mono); font-size: 11px; color: var(--verified); background: var(--verified-tint); border-radius: 999px; padding: 4px 11px; display: inline-flex; gap: 7px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('zenith');
  var orgs = X.orgsFor('zenith');
  var cur = X.org('ORG-MOH-LRG');

  function render() {
    var who = cur.personas[0];
    var rx = X.prescriptions().length, disp = X.dispenses().length;
    var refs = X.referrals().length, adm = X.admissions().length;
    var labs = X.labResults(), abnormal = labs.filter(function (l) { return l.flag; }).length;
    var pubs = X.gicPublications().length;
    // De-identified regional signal, built from live events plus a seeded base.
    var regions = [
      { name: 'Dhaka', base: 62 }, { name: 'Sylhet', base: 48 }, { name: 'Chattogram', base: 55 }, { name: 'Gazipur', base: 40 }
    ].map(function (r) { r.v = r.base + disp * 2 + refs; return r; });
    var max = Math.max.apply(null, regions.map(function (r) { return r.v; }));
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Zenith', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Ministry of health</div>' +
        '<div class="greet">The national picture, de-identified and live.</div>' +
        '<div class="sub">Every figure rolls up from the exchange across institutions; no patient or provider identity is shown</div>' +
        '<div style="margin-top:12px"><span class="deid">de-identified aggregates only</span></div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="figs" style="margin-top:18px">' +
          '<div class="fig"><div class="fv">' + (rx + disp) + '</div><div class="fk">care events today</div></div>' +
          '<div class="fig"><div class="fv">' + adm + '/' + refs + '</div><div class="fk">admitted / referred</div></div>' +
          '<div class="fig"><div class="fv">' + abnormal + '</div><div class="fk">abnormal lab signals</div></div>' +
          '<div class="fig"><div class="fv">A-</div><div class="fk">national impact score</div></div>' +
        '</div>' +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Service activity by region</h2>' +
            regions.map(function (r) {
              return '<div class="bar"><span class="lab">' + UI.esc(r.name) + '</span><span class="track"><span class="fill" style="width:' + Math.round(r.v / max * 100) + '%"></span></span><span class="val mono">' + r.v + '</span></div>';
            }).join('') +
            '<p class="provenance">reads all exchange events and aggregates them; this surface posts nothing itself</p>' +
          '</section>' +
          '<section>' + UI.impactPanel(cur, { measures: [
            { front: 'Access and coverage', measure: 'Population on the exchange', value: '18.4M', status: 'Verified' },
            { front: 'Supply integrity and pharmacovigilance', measure: 'Stockout districts', value: '3', status: 'Claimed' },
            { front: 'Health outcomes', measure: 'Institutions publishing to GIC', value: String(pubs), status: pubs ? 'Verified' : 'Unmeasured' }
          ] }) + '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'National health system performance, Q current', status: 'Verified' }, { app: 'zenith', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified national record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
