<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .node { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .node .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--verified); display: inline-block; margin-right: 8px; }
  .log { font-family: var(--font-mono); font-size: 12px; max-height: 420px; overflow-y: auto; }
  .log .l { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .log .l.fresh { animation: flash 1.4s ease; } @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .log .tm { color: var(--faint); flex: 0 0 56px; }
  .log .ty { color: var(--iris-deep); flex: 0 0 150px; }
  .log .ds { color: var(--mid); min-width: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('core');
  var orgs = X.orgsFor('core');
  var cur = X.org('ORG-CORE-LRG');
  var lastId = null;

  var TYPE_LABEL = {
    RX_WRITTEN: 'prescription', RX_DISPENSED: 'dispense', DEMAND_SIGNAL: 'demand signal',
    LAB_RESULT: 'lab result', REFERRAL: 'referral', ADMISSION: 'admission',
    COLD_CHAIN_ALERT: 'cold-chain alert', CLAIM_ADJUDICATED: 'claim', CONSENT_GRANTED: 'consent granted',
    CONSENT_REVOKED: 'consent revoked', GIC_PUBLISHED: 'GIC publication'
  };

  function render() {
    var who = cur.personas[0];
    var evs = X.events();
    var byApp = {};
    evs.forEach(function (e) { var a = e.actor && e.actor.app ? e.actor.app : 'system'; byApp[a] = (byApp[a] || 0) + 1; });
    var apps = ['pulse', 'cura', 'nova', 'nexus', 'prism', 'bridge', 'apex', 'relay', 'zenith', 'shield', 'lumen'];
    var consent = X.consentGranted();
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Core', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">HIE operator console</div>' +
        '<div class="greet">The exchange is healthy. ' + evs.length + ' events on the log.</div>' +
        '<div class="sub">Who administers the data highway: node health, live data flow, consent events and GIC traffic</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="figs" style="margin-top:18px">' +
          '<div class="fig"><div class="fv">' + apps.filter(function (a) { return byApp[a]; }).length + '/11</div><div class="fk">nodes with traffic</div></div>' +
          '<div class="fig"><div class="fv">' + evs.length + '</div><div class="fk">events logged</div></div>' +
          '<div class="fig"><div class="fv">' + (X.eventsOfType('CONSENT_GRANTED').length + X.eventsOfType('CONSENT_REVOKED').length) + '</div><div class="fk">consent events</div></div>' +
          '<div class="fig"><div class="fv">' + X.gicPublications().length + '</div><div class="fk">GIC publications</div></div>' +
        '</div>' +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Node health</h2>' +
            apps.map(function (a) {
              var n = byApp[a] || 0;
              return '<div class="node"><span><span class="dot" style="background:' + (n ? 'var(--verified)' : 'var(--faint)') + '"></span>' + UI.esc(a) + '</span><span class="mono" style="color:var(--mid)">' + (n ? n + ' events' : 'idle') + '</span></div>';
            }).join('') +
            '<p class="provenance">derived from the live event log; this console reads the exchange and never mutates clinical state</p>' +
          '</section>' +
          '<section class="card shadow"><h2 class="sec">Live event log</h2>' +
            '<div class="log">' +
            (evs.length ? evs.slice().reverse().map(function (e) {
              var fresh = e.id === lastId;
              return '<div class="l' + (fresh ? ' fresh' : '') + '"><span class="tm">' + UI.timeOf(e.ts) + '</span>' +
                '<span class="ty">' + UI.esc(TYPE_LABEL[e.type] || e.type) + '</span>' +
                '<span class="ds">' + UI.esc((e.actor && e.actor.app ? e.actor.app : 'system')) + '</span></div>';
            }).join('') : '<p class="sub">No events yet. Act in any app and the log fills here live.</p>') +
            '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Exchange uptime and integrity, Q current', status: 'Verified' }, { app: 'core', persona: cur.personas[0].id });
    }
  });

  X.subscribe(function (ev) { if (ev) lastId = ev.id; render(); });
  render();
})();
</script>
</body>
</html>
