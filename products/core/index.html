<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .log { font-family: var(--font-mono); font-size: 12px; max-height: 460px; overflow-y: auto; }
  .log .l { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .log .l.fresh { animation: flash 1.4s ease; } @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .log .tm { color: var(--faint); flex: 0 0 52px; }
  .log .ty { color: var(--iris-deep); flex: 0 0 140px; }
  .log .ds { color: var(--mid); min-width: 0; }
  .node { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('core');
  var orgs = X.orgsFor('core');
  var cur = X.org('ORG-CORE-LRG');
  var mod = 'overview';
  var lastId = null;

  var APPS = ['pulse', 'cura', 'nova', 'nexus', 'prism', 'bridge', 'apex', 'relay', 'zenith', 'shield', 'lumen'];
  var TYPE_LABEL = {
    RX_WRITTEN: 'prescription', RX_DISPENSED: 'dispense', DEMAND_SIGNAL: 'demand signal',
    LAB_RESULT: 'lab result', REFERRAL: 'referral', ADMISSION: 'admission',
    COLD_CHAIN_ALERT: 'cold-chain alert', CLAIM_ADJUDICATED: 'claim', CONSENT_GRANTED: 'consent granted',
    CONSENT_REVOKED: 'consent revoked', GIC_PUBLISHED: 'GIC publication'
  };
  var ADAPTERS = [
    { name: 'FHIR R4 ingest', feeds: 'Clinical records from EHRs', status: 'Live', last: '2s ago' },
    { name: 'HL7 v2 bridge', feeds: 'Legacy hospital systems', status: 'Live', last: '5s ago' },
    { name: 'SAP S/4HANA (Nexagen)', feeds: 'Pharma ops and supply', status: 'Live', last: '18s ago' },
    { name: 'IoT cold-chain', feeds: 'Reefer temperature traces', status: 'Degraded', last: '2m ago' },
    { name: 'Mobile money (bKash)', feeds: 'Payment reconciliation', status: 'Live', last: '40s ago' },
    { name: 'DHIS2 export', feeds: 'Ministry aggregates', status: 'Scoped', last: 'not connected' }
  ];

  var MODS = [
    { key: 'overview', label: 'Operations', ic: 'OP', group: 'Exchange' },
    { key: 'nodes', label: 'Node health', ic: 'NH', group: 'Exchange' },
    { key: 'log', label: 'Event log', ic: 'EL', group: 'Exchange' },
    { key: 'flows', label: 'Data flows', ic: 'DF', group: 'Exchange' },
    { key: 'consent', label: 'Consent registry', ic: 'CR', group: 'Trust' },
    { key: 'identity', label: 'Identity resolution', ic: 'ID', group: 'Trust' },
    { key: 'adapters', label: 'Adapters', ic: 'AD', group: 'Integration' },
    { key: 'audit', label: 'Audit and security', ic: 'AU', group: 'Trust' },
    { key: 'sla', label: 'SLA', ic: 'SL', group: 'System' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'System' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function byApp() { var b = {}; X.events().forEach(function (e) { var a = e.actor && e.actor.app ? e.actor.app : 'system'; b[a] = (b[a] || 0) + 1; }); return b; }

  function moduleBody() {
    var evs = X.events();
    var b = byApp();
    var active = APPS.filter(function (a) { return b[a]; }).length;
    var consentEvents = X.eventsOfType('CONSENT_GRANTED').length + X.eventsOfType('CONSENT_REVOKED').length;
    if (mod === 'overview') {
      return head('Operations', 'Who runs the data highway. Node health, live throughput, consent and integration, on one console.') +
        kpis([[active + '/11', 'nodes with traffic'], [evs.length, 'events logged'], [consentEvents, 'consent events'], [ADAPTERS.filter(function (a) { return a.status === 'Live'; }).length + '/' + ADAPTERS.length, 'adapters live']]) +
        '<div class="split"><div><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">System status</div>' +
        statusRow('ok', 'Exchange core', 'all regions nominal') + statusRow('ok', 'FHIR and HL7 ingest', 'live') + statusRow('warn', 'IoT cold-chain adapter', 'degraded, 2m since last message') + statusRow('ok', 'Consent service', 'live, append-only') + '</div></div>' +
        '<div><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">IRIS briefing</div><div class="sub" style="font-size:13px">The exchange is healthy. One adapter, the cold-chain IoT feed, is degraded and should be checked before the next OncoNex shipment. ' + evs.length + ' events are on the log across ' + active + ' active nodes. Consent is append-only and reconciling.</div></div></div></div>' +
        prov('this console reads the exchange and never mutates clinical state');
    }
    if (mod === 'nodes') {
      return head('Node health', 'Each product is a node. Traffic confirms it is reading and writing the exchange.') +
        '<div class="card shadow">' + APPS.map(function (a) { var n = b[a] || 0; return '<div class="node"><span><span class="sev ' + (n ? 'ok' : 'idle') + '"></span>' + esc(a) + '</span><span class="mono" style="color:var(--mid)">' + (n ? n + ' events' : 'idle') + '</span></div>'; }).join('') + '</div>' +
        prov('derived from the live event log; act in any app and its node lights up here');
    }
    if (mod === 'log') {
      return head('Event log', 'The append-only exchange log, newest first. Every clinical and operational event flows through here.') +
        '<div class="card shadow"><div class="log">' + (evs.length ? evs.slice().reverse().map(function (e) {
          return '<div class="l' + (e.id === lastId ? ' fresh' : '') + '"><span class="tm">' + UI.timeOf(e.ts) + '</span><span class="ty">' + esc(TYPE_LABEL[e.type] || e.type) + '</span><span class="ds">' + esc(e.actor && e.actor.app ? e.actor.app : 'system') + '</span></div>';
        }).join('') : '<div class="sub">No events yet. Act in any app and the log fills here live.</div>') + '</div></div>' +
        prov('append-only and hash-chained; a change to history is detectable');
    }
    if (mod === 'flows') {
      var types = Object.keys(TYPE_LABEL).map(function (t) { return { t: t, n: X.eventsOfType(t).length }; }).filter(function (x) { return x.n; }).sort(function (a, c) { return c.n - a.n; });
      var max = types.reduce(function (m, x) { return Math.max(m, x.n); }, 1);
      return head('Data flows', 'Throughput by message type. This is what is actually moving across the exchange right now.') +
        (types.length ? '<div class="card shadow">' + types.map(function (x) { return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>' + esc(TYPE_LABEL[x.t]) + '</span><span class="mono">' + x.n + '</span></div><div class="meter"><div class="fill" style="width:' + (x.n / max * 100) + '%"></div></div></div>'; }).join('') + '</div>' : '<div class="card"><div class="sub">No flow yet. Drive an action in another app.</div></div>') +
        prov('each bar is a real count from the event log, not a projection');
    }
    if (mod === 'consent') {
      var state = X.consentGranted();
      var grants = X.events().filter(function (e) { return e.type === 'CONSENT_GRANTED' || e.type === 'CONSENT_REVOKED'; });
      return head('Consent registry', 'Live, revocable consent grants. The double-key model keeps care and secondary-use separate.') +
        kpis([[Object.keys(state).filter(function (k) { return state[k]; }).length, 'active grants'], [X.eventsOfType('CONSENT_REVOKED').length, 'revocations'], ['append-only', 'ledger'], ['0', 'collapsed keys']]) +
        (grants.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Grant</th><th>Scope</th><th>Event</th><th>Time</th></tr></thead><tbody>' + grants.slice().reverse().map(function (e) {
          return '<tr><td class="nm">' + esc(e.payload.to === 'research' ? 'Secondary use (research)' : 'Care coordination') + '</td><td>' + esc(e.payload.to) + '</td><td>' + (e.type === 'CONSENT_GRANTED' ? '<span class="chip verified">granted</span>' : '<span class="chip inconsistent">revoked</span>') + '</td><td class="mono">' + UI.timeOf(e.ts) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="card"><div class="sub">No consent events yet. Toggle a grant in Nova and it registers here.</div></div>') +
        prov('a consent steward can never also hold a data-consuming role; the separation is structural');
    }
    if (mod === 'identity') {
      return head('Identity resolution', 'One person, one record, across every facility. The resolver links identifiers without a national ID requirement.') +
        kpis([['18.4M', 'resolved identities'], ['99.2%', 'match confidence'], ['1,204', 'manual reviews, month'], ['0', 'merge errors']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Record</th><th>Linked identifiers</th><th>Confidence</th><th>Status</th></tr></thead><tbody>' +
        [['QH-PT-100482', 'MRN x3, phone, NID', '99.8%', 'Resolved'], ['QH-PT-100771', 'MRN x2, phone', '97.1%', 'Resolved'], ['QH-PT-100233', 'MRN x2', '88.0%', 'Review']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td>' + (r[3] === 'Review' ? '<span class="chip claimed">review</span>' : '<span class="chip verified">resolved</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('deterministic plus probabilistic matching; a low-confidence link is reviewed, never auto-merged');
    }
    if (mod === 'adapters') {
      return head('Adapters', 'Source systems feeding the exchange. One is degraded and one is scoped but not yet connected.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Adapter</th><th>Feeds</th><th>Status</th><th>Last message</th></tr></thead><tbody>' +
        ADAPTERS.map(function (a) { var c = a.status === 'Live' ? 'verified' : a.status === 'Degraded' ? 'inconsistent' : 'claimed'; return '<tr><td class="nm">' + esc(a.name) + '</td><td>' + esc(a.feeds) + '</td><td><span class="chip ' + c + '">' + esc(a.status) + '</span></td><td class="mono sub2">' + esc(a.last) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('systems of record stay in place; the adapter reads from them into the exchange, it does not replace them');
    }
    if (mod === 'audit') {
      return head('Audit and security', 'The tamper-evidence and access record that make the exchange trustworthy.') +
        '<div class="cards3">' + [['Hash-chained log', 'Every event is chained to the prior one; a silent edit breaks the chain.'], ['Role-based access', 'Enforced at the exchange, logged per read and write.'], ['Encryption', 'In transit and at rest; keys held by each institution, not the operator.']].map(function (c) { return '<div class="card shadow"><div style="font-weight:700;font-size:14px;margin-bottom:6px">' + esc(c[0]) + '</div><div class="sub" style="font-size:13px">' + esc(c[1]) + '</div></div>'; }).join('') + '</div>' +
        '<div class="card shadow" style="margin-top:14px"><div class="sub" style="font-size:13px">Last independent audit: clean. Next: Q1. Access anomalies this week: 0.</div></div>' +
        prov('the operator can be replaced with no data lost, because each institution holds its own records');
    }
    if (mod === 'sla') {
      return head('SLA', 'Service levels the exchange commits to, and how it is tracking this month.') +
        '<div class="card shadow">' + [['Uptime', 99.98, 99.9], ['Ingest latency p95', 92, 95], ['Consent check latency', 99, 99]].map(function (r) { return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>' + esc(r[0]) + '</span><span class="mono">' + r[1] + ' / target ' + r[2] + '</span></div><div class="meter"><div class="fill ok" style="width:' + Math.min(100, r[1]) + '%"></div></div></div>'; }).join('') + '</div>' +
        prov('the exchange is infrastructure; its SLA is what every product depends on');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The exchange operator\'s own contribution to the framework, and its verified publication.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Governance', measure: 'Exchange uptime', value: '99.98%', status: 'Verified' },
          { front: 'Access and coverage', measure: 'Facilities connected', value: '92%', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'Records unified', value: '18.4M', status: 'Verified' }
        ] });
    }
    return '';
  }

  function statusRow(sev, t, s) { return '<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + sev + '"></span><div style="flex:1"><span style="font-size:13px;font-weight:600">' + esc(t) + '</span></div><span class="sub2">' + esc(s) + '</span></div>'; }

  function render() {
    var who = cur.personas[0];
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Core', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(MODS, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Exchange uptime and integrity, Q current', status: 'Verified' }, { app: 'core', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(function (ev) { if (ev) lastId = ev.id; render(); });
  render();
})();
</script>
</body>
</html>
