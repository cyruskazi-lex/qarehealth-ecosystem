<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Apex</title>
<meta name="description" content="Apex, the operating system for hospitals and nursing homes. One element library, three facility profiles, every module wired to the HIE and the GIC." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>

<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('apex');
  var SESSION = null;

  /* ---------- facility profiles (the tenant lens for a facility OS) ---------- */
  var PROFILES = [
    { id: 'PROF-HOSP', name: 'Dhaka Tertiary Hospital', kind: 'Hospital', tag: 'ACUTE',
      persona: { id: 'U-NAIMA', name: 'Dr. Naima Islam', role: 'Director of operations' },

      units: [ { name: 'General medicine', total: 60, occ: 51 }, { name: 'Surgery', total: 40, occ: 33 }, { name: 'Maternity', total: 30, occ: 27 }, { name: 'Paediatrics', total: 28, occ: 19 }, { name: 'ICU', total: 12, occ: 11 }, { name: 'Isolation', total: 10, occ: 3 } ] },
    { id: 'PROF-SNF', name: 'Shetu Post-Acute Care', kind: 'Skilled Nursing', tag: 'POST-ACUTE',

      cfg: { assessment: 'MDS 3.0, CMS schedule', payment: 'PDPM, SNF VBP', accred: 'CMS Five-Star', window: true, unitWord: 'unit' },
      units: [ { name: 'Rehabilitation', total: 32, occ: 27 }, { name: 'Long-term care', total: 40, occ: 36 }, { name: 'Memory care', total: 18, occ: 15 } ] },
    { id: 'PROF-RES', name: 'Prosanti Residential Care', kind: 'Residential Care', tag: 'ASSISTED',
      persona: { id: 'U-RINA-H', name: 'Rina Haque', role: 'Care home manager' },
      cfg: { assessment: 'ADL review', payment: 'Private pay', accred: 'State licensure', window: false, unitWord: 'wing' },
      units: [ { name: 'Independent wing', total: 24, occ: 20 }, { name: 'Assisted wing', total: 28, occ: 25 }, { name: 'Respite', total: 8, occ: 3 } ] }
  ];
  var cur = PROFILES[0];
  var mod = 'command';
  function profileById(id) { for (var i = 0; i < PROFILES.length; i++) if (PROFILES[i].id === id) return PROFILES[i]; return PROFILES[0]; }
  function profileTabs() { return PROFILES.map(function (p) { return { id: p.id, name: p.name, sizeClass: p.tag }; }); }

  /* ---------- live state ---------- */
  var discharges = [], incidents = [], staffRoster = [], patients = [], notes = [], doctors = [], nurses = [], tickN = 0, acc = 0;
  var curPatientId = null, noteDraft = null, piiBlur = false, chartDomain = 'whole', glass = {};
  var inventory = [], orders = [], census = [], admDis = [], readmitHist = [], flowUnit = 'all', curItem = null, curStaff = null;
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function seedState() {
    var now = Date.now(), d = 86400000;
    patients = [
      { id: 'PT-AMARA', name: 'Amara Okonkwo', age: 52, sex: 'F', mrn: 'QH-PT-100482', loc: 'Dhaka', lang: 'Bangla', code: 'Full code', risk: 'high',
        allergies: ['Penicillin'], problems: ['Type 2 diabetes (2019)', 'Hypertension (2021)', 'Post-discharge day 3'],
        meds: ['Metformin 500 mg BD', 'Amlodipine 5 mg OD', 'CardiNex-10 OD'],
        care: 'Home health daily visit; 30-day readmission window open', from: 'Union Health Outreach',
        enc: [['Oct 19', 'Discharge, cardiology', 'Dhaka Tertiary Hospital'], ['Oct 14', 'Admission, chest pain', 'Dhaka Tertiary Hospital'], ['Sep 02', 'Clinic review', 'Bhorosha Primary Care']] },
      { id: 'PT-RAHIM', name: 'Rahim Uddin', age: 71, sex: 'M', mrn: 'QH-PT-100611', loc: 'Gazipur', lang: 'Bangla', code: 'DNR', risk: 'rising',
        allergies: ['None known'], problems: ['COPD', 'Heart failure (NYHA II)', 'Post-discharge day 11'],
        meds: ['Furosemide 40 mg OD', 'Salbutamol inhaler PRN', 'Bisoprolol 2.5 mg OD'],
        care: 'Skilled nursing rehab; weekly review', from: 'Sylhet CHW Program',
        enc: [['Oct 11', 'Transfer to SNF', 'Shetu Post-Acute Care'], ['Oct 05', 'Admission, COPD exacerbation', 'Dhaka Tertiary Hospital']] },
      { id: 'PT-NILA', name: 'Nila Akter', age: 34, sex: 'F', mrn: 'QH-PT-100742', loc: 'Dhaka', lang: 'Bangla', code: 'Full code', risk: 'low',
        allergies: ['Sulfa drugs'], problems: ['Gestational diabetes', 'Antenatal, 32 weeks'],
        meds: ['Insulin (basal) 10 units nocte', 'Folic acid OD'],
        care: 'Antenatal clinic, fortnightly', from: 'Bhorosha Primary Care',
        enc: [['Oct 18', 'Antenatal review', 'Metro Polyclinic Network'], ['Oct 04', 'Antenatal review', 'Metro Polyclinic Network']] }
    ];
    // ---- Sample staff: 10 doctors, 10 nurses ----
    var dFirst = ['Naima', 'Imran', 'Ayesha', 'Kamal', 'Selim', 'Tahmina', 'Rahim', 'Sharmin', 'Jahangir', 'Lila'];
    var dLast = ['Islam', 'Chowdhury', 'Siddiqua', 'Uddin', 'Reza', 'Rahman', 'Khan', 'Akhtar', 'Alam', 'Fernando'];
    var specialties = ['Cardiology', 'Internal medicine', 'General surgery', 'Paediatrics', 'Pulmonology', 'Nephrology', 'Orthopaedics', 'Obstetrics', 'Emergency medicine', 'Endocrinology'];
    doctors = [];
    for (var di = 0; di < 10; di++) doctors.push({ id: 'DR-' + (di + 1), name: 'Dr. ' + dFirst[di] + ' ' + dLast[di], role: specialties[di], status: di % 4 === 0 ? 'On call' : 'On shift' });
    var nFirst = ['Shahana', 'Nusrat', 'Fatima', 'Rubina', 'Shaheen', 'Nasrin', 'Rokeya', 'Taslima', 'Sabina', 'Dilruba'];
    var nLast = ['Akter', 'Jahan', 'Begum', 'Haque', 'Sultana', 'Parveen', 'Khatun', 'Nahar', 'Yasmin', 'Banu'];
    nurses = [];
    for (var ni = 0; ni < 10; ni++) nurses.push({ id: 'NR-' + (ni + 1), name: nFirst[ni] + ' ' + nLast[ni], role: (cur.units[ni % cur.units.length] ? cur.units[ni % cur.units.length].name : 'Ward') + ' nurse', status: ni % 3 === 0 ? 'Night' : ni % 3 === 1 ? 'Evening' : 'Day' });

    // ---- Sample patients: generate up to 50 (3 canonical + generated) ----
    var pmF = ['Imran', 'Karim', 'Sohel', 'Tanvir', 'Jamal', 'Faruk', 'Nasir', 'Hasan', 'Mamun', 'Shakil', 'Rafiq', 'Masud', 'Arif', 'Monir', 'Russel', 'Shafiq', 'Babul', 'Jubayer', 'Rony', 'Sumon'];
    var pfF = ['Ayesha', 'Rubina', 'Laila', 'Nasrin', 'Rokeya', 'Shireen', 'Sultana', 'Parveen', 'Jesmin', 'Momena', 'Rahima', 'Sabina', 'Nargis', 'Shabnam', 'Kohinoor', 'Dilruba', 'Afroza', 'Sharmin', 'Nadia', 'Rina'];
    var pLast = ['Ahmed', 'Khan', 'Hossain', 'Rahman', 'Islam', 'Chowdhury', 'Akter', 'Begum', 'Uddin', 'Das', 'Sarkar', 'Haque', 'Alam', 'Mia', 'Siddiqui', 'Bhuiyan', 'Molla', 'Sheikh', 'Talukder', 'Karim'];
    var probPool = ['Type 2 diabetes', 'Hypertension', 'COPD', 'Heart failure (NYHA II)', 'Asthma', 'Chronic kidney disease', 'Post-operative recovery', 'Community-acquired pneumonia', 'Stroke rehabilitation', 'Ischaemic heart disease', 'Osteoarthritis', 'Iron-deficiency anaemia', 'Hypothyroidism', 'Dengue, recovering', 'Peptic ulcer disease'];
    var medPool = ['Metformin 500 mg BD', 'Amlodipine 5 mg OD', 'Losartan 50 mg OD', 'Atorvastatin 20 mg OD', 'Furosemide 40 mg OD', 'Salbutamol inhaler PRN', 'Omeprazole 20 mg OD', 'Levothyroxine 50 mcg OD', 'Aspirin 75 mg OD', 'Insulin basal 10 units nocte'];
    var allergyPool = ['None known', 'Penicillin', 'Sulfa drugs', 'Aspirin', 'None known', 'None known'];
    var referrers = ['Union Health Outreach', 'Sylhet CHW Program', 'National CHW Corps', 'Bhorosha Primary Care', 'Shetu Medical Centre'];
    var riskCycle = ['low', 'low', 'rising', 'low', 'high', 'low', 'rising', 'low', 'low', 'high'];
    for (var i = 0; i < 47; i++) {
      var male = (i + Math.floor(i / 3)) % 2 === 0;
      var fi = (i * 3 + Math.floor(i / 4)) % 20, li = (i * 7 + Math.floor(i / 3)) % pLast.length;
      var nm = (male ? pmF[fi % pmF.length] : pfF[fi % pfF.length]) + ' ' + pLast[li];
      var p1 = probPool[(i * 3 + Math.floor(i / 2)) % probPool.length], p2 = probPool[(i * 5 + 5) % probPool.length];
      var doc = doctors[i % doctors.length], nur = nurses[(i * 3) % nurses.length];
      patients.push({
        id: 'PT-' + (1000 + i), name: nm, age: 24 + (i * 7 + Math.floor(i / 2)) % 62, sex: male ? 'M' : 'F',
        mrn: 'QH-PT-' + (101000 + i * 7), loc: ['Dhaka', 'Gazipur', 'Sylhet', 'Chattogram', 'Narsingdi'][i % 5], lang: 'Bangla',
        code: i % 9 === 0 ? 'DNR' : 'Full code', risk: riskCycle[(i + Math.floor(i / 3)) % riskCycle.length],
        allergies: [allergyPool[i % allergyPool.length]], problems: p1 === p2 ? [p1] : [p1, p2],
        meds: [medPool[i % medPool.length], medPool[(i * 2 + 1) % medPool.length]],
        care: i % 3 === 0 ? 'Home health visit; 30-day window open' : i % 3 === 1 ? 'Outpatient review, fortnightly' : 'Inpatient, under ' + doc.role.toLowerCase(),
        from: referrers[i % referrers.length], attending: doc.name, attendingRole: doc.role, nurse: nur.name,
        enc: [[['Oct 20', 'Oct 18', 'Oct 15', 'Oct 12'][i % 4], i % 3 === 0 ? 'Discharge' : 'Clinic review', cur.name], ['Oct 0' + (2 + i % 7), 'Admission', cur.name]]
      });
    }
    // Assign every patient a bed, ward, length of stay and status (the inpatient roster).
    var statuses = ['Stable', 'Improving', 'Observation', 'Post-op', 'Critical'];
    patients.forEach(function (p, idx) {
      var u = cur.units[idx % cur.units.length];
      p.unit = u.name; p.bed = u.name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + '-' + (10 + idx % Math.max(1, u.total));
      p.los = 1 + (idx * 3 + Math.floor(idx / 2)) % 14; p.status = p.risk === 'high' ? 'Observation' : statuses[(idx * 7 + Math.floor(idx / 3)) % statuses.length];
      p.dx = p.problems[0];
    });

    // Inventory and supply
    inventory = [
      { item: 'Oxygen cylinders', cat: 'Medical gases', onHand: 22, par: 30, uom: 'cyl', cold: false, burn: 9 },
      { item: 'IV fluids, normal saline', cat: 'Fluids', onHand: 310, par: 200, uom: 'bag', cold: false, burn: 48 },
      { item: 'Blood, O negative', cat: 'Blood bank', onHand: 4, par: 10, uom: 'unit', cold: true, burn: 3 },
      { item: 'Insulin', cat: 'Pharmacy', onHand: 85, par: 60, uom: 'vial', cold: true, burn: 7 },
      { item: 'OncoNex-100 (cold chain)', cat: 'Pharmacy', onHand: 18, par: 15, uom: 'vial', cold: true, burn: 2 },
      { item: 'Surgical gloves', cat: 'PPE', onHand: 1200, par: 800, uom: 'box', cold: false, burn: 60 },
      { item: 'N95 respirators', cat: 'PPE', onHand: 140, par: 300, uom: 'box', cold: false, burn: 35 },
      { item: 'Paracetamol injection', cat: 'Pharmacy', onHand: 430, par: 250, uom: 'amp', cold: false, burn: 40 },
      { item: 'Sutures, assorted', cat: 'Surgical', onHand: 60, par: 100, uom: 'pack', cold: false, burn: 12 },
      { item: 'Ringer lactate', cat: 'Fluids', onHand: 180, par: 150, uom: 'bag', cold: false, burn: 30 }
    ];
    inventory.forEach(function (it) { it.status = it.onHand < it.par ? 'low' : 'ok'; it.days = Math.round(it.onHand / it.burn); });

    // Orders and results (so the module is never empty)
    orders = [
      { test: 'HbA1c', patient: 'Amara Okonkwo', value: '8.1 %', flag: 'high', when: '2h ago' },
      { test: 'Full blood count', patient: 'Rahim Uddin', value: 'Hb 10.2 g/dL', flag: 'low', when: '3h ago' },
      { test: 'Chest X-ray', patient: 'Jamal Uddin', value: 'Right lower consolidation', flag: 'abnormal', when: '4h ago' },
      { test: 'Serum creatinine', patient: 'Nasrin Khan', value: '1.4 mg/dL', flag: 'high', when: '5h ago' },
      { test: 'Troponin I', patient: 'Imran Ahmed', value: 'Negative', flag: '', when: '6h ago' },
      { test: 'Blood culture', patient: 'Sohel Siddiqui', value: 'Pending', flag: 'pending', when: '7h ago' }
    ];

    // Chart history
    census = [138, 141, 139, 144, 146, 142, 148, 145, 150, 147, 149, 146, 151, beds().occ];
    admDis = [{ label: 'Mon', a: 22, b: 18 }, { label: 'Tue', a: 19, b: 21 }, { label: 'Wed', a: 24, b: 17 }, { label: 'Thu', a: 20, b: 23 }, { label: 'Fri', a: 26, b: 19 }, { label: 'Sat', a: 15, b: 20 }, { label: 'Sun', a: 12, b: 16 }];
    readmitHist = [7.8, 7.2, 6.9, 6.4, 6.1, 5.8];
    flowUnit = 'all'; curItem = null; curStaff = null;

    curPatientId = null; noteDraft = null;
    notes = [
      { id: 'N-0912', pt: 'PT-AMARA', type: 'Discharge summary', by: 'Dr. Naima Islam', when: 'Oct 19', signed: true },
      { id: 'N-0908', pt: 'PT-RAHIM', type: 'Progress note', by: 'Shahana Akter', when: 'Oct 18', signed: true }
    ];
    discharges = [
      { id: 'DC-241', patient: 'A. Khan', at: now - 24 * d, risk: 'low', status: 'in-window', loop: 'reported', to: 'Union Health Outreach' },
      { id: 'DC-242', patient: 'R. Begum', at: now - 11 * d, risk: 'rising', status: 'in-window', loop: 'seen', to: 'Sylhet CHW Program' },
      { id: 'DC-243', patient: 'M. Das', at: now - 3 * d, risk: 'high', status: 'in-window', loop: 'accepted', to: 'Union Health Outreach' },
      { id: 'DC-240', patient: 'S. Roy', at: now - 31 * d, risk: 'low', status: 'cleared', loop: 'closed', to: 'National CHW Corps' },
      { id: 'DC-239', patient: 'T. Islam', at: now - 33 * d, risk: 'low', status: 'cleared', loop: 'closed', to: 'Sylhet CHW Program' }
    ];
    incidents = [
      { id: 'INC-204', type: 'Medication near-miss', unit: 'General medicine', sev: 'Moderate', status: 'Investigating' },
      { id: 'INC-205', type: 'Patient fall', unit: 'Rehabilitation', sev: 'Minor', status: 'Closed' }
    ];
    staffRoster = [
      { shift: 'Day', nurses: 42, patients: 148, ratio: '1:3.5', status: cur.kind === 'Skilled Nursing' ? 'ok' : 'ok' },
      { shift: 'Evening', nurses: 31, patients: 150, ratio: '1:4.8', status: 'warn' },
      { shift: 'Night', nurses: 22, patients: 150, ratio: '1:6.8', status: 'warn' }
    ];
    acc = 0;
  }
  function dayIn(dc) { return Math.min(30, Math.floor((Date.now() + acc - dc.at) / 86400000)); }
  function readmitted() { return discharges.filter(function (d) { return d.status === 'readmitted'; }).length; }
  function avoided() { return discharges.filter(function (d) { return d.status === 'cleared'; }).length; }
  function inWindow() { return discharges.filter(function (d) { return d.status === 'in-window'; }); }
  function readmitRate() { var t = discharges.length; return t ? (readmitted() / t * 100) : 0; }

  function beds() { var t = 0, o = 0; cur.units.forEach(function (u) { t += u.total; o += u.occ; }); o += X.admissions().filter(function (a) { return a.orgId === cur.id; }).length; return { total: t, occ: Math.min(t, o) }; }
  function incoming() { var admitted = X.admissions().map(function (a) { return a.household; }); return X.referrals().filter(function (r) { return admitted.indexOf(r.household) < 0; }); }
  function facilityReadmit() { return readmitHist.length ? readmitHist[readmitHist.length - 1] : 6.1; }
  function lowStock() { return inventory.filter(function (i) { return i.status === 'low'; }); }
  function statusChipCls(s) { return s === 'Critical' ? 'inconsistent' : s === 'Observation' || s === 'Post-op' ? 'claimed' : 'verified'; }

  /* ---------- small view helpers ---------- */
  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div><div class="actions"><span class="band"><span class="livedot"></span>one exchange, live</span></div></div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function kpiRow(items) { return '<div class="figs" style="margin-bottom:16px">' + items.map(function (a) { return '<div class="fig"><div class="fv"' + (a[2] ? ' id="' + a[2] + '"' : '') + '>' + a[0] + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function card(title, inner) { return '<div class="card shadow" style="margin-bottom:14px"><div style="font-family:var(--font-brand);font-weight:700;font-size:14px;margin-bottom:10px">' + esc(title) + '</div>' + inner + '</div>'; }
  function row(left, sub, action) { return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline)"><div><div style="font-size:13px;font-weight:600">' + left + '</div><div class="sub2" style="margin-left:16px">' + sub + '</div></div>' + (action || '') + '</div>'; }
  function row2(label, val) { return '<div class="row" style="padding:8px 10px"><span class="m">' + esc(label) + '</span><span class="v">' + val + '</span></div>'; }
  function riskChip(r) { var m = { low: 'verified', rising: 'claimed', high: 'inconsistent' }; return '<span class="chip ' + m[r] + '">' + esc(r) + ' risk</span>'; }
  function railChips(m) { var r = m.rails || {}; return '<span class="rails"><span class="rail exch ' + (r.hie ? 'on' : '') + '">HIE</span><span class="rail eesg ' + ((r.eesg && r.eesg.length) ? 'on' : '') + '">EESG</span><span class="rail gic ' + (r.gic ? 'on' : '') + '">GIC</span></span>'; }

  /* ---------- patient chart (native EHR, holistic record) ---------- */
  function patientById(id) { for (var i = 0; i < patients.length; i++) if (patients[i].id === id) return patients[i]; return null; }
  function patientResults(p) {
    var base = p.id === 'PT-AMARA' ? [['HbA1c', '8.1 %', 'high'], ['Blood pressure', '148/92', 'high'], ['Creatinine', '1.1 mg/dL', 'normal'], ['LDL', '134 mg/dL', 'high']]
      : p.id === 'PT-RAHIM' ? [['BNP', '640 pg/mL', 'high'], ['SpO2', '93 %', 'low'], ['Potassium', '4.2 mmol/L', 'normal']]
      : [['HbA1c', '6.2 %', 'normal'], ['Fasting glucose', '104 mg/dL', 'normal'], ['Haemoglobin', '11.1 g/dL', 'low']];
    // overlay any live lab results from Prism on the exchange for this patient
    X.labResults().forEach(function (l) { if (l.patient === p.id || l.mrn === p.mrn) base.unshift([l.testName || l.test || 'Lab', String(l.value != null ? l.value : '-'), l.flag ? 'high' : 'normal']); });
    return base;
  }
  function riskBanner(r) { var m = { low: 'verified', rising: 'claimed', high: 'inconsistent' }; return '<span class="chip ' + m[r] + '">' + esc(r) + ' readmission risk</span>'; }
  function chartHTML() {
    if (!curPatientId) {
      var hi = patients.filter(function (p) { return p.risk === 'high'; }).length;
      return head('Patient chart', 'The native record, holistic across encounters and connected sources. Open a patient to see the chart.') +
        kpiRow([[patients.length, 'patients', false], [hi, 'high readmission risk', false], [doctors.length, 'physicians on service', false], [nurses.length, 'nurses rostered', false]]) +
        '<div class="toolbar"><input class="search" placeholder="Search patients by name or MRN" disabled></div>' +
        '<div class="qt-wrap" style="max-height:520px;overflow:auto"><table class="qt"><thead><tr><th>Patient</th><th>MRN</th><th>Age/Sex</th><th>Key problems</th><th>Attending</th><th>Risk</th><th></th></tr></thead><tbody>' +
        patients.map(function (p) {
          return '<tr><td class="nm">' + esc(p.name) + '</td><td class="mono">' + esc(p.mrn) + '</td><td>' + p.age + ' / ' + esc(p.sex) + '</td><td class="sub2">' + esc(p.problems.slice(0, 2).join(', ')) + '</td><td class="sub2">' + esc(p.attending || 'Dr. Naima Islam') + '</td><td>' + riskBanner(p.risk) + '</td><td style="text-align:right"><button class="btn btn-primary btn-sm" data-patient="' + esc(p.id) + '">Open chart</button></td></tr>';
        }).join('') + '</tbody></table></div>' +
        prov(patients.length + ' patients on the service; one longitudinal record each, native data plus what the HIE and connected networks return');
    }
    var p = patientById(curPatientId), cd = chartData(p);
    return '<div class="sec-head"><div><div class="t">Unified care record</div><div class="d">Holistic across encounters, labs, pharmacy and connected sources, with the care plan, risk and compliance in one view.</div></div>' +
      '<div class="actions"><button class="btn btn-ghost btn-sm" data-patient="">All patients</button><button class="btn btn-primary btn-sm" data-newnote="' + esc(p.id) + '">AI conversation capture</button></div></div>' +
      '<div class="chart3">' + chartLeft(p, cd) + chartCenter(p, cd) + chartRight(p, cd) + '</div>';
  }
  function pii(s) { return '<span class="pii' + (piiBlur ? ' blur' : '') + '">' + esc(s) + '</span>'; }

  function chartLeft(p, cd) {
    var initials = p.name.split(' ').map(function (w) { return w[0]; }).slice(0, 2).join('');
    return '<div><div class="cblock"><h4>Beneficiary record <button class="piitoggle" data-pii="1">' + (piiBlur ? 'Show PII' : 'Blur PII') + '</button></h4>' +
      '<div class="crec-top"><div class="crec-av">' + esc(initials) + '</div><div><div class="crec-nm">' + pii(p.name) + '</div><div class="crec-meta">' + esc(p.sex) + ' · ' + pii('DOB on file') + ' · age ' + p.age + '<br>MRN ' + pii(p.mrn) + '</div></div></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">' + riskBanner(p.risk) + '<span class="chip">' + esc(p.code) + '</span></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="chip inconsistent">Allergy: ' + esc(p.allergies.join(', ')) + '</span></div></div>' +

  function moduleByKey(k) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].key === k) return MODULES[i]; return null; }

  /* ---------- per-profile manifest + overrides ---------- */
  var MANIFEST = {
    'PROF-HOSP': ['command', 'intake', 'flow', 'emergency', 'theatre', 'transitions', 'staffing', 'inventory', 'chart', 'documentation', 'quality', 'medication', 'accreditation', 'orders', 'billing', 'finance', 'integration', 'compliance', 'environment', 'eesg', 'impact', 'library'],

    'PROF-RES': ['command', 'intake', 'flow', 'transitions', 'staffing', 'inventory', 'chart', 'documentation', 'assessments', 'quality', 'medication', 'billing', 'finance', 'integration', 'compliance', 'environment', 'eesg', 'impact', 'library']
  };
  var overrides = {};
  function baseEnabled(id) { return (MANIFEST[id] || []).slice(); }
  function isOn(key) { var o = overrides[cur.id] || {}; if (key in o) return o[key]; return baseEnabled(cur.id).indexOf(key) >= 0; }
  function enabledMods() { return MODULES.filter(function (m) { return isOn(m.key); }); }
  function navModules() { return enabledMods().map(function (m) { var o = { key: m.key, label: m.label, ic: m.ic, group: m.group }; if (m.key === 'intake') { var n = incoming().length; if (n) o.badge = n; } if (m.key === 'transitions' && inWindow().filter(function (d) { return d.risk === 'high'; }).length) { o.badge = inWindow().filter(function (d) { return d.risk === 'high'; }).length; } return o; }); }

  /* ---------- EESG rollup, generated from enabled modules ---------- */
  function collectEESG() {
    var out = [];
    enabledMods().forEach(function (m) {
      (m.rails.eesg || []).forEach(function (met) {
        out.push({ pillar: met.pillar, front: met.front, measure: met.measure, value: met.valueFn ? met.valueFn() : met.value, status: met.statusFn ? met.statusFn() : met.status, from: m.label, gic: !!m.rails.gic });
      });
    });
    return out;
  }
  function eesgGridHTML() {

      }).join('') : '<div class="empty">No enabled module emits here.</div>') + '</div>';
    }).join('') + '</div>';
  }

      var on = isOn(m.key);

    });

  /* ---------- IRIS ---------- */
  function irisContext() {
    var m = moduleByKey(mod) || {};
    var sMap = {
      command: ['What needs me now?', 'Who is at readmission risk?', 'How full are we?'],
      chart: ['Open the chart', 'Who should I see first?'],
      documentation: ['Draft a note by voice', 'Capture a patient conversation'],
      transitions: ['Explain the 30-day flow', 'Who is high risk?', 'What counts as avoided?'],
      flow: ['How full are we?'], staffing: ['Is night staffing safe?'],
      quality: ['What is our readmission rate?'], intake: ['What is waiting?'],
      eesg: ['Summarise our EESG position', 'What is not verified?'],
      impact: ['What can we raise capital against?'], library: ['What should a nursing home turn on?'],
      environment: ['Where is our footprint worst?'], billing: ['Why is affordability flagged?']
    };
    return { label: m.label || '', suggestions: sMap[mod] || [] };
  }
  function role() { return SESSION ? SESSION.role : 'admin'; }
  function irisAnswer(q) {
    var s = q.toLowerCase(), m = moduleByKey(mod) || {}, agents = m.agents || ['Telos'], b = beds(), r = role();
    function A(t, acts) { return { text: t, agents: agents, actions: acts || [] }; }
    // Role-aware framing: IRIS answers the person in front of it.
    if (/what needs me|right now|my (day|list|tasks|shift)/.test(s)) {
      if (r === 'nurse') return A('Your shift: ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' post-discharge patients at high risk need a call, vitals are due in ' + cur.units[0].name + ', and one note is waiting to be signed. Night staffing is thin. I can draft notes by voice or capture a patient conversation. A clinician signs every order.', [{ label: 'Open my patients', kind: 'evidence', q: 'who is at readmission risk?' }]);
      if (r === 'doctor') return A('Clinically: ' + (patientById('PT-AMARA').name) + ' is day 3 post-discharge, BP 148/92 and HbA1c 8.1%, flagged high risk, likely adherence. ' + patientById('PT-RAHIM').name + ' is day 11, BNP rising. Review both. The record supports a dietitian referral and adherence counselling; you decide and sign.', [{ label: 'Open the chart', kind: 'evidence', q: 'open the chart' }]);
      if (r === 'quality') return A('Quality view: ' + openDevs().length + ' open deviations, readmission rate ' + readmitRate().toFixed(1) + '%, HAI 1.9%, falls 2.4 per 1k bed-days. One cold-chain deviation is gating a lot. Survey readiness is green except the SNF staffing star.', [{ label: 'Open Quality', kind: 'evidence', q: 'what is our readmission rate?' }]);
      return A('Operations: occupancy ' + Math.round(b.occ / b.total * 100) + '%, ' + inWindow().length + ' in the discharge window with ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' high risk, night staffing below target. ' + avoided() + ' avoided readmissions are verified impact. The decisions are in Command.', [{ label: 'Open Command', kind: 'evidence', q: 'how full are we?' }]);
    }
    if (/chart|record|patient|holistic/.test(s)) return A('The chart is the native record plus labs from Prism and medications from Cura over the HIE, de-duplicated with provenance on every element. ' + patientById('PT-AMARA').name + ' is the high-risk post-discharge patient to see first.', [{ label: 'Open the chart', kind: 'evidence', q: 'open the chart' }]);
    if (/note|voice|dictat|scribe|translat|conversation|bangla|language/.test(s)) return A('I can draft a note from your voice, or capture a patient conversation in ' + patientById('PT-AMARA').lang + ' and store it in English so the record stays consistent, with the original transcript kept. I structure and code it; a clinician reviews and signs. I never sign.', [{ label: 'Start a note', kind: 'evidence', q: 'open documentation' }]);
    if (/loop|referral status|closed/.test(s)) return A('Referrals run a closed loop: sent, received, accepted, scheduled, seen, reported, closed. ' + discharges.filter(function (d) { return d.loop && d.loop !== 'closed'; }).length + ' are open in the loop; an open loop past its SLA is flagged so nothing is sent and forgotten.', [{ label: 'Open Transitions', kind: 'evidence', q: 'explain the 30-day flow' }]);
    if (/readmiss|transition|window|discharge|30/.test(s)) return A('Discharge writes to the HIE and starts a 30-day clock. ' + inWindow().length + ' patients are in the window, ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' at high risk. A decline routes them back here, not the ED. ' + avoided() + ' avoided readmissions this period are verified impact on the Commons. The rate is ' + readmitRate().toFixed(1) + '%.', [{ label: 'Open Transitions', kind: 'evidence', q: 'Who is high risk?' }]);
    if (/risk|high/.test(s)) { var h = inWindow().filter(function (d) { return d.risk === 'high'; }); return A(h.length ? h.map(function (d) { return d.patient + ' (day ' + dayIn(d) + ')'; }).join(', ') + ' ' + (h.length === 1 ? 'is' : 'are') + ' at high readmission risk. Home health flagged a decline. My read: bring them back to the facility, not the ED. A clinician decides.' : 'No one is at high risk in the window right now.', [{ label: 'Route to facility', reply: 'Readmission routed to the facility, not the ED. A clinician confirms the bed.' }]); }
    if (/full|occup|bed|census/.test(s)) return A('Occupancy is ' + Math.round(b.occ / b.total * 100) + '%, ' + b.occ + ' of ' + b.total + ' beds. ' + (b.total - b.occ) + ' free. Discharges ready today would free more and start their 30-day clocks.', []);
    if (/staff|ratio|night|five.?star/.test(s)) return A('Night ratio is 1:6.8, below target; day and evening are inside band. For a nursing facility this is the Five-Star staffing measure, so it moves the rating. I would pull one agency nurse to nights. A manager signs the roster.', [{ label: 'Adjust roster', reply: 'One agency nurse moved to nights. The manager confirms the shift.' }]);
    if (/eesg|framework|position|verified/.test(s)) { var mets = collectEESG(), v = mets.filter(function (x) { return x.status === 'Verified'; }).length; return A('Across ' + enabledMods().length + ' enabled modules, ' + mets.length + ' EESG metrics emit, ' + v + ' Verified. The weak spots are out-of-pocket share and the night staffing ratio. Turn on more modules and the position fills in; it is generated, not written.', [{ label: 'Open EESG', kind: 'evidence', q: 'What is not verified?' }]); }
    if (/capital|gic|commons|raise|fund/.test(s)) return A('You raise against verified outcomes, led by readmission reduction: ' + avoided() + ' avoided this period, each a saving to the payer. That is the readmission-reduction token, sold to the party that saves the money. Access and HAI rate add to it. Nothing unverified posts.', [{ label: 'Publish to GIC', reply: 'Verified record staged for the Commons. A signatory approves it.' }]);
    if (/library|turn on|module|nursing|configure/.test(s)) return A('A skilled nursing facility runs Command, Intake, Flow, Transitions, Staffing, MDS assessments, Quality, Medication, Accreditation, Orders, Revenue cycle, Finance, Environment, plus the EESG and GIC rails. No ED, no theatre. A hospital adds those two; residential care drops assessments depth. Same code, different profile.', [{ label: 'Open the library', kind: 'evidence', q: 'What should a nursing home turn on?' }]);
    if (/intake|referral|waiting/.test(s)) { var inc = incoming(); return A(inc.length ? inc.length + ' referrals are waiting from Bridge, field-screened. Admitting writes an ADMISSION to the HIE and the bed count updates everywhere.' : 'No referrals waiting. They arrive live from Bridge over the HIE.', []); }
    if (/afford|out.?of.?pocket|billing/.test(s)) return A('Out-of-pocket share is 31%, flagged Inconsistent until the payer reconciliation in Shield closes. The facility cannot upgrade it by assertion; a matched claim does. Under ' + cur.cfg.payment + ' the claim ties to real admission and discharge events.', []);
    if (/environ|carbon|waste|water|energy/.test(s)) return A('Energy is 58 kWh per bed-day, water 410 L, medical waste 64% recycled, carbon 8% over target. Anaesthetic gases and single-use plastics are the overlooked lines. Each is an EESG emitter and a candidate for the carbon line on the Commons.', []);
    return A('I read that from ' + cur.name + '\'s own records on the HIE. Ask me about readmissions and the 30-day window, occupancy, staffing, quality, the EESG position or the capital ask. I advise; a licensed clinician makes every clinical call.');
  }

  /* ---------- render + live loop ---------- */
  function render() {
    if (!isOn(mod)) mod = 'command';
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Apex', personaName: cur.persona.name, personaRole: cur.persona.role + ' · ' + cur.name, role: SESSION ? SESSION.roleLabel : null, trustLabel: UI.trust.badgeLabel('provider') }) +
      '<div class="os">' + UI.osNav(navModules(), mod) +
        '<main class="os-main">' + UI.tenantBar(profileTabs(), cur.id) + '<div style="margin-top:16px">' + moduleByKey(mod).render() + '</div></main>' +
      '</div>' + UI.legalFooter({ sector: 'provider' });
    UI.iris.context();
    paintLive(true);
  }
  function paintLive(initial) {
    var b = beds();
    var kb = document.getElementById('k-beds'); if (kb) kb.textContent = b.occ + '/' + b.total;
    var kr = document.getElementById('k-ref'); if (kr) kr.textContent = incoming().length;
    var ki = document.getElementById('k-risk'); if (ki) ki.textContent = inWindow().filter(function (d) { return d.risk === 'high'; }).length;
    var krr = document.getElementById('k-rr'); if (krr) krr.textContent = readmitRate().toFixed(1) + '%';
    var kw = document.getElementById('k-inwin'); if (kw) kw.textContent = inWindow().length;
    var ka = document.getElementById('k-avoid'); if (ka) ka.textContent = avoided();
    if (!initial) { var tr = document.getElementById('ap-trans'); if (tr) tr.innerHTML = transitionRows(); }
  }
  function tick() {
    tickN++;
    acc += 6 * 3600000; // 6 simulated hours per second, so the 30-day clock visibly moves
    var changed = false;
    discharges.forEach(function (d) {
      if (d.status === 'in-window' && dayIn(d) >= 30) { d.status = 'cleared'; changed = true; }
    });
    // occasionally a rising case becomes high
    if (tickN % 7 === 0) { var r = inWindow().filter(function (d) { return d.risk === 'rising'; })[0]; if (r) { r.risk = 'high'; changed = true; } }
    if (changed && (mod === 'transitions' || mod === 'command' || mod === 'impact')) render(); else paintLive(false);
  }

  /* ---------- events + actions ---------- */
  document.addEventListener('click', function (e) {
    var tn = e.target.getAttribute('data-tenant'); if (tn) { cur = profileById(tn); mod = 'command'; seedState(); render(); return; }
    var mm = e.target.closest('[data-mod]'); if (mm) { mod = mm.getAttribute('data-mod'); render(); return; }
    var tg = e.target.getAttribute('data-toggle'); if (tg) { var mobj = moduleByKey(tg); if (mobj && !mobj.core) { if (!overrides[cur.id]) overrides[cur.id] = {}; overrides[cur.id][tg] = !isOn(tg); render(); } return; }
    var hh = e.target.getAttribute('data-admit'); if (hh) { var r = X.referrals().filter(function (x) { return x.household === hh; })[0]; X.append('ADMISSION', { household: hh, patientName: r ? r.patientName : hh, orgId: cur.id }, { app: 'apex', persona: cur.persona.id }); UI.toast('Admitted', (r ? r.patientName : hh) + ' admitted. Bed state updated.'); render(); return; }
    var dp = e.target.getAttribute('data-discharge'); if (dp) {
      var dc = { id: 'DC-' + rnd(300, 999), patient: dp, at: Date.now(), risk: 'low', status: 'in-window', to: 'Union Health Outreach' };
      discharges.unshift(dc);
      X.append('DISCHARGE', { patient: dp, orgId: cur.id, window: 30 }, { app: 'apex', persona: cur.persona.id });
      X.append('REFERRAL', { patientName: dp, household: 'HH-' + dp.replace(/\W/g, ''), village: cur.name, reason: 'post-discharge home health', maker: 'ORG-NEXAGEN', to: 'home-health' }, { app: 'apex', persona: cur.persona.id });
      UI.toast('Discharged', dp + ' discharged. Home-health referral, transport and a 30-day clock started across the HIE.');
      render(); return;
    }
    var dec = e.target.getAttribute('data-decline'); if (dec) { var d1 = discharges.filter(function (x) { return x.id === dec; })[0]; if (d1) { d1.risk = 'high'; UI.toast('Decline flagged', d1.patient + ' flagged. IRIS raised readmission risk; route to the facility, not the ED.'); render(); } return; }
    var clr = e.target.getAttribute('data-clear'); if (clr) { var d2 = discharges.filter(function (x) { return x.id === clr; })[0]; if (d2) { d2.status = 'cleared'; d2.loop = 'closed'; UI.toast('Recovered', d2.patient + ' cleared the window. One readmission avoided, a verified outcome for the Commons.'); render(); } return; }
    var ptEl = e.target.closest('[data-patient]'); if (ptEl) { var pv = ptEl.getAttribute('data-patient'); curPatientId = pv || null; if (pv) mod = 'chart'; chartDomain = 'whole'; glass = {}; render(); return; }
    if (e.target.closest('[data-pii]')) { piiBlur = !piiBlur; render(); return; }
    var dmn = e.target.getAttribute('data-domain'); if (dmn) { chartDomain = dmn; render(); return; }
    var gl = e.target.getAttribute('data-glass'); if (gl) { glass[gl] = true; UI.toast('Break glass', 'Protected note unsealed. The access is logged to the immutable audit trail with your identity and reason.'); render(); return; }
    var ia = e.target.getAttribute('data-iris-ask'); if (ia) { UI.iris.ask(ia); return; }
    var fu = e.target.closest('[data-flowunit]'); if (fu) { flowUnit = fu.getAttribute('data-flowunit'); render(); return; }
    var itRow = e.target.closest('[data-item]'); if (itRow) { curItem = itRow.getAttribute('data-item'); render(); return; }
    if (e.target.closest('[data-item-back]')) { curItem = null; render(); return; }
    var ro = e.target.getAttribute('data-reorder'); if (ro) { UI.toast('Reorder sent', ro + ' reorder routed to Relay for serialised, cold-chain delivery.'); return; }
    var stEl = e.target.closest('[data-staff]'); if (stEl) { curStaff = stEl.getAttribute('data-staff'); render(); return; }
    if (e.target.closest('[data-staff-back]')) { curStaff = null; render(); return; }
    var nn = e.target.getAttribute('data-newnote'); if (nn) { mod = 'documentation'; noteDraft = { pt: nn, mode: 'translate', stage: 'start' }; render(); return; }
    var sn = e.target.getAttribute('data-startnote'); if (sn) {
      noteDraft = { pt: curPatientId || 'PT-AMARA', mode: sn, stage: 'capturing' };
      render();
      setTimeout(function () { if (noteDraft) { noteDraft.stage = 'drafted'; render(); } }, UI.reduce ? 10 : 1600);
      return;
    }
    if (e.target.matches('[data-signnote]')) {
      var who = SESSION && SESSION.roleLabel ? (cur.persona.name) : cur.persona.name;
      var p = patientById(noteDraft.pt);
      notes.unshift({ id: 'N-' + rnd(900, 999), pt: noteDraft.pt, type: noteDraft.mode === 'translate' ? 'Conversation note' : 'Dictated note', by: cur.persona.name, when: 'today', signed: true });
      X.append('CLINICAL_NOTE', { patient: noteDraft.pt, patientName: p ? p.name : '', orgId: cur.id, mode: noteDraft.mode }, { app: 'apex', persona: cur.persona.id });
      UI.toast('Note signed', 'Signed by ' + cur.persona.name + '. Orders and problems released to the record and the HIE.');
      noteDraft = null; render(); return;
    }
    if (e.target.matches('[data-discardnote]')) { noteDraft = null; render(); return; }
    if (e.target.matches('[data-gic-publish]')) { var v = collectEESG().filter(function (x) { return x.status === 'Verified' && x.gic; }); X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: avoided() + ' readmissions avoided, ' + v.length + ' verified outcomes', status: 'Verified' }, { app: 'apex', persona: cur.persona.id }); UI.toast('Published to GIC', cur.name + ' posted ' + v.length + ' verified outcomes to the Commons.'); }
  });

  X.subscribe(function (ev) { if (ev) { if (mod === 'intake' || mod === 'command' || mod === 'flow' || mod === 'orders') render(); else paintLive(false); } });
  UI.watchToasts(function (ev) {
    if (ev.type === 'REFERRAL' && ev.actor && ev.actor.app === 'bridge') return { k: 'Bridge', msg: esc(ev.payload.patientName) + ' referred from ' + esc(ev.payload.village) + '.' };
    if (ev.type === 'LAB_RESULT') return { k: 'Prism', msg: 'Result returned for ' + esc(ev.payload.testName || 'a test') + '.' };
    return null;
  });

  function greetingFor(r) {
    if (r === 'nurse') return 'IRIS here. Ask about your patients or let me draft a note.';
    if (r === 'doctor') return 'IRIS here. Ask me about a patient or their risk.';
    if (r === 'quality') return 'IRIS here. Ask where quality is slipping.';
    return 'IRIS here. Ask what needs attention.';
  }

  window.QareAuth.boot({
    app: 'Apex', product: 'apex', sector: 'provider',
    roles: [
      { id: 'admin', label: 'Administrator' },
      { id: 'doctor', label: 'Physician' },
      { id: 'nurse', label: 'Nurse' },
      { id: 'quality', label: 'Quality & Safety' }
    ],
    onReady: function (session) {
      SESSION = session;
      UI.iris.mount({ getContext: irisContext, answer: irisAnswer, greeting: greetingFor(session.role) });
      seedState(); render(); setInterval(tick, 1000);
    }
  });
})();
</script>
</body>
</html>
