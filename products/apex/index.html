  function dayIn(dc) { return Math.min(30, Math.floor((Date.now() + acc - dc.at) / 86400000)); }

  /* ---------- health outcomes: the only thing that tokenizes ----------
     An outcome is a measured improvement in health, over time, linked to an
     intervention. Staying out of hospital is not one. A record counts only if it
     has a baseline, an intervention link in the HIE, a follow-up after the
     protocol window, an independent source and a clinically meaningful change.
     Only cohorts of MIN_COHORT people or more are published, anonymised. */
  var MIN_COHORT = 5;
  var OUTCOME_DEFS = {

    ],

    ]
  };
  OUTCOME_DEFS['PROF-RES'] = OUTCOME_DEFS['PROF-SNF'];
  function fnv(str) { var h = 0x811c9dc5; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return ('00000000' + h.toString(16)).slice(-8); }
  function merkleRoot(leaves) { if (!leaves.length) return '--------'; var lvl = leaves.slice(); while (lvl.length > 1) { var nx = []; for (var i = 0; i < lvl.length; i += 2) nx.push(fnv(lvl[i] + (lvl[i + 1] || lvl[i]))); lvl = nx; } return lvl[0]; }
  function buildOutcomes() {
    var defs = OUTCOME_DEFS[cur.id] || OUTCOME_DEFS['PROF-HOSP'], out = [];
    for (var i = 0; i < 27; i++) {
      var df = defs[i % 2], k = i % 9, j = Math.floor(i / 2) % df.base.length, dd = df.d[j], sgn = df.better === 'down' ? -1 : 1;
      var o = { id: 'OUT-' + (100 + i), subject: 'P-' + (4096 + i * 37).toString(16), measure: df.m, unit: df.u, better: df.better, mcid: df.mcid, win: df.win,
        baseline: df.base[j], follow: 0, reported: null, intervention: df.iv[j % df.iv.length], linked: true, independent: true, source: df.src, day0: df.win + 3 };
      var delta = dd;
      if (k === 4) o.day0 = df.win - 2;                                  // follow-up not due yet
      if (k === 5) o.linked = false;                                       // improved, but no intervention link
      if (k === 6) delta = df.mcid * 0.4;                                  // improved, below a meaningful change
      if (k === 7) { o.reported = Math.round((o.baseline + sgn * dd) * 10) / 10; delta = dd * 0.2; } // facility claimed more than the record shows
      if (k === 8) delta = -df.mcid * 0.3;                                 // no improvement
      o.follow = Math.round((o.baseline + sgn * delta) * 10) / 10;
      out.push(o);
    }
    return out;
  }
  function outcomeEval(o) {
    var el = o.day0 + Math.floor(acc / 86400000);
    if (o.baseline == null) return { s: 'Unmeasured', why: 'No baseline measure' };
    if (el < o.win) return { s: 'Claimed', why: 'Follow-up not due until day ' + o.win + ' (day ' + el + ')', pending: true };
    if (!o.linked) return { s: 'Claimed', why: 'Improvement has no intervention link in the HIE' };
    if (!o.independent) return { s: 'Claimed', why: 'Facility-reported only' };
    if (o.reported != null && Math.abs(o.reported - o.follow) > o.mcid * 0.5) return { s: 'Inconsistent', why: 'Facility reported ' + o.reported + ', the record shows ' + o.follow };
    var delta = o.better === 'down' ? o.baseline - o.follow : o.follow - o.baseline;
    if (delta >= o.mcid) return { s: 'Verified', why: 'Meaningful improvement, independent record', delta: delta };
    if (delta > 0) return { s: 'Claimed', why: 'Improved, below the meaningful threshold' };
    return { s: 'Unmeasured', label: 'Not improved', why: 'No improvement at follow-up, so not an outcome' };
  }
  function outcomeTrace(o) { return fnv([o.id, o.subject, o.measure, o.baseline, o.follow, o.win, o.intervention, o.source].join('|')); }
  function outcomeGroups() {
    var g = {}, order = [];
    outcomes.forEach(function (o) {
      if (!g[o.measure]) { g[o.measure] = { measure: o.measure, unit: o.unit, better: o.better, win: o.win, n: 0, deltas: [], traces: [] }; order.push(o.measure); }
      var ev = outcomeEval(o);
      if (ev.s === 'Verified') { g[o.measure].n++; g[o.measure].deltas.push(ev.delta); g[o.measure].traces.push(outcomeTrace(o)); }
    });
    return order.map(function (m) {
      var x = g[m], d = x.deltas.slice().sort(function (a, b) { return a - b; }), h = Math.floor(d.length / 2);
      x.median = !d.length ? 0 : d.length % 2 ? d[h] : (d[h - 1] + d[h]) / 2; return x;
    });
  }
  function outcomeVerifiedCount() { return outcomes.filter(function (o) { return outcomeEval(o).s === 'Verified'; }).length; }
  function outcomeRoot() { var t = []; outcomeGroups().forEach(function (g) { if (g.n >= MIN_COHORT) t = t.concat(g.traces); }); return merkleRoot(t); }

  function beds() { var t = 0, o = 0; cur.units.forEach(function (u) { t += u.total; o += u.occ; }); o += X.admissions().filter(function (a) { return a.orgId === cur.id; }).length; return { total: t, occ: Math.min(t, o) }; }
  function receivingOrg() { var id = X.care.RECEIVING.filter(function (i) { return X.org(i) && X.org(i).name === cur.name; })[0]; return id ? X.org(id) : null; }
  function clinicRefs() { var o = receivingOrg(); return o ? X.care.referrals({ toOrgId: o.id }) : []; }
  function clinicPending() { return clinicRefs().filter(function (r) { return r.status === 'sent'; }); }
  function clinicReferralsHTML() {
    var o = receivingOrg(); if (!o) return '';
    var list = clinicRefs();

  function moduleByKey(k) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].key === k) return MODULES[i]; return null; }

  /* ---------- per-profile manifest + overrides ---------- */
  var MANIFEST = {
    'PROF-HOSP': ['command', 'intake', 'flow', 'emergency', 'theatre', 'transitions', 'staffing', 'inventory', 'chart', 'documentation', 'quality', 'medication', 'accreditation', 'orders', 'billing', 'finance', 'integration', 'compliance', 'environment', 'adoption', 'system', 'roi', 'references', 'eesg', 'impact', 'library'],
    'PROF-SNF': ['command', 'intake', 'flow', 'transitions', 'staffing', 'inventory', 'chart', 'documentation', 'assessments', 'quality', 'medication', 'accreditation', 'orders', 'billing', 'finance', 'integration', 'compliance', 'environment', 'adoption', 'system', 'roi', 'references', 'eesg', 'impact', 'library'],
    'PROF-RES': ['command', 'intake', 'flow', 'transitions', 'staffing', 'inventory', 'chart', 'documentation', 'assessments', 'quality', 'medication', 'billing', 'finance', 'integration', 'compliance', 'environment', 'adoption', 'system', 'roi', 'references', 'eesg', 'impact', 'library']
  };
  var overrides = {};
  function baseEnabled(id) { return (MANIFEST[id] || []).slice(); }
  function isOn(key) { var o = overrides[cur.id] || {}; if (key in o) return o[key]; return baseEnabled(cur.id).indexOf(key) >= 0; }
  function enabledMods() { return MODULES.filter(function (m) { return isOn(m.key); }); }
  function navModules() { return enabledMods().map(function (m) { var o = { key: m.key, label: m.label, ic: m.ic, group: m.group }; if (m.key === 'intake') { var n = incoming().length; if (n) o.badge = n; } if (m.key === 'transitions' && inWindow().filter(function (d) { return d.risk === 'high'; }).length) { o.badge = inWindow().filter(function (d) { return d.risk === 'high'; }).length; } return o; }); }

  /* ---------- EESG rollup, generated from enabled modules ---------- */
  function collectEESG() {
    var out = [];
    enabledMods().forEach(function (m) {
      (m.rails.eesg || []).forEach(function (met) {
        out.push({ pillar: met.pillar, front: met.front, measure: met.measure, value: met.valueFn ? met.valueFn() : met.value, status: met.statusFn ? met.statusFn() : met.status, from: m.label, gic: !!m.rails.gic });
      });
    });
    return out;
  }
  function eesgGridHTML() {
    var mets = collectEESG(), pillars = X.FRAMEWORK.pillars;
    return '<div class="eesg">' + pillars.map(function (p) {
      var rows = mets.filter(function (m) { return m.pillar === p; });
      return '<div class="pillar"><h4>' + esc(p) + '</h4>' + (rows.length ? rows.map(function (m) {
        return '<div class="met"><div class="mv"><span class="mn">' + esc(m.measure) + '</span>' + UI.statusChip(m.status) + '</div><div class="mv"><span class="mnum">' + esc(m.value) + '</span><span class="src">' + esc(m.from) + '</span></div></div>';
      }).join('') : '<div class="empty">No enabled module emits here.</div>') + '</div>';
    }).join('') + '</div>';
  }
  function libRows() {
    var out = '', lastG = null;
    MODULES.forEach(function (m) {
      if (m.group !== lastG) { out += '<tr class="grp-row"><td colspan="4">' + esc(m.group) + '</td></tr>'; lastG = m.group; }
      var on = isOn(m.key);
      out += '<tr><td style="width:40px"><button class="toggle' + (on ? ' on' : '') + (m.core ? ' locked' : '') + '" data-toggle="' + esc(m.key) + '"' + (m.core ? ' disabled title="core module, always on"' : '') + '></button></td>' +
        '<td><div class="nm">' + esc(m.label) + '</div><div class="ds">' + esc(m.desc) + '</div></td><td>' + railChips(m) + '</td><td class="sub2">' + (m.core ? 'core' : on ? 'enabled' : 'available') + '</td></tr>';
    });
    return out;
  }

  /* ---------- IRIS ---------- */
  function irisContext() {
    var m = moduleByKey(mod) || {};
    var sMap = {
      command: ['What needs me now?', 'Who is at readmission risk?', 'How full are we?'],
      chart: ['Open the chart', 'Who should I see first?'],
      documentation: ['Draft a note by voice', 'Capture a patient conversation'],

      flow: ['How full are we?'], staffing: ['Is night staffing safe?'],
      quality: ['What is our readmission rate?'], intake: ['What is waiting?'],

      impact: ['What can we raise capital against?'], library: ['What should a nursing home turn on?'],
      environment: ['Where is our footprint worst?'], billing: ['Why is affordability flagged?'],
      compliance: ['What is HIPAA compliance?', 'Show the model card', 'How does break-glass work?'],
      integration: ['What EHRs do you connect to?', 'Show ONC certification', 'How does coexistence work?'],

    };
    return { label: m.label || '', suggestions: sMap[mod] || [] };
  }
  function role() { return SESSION ? SESSION.role : 'admin'; }
  function irisAnswer(q) {
    var s = q.toLowerCase(), m = moduleByKey(mod) || {}, agents = m.agents || ['Telos'], b = beds(), r = role();
    function A(t, acts) { return { text: t, agents: agents, actions: acts || [] }; }
    // Role-aware framing: IRIS answers the person in front of it.
    if (/what needs me|right now|my (day|list|tasks|shift)/.test(s)) {
      if (r === 'nurse') return A('Your shift: ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' post-discharge patients at high risk need a call, vitals are due in ' + cur.units[0].name + ', and one note is waiting to be signed. Night staffing is thin. I can draft notes by voice or capture a patient conversation. A clinician signs every order.', [{ label: 'Open my patients', kind: 'evidence', q: 'who is at readmission risk?' }]);
      if (r === 'doctor') return A('Clinically: ' + (patientById('PT-AMARA').name) + ' is day 3 post-discharge, BP 148/92 and HbA1c 8.1%, flagged high risk, likely adherence. ' + patientById('PT-RAHIM').name + ' is day 11, BNP rising. Review both. The record supports a dietitian referral and adherence counselling; you decide and sign.', [{ label: 'Open the chart', kind: 'evidence', q: 'open the chart' }]);
      if (r === 'quality') return A('Quality view: ' + openDevs().length + ' open deviations, readmission rate ' + readmitRate().toFixed(1) + '%, HAI 1.9%, falls 2.4 per 1k bed-days. One cold-chain deviation is gating a lot. Survey readiness is green except the SNF staffing star.', [{ label: 'Open Quality', kind: 'evidence', q: 'what is our readmission rate?' }]);
      return A('Operations: occupancy ' + Math.round(b.occ / b.total * 100) + '%, ' + inWindow().length + ' in the discharge window with ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' high risk, night staffing below target. ' + avoided() + ' patients have cleared the 30-day window, a utilization indicator. The decisions are in Command.', [{ label: 'Open Command', kind: 'evidence', q: 'how full are we?' }]);
    }
    if (/what counts|avoided|outcome|tokeni[sz]e|token/.test(s)) return A('A health outcome is a measured improvement in health, over time, linked to an intervention: a baseline, an intervention link in the HIE, a follow-up after the protocol window, an independent record, and a change that clears the clinical threshold. A patient staying out of hospital is a utilization indicator, not an outcome, so it is never tokenized and no one is rewarded for it.', [{ label: 'Open Impact', kind: 'evidence', q: 'What can we raise capital against?' }]);
    if (/chart|record|patient|holistic/.test(s)) return A('The chart is the native record plus labs from Prism and medications from Cura over the HIE, de-duplicated with provenance on every element. ' + patientById('PT-AMARA').name + ' is the high-risk post-discharge patient to see first.', [{ label: 'Open the chart', kind: 'evidence', q: 'open the chart' }]);
    if (/note|voice|dictat|scribe|translat|conversation|bangla|language/.test(s)) return A('I can draft a note from your voice, or capture a patient conversation in ' + patientById('PT-AMARA').lang + ' and store it in English so the record stays consistent, with the original transcript kept. I structure and code it; a clinician reviews and signs. I never sign.', [{ label: 'Start a note', kind: 'evidence', q: 'open documentation' }]);
    if (/loop|referral status|closed/.test(s)) return A('Referrals run a closed loop: sent, received, accepted, scheduled, seen, reported, closed. ' + discharges.filter(function (d) { return d.loop && d.loop !== 'closed'; }).length + ' are open in the loop; an open loop past its SLA is flagged so nothing is sent and forgotten.', [{ label: 'Open Transitions', kind: 'evidence', q: 'explain the 30-day flow' }]);
    if (/readmiss|transition|window|discharge|30/.test(s)) return A('Discharge writes to the HIE and starts a 30-day clock. ' + inWindow().length + ' patients are in the window, ' + inWindow().filter(function (d) { return d.risk === 'high'; }).length + ' at high risk. A decline routes them back here, not the ED. ' + avoided() + ' have cleared the window so far, a utilization indicator that does not tokenize. The rate is ' + readmitRate().toFixed(1) + '%.', [{ label: 'Open Transitions', kind: 'evidence', q: 'Who is high risk?' }]);
    if (/risk|high/.test(s)) { var h = inWindow().filter(function (d) { return d.risk === 'high'; }); return A(h.length ? h.map(function (d) { return d.patient + ' (day ' + dayIn(d) + ')'; }).join(', ') + ' ' + (h.length === 1 ? 'is' : 'are') + ' at high readmission risk. Home health flagged a decline. My read: bring them back to the facility, not the ED. A clinician decides.' : 'No one is at high risk in the window right now.', [{ label: 'Route to facility', reply: 'Readmission routed to the facility, not the ED. A clinician confirms the bed.' }]); }
    if (/full|occup|bed|census/.test(s)) return A('Occupancy is ' + Math.round(b.occ / b.total * 100) + '%, ' + b.occ + ' of ' + b.total + ' beds. ' + (b.total - b.occ) + ' free. Discharges ready today would free more and start their 30-day clocks.', []);
    if (/staff|ratio|night|five.?star/.test(s)) return A('Night ratio is 1:6.8, below target; day and evening are inside band. For a nursing facility this is the staffing standard, so it moves the standing of the facility. I would pull one agency nurse to nights. A manager signs the roster.', [{ label: 'Adjust roster', reply: 'One agency nurse moved to nights. The manager confirms the shift.' }]);
    if (/eesg|framework|position|verified/.test(s)) { var mets = collectEESG(), v = mets.filter(function (x) { return x.status === 'Verified'; }).length; return A('Across ' + enabledMods().length + ' enabled modules, ' + mets.length + ' EESG metrics emit, ' + v + ' Verified. The weak spots are out-of-pocket share and the night staffing ratio. Turn on more modules and the position fills in; it is generated, not written.', [{ label: 'Open EESG', kind: 'evidence', q: 'What is not verified?' }]); }
    if (/capital|gic|commons|raise|fund/.test(s)) return A('You raise against verified health outcomes: ' + outcomeVerifiedCount() + ' records pass all five tests (baseline, intervention link, follow-up, independent record, meaningful change), published only in anonymised cohorts of ' + MIN_COHORT + ' or more. Staying out of hospital is an indicator, not an outcome, and does not tokenize. Nothing unverified posts.', [{ label: 'Publish to GIC', reply: 'Verified cohorts staged for the Commons. A signatory approves it.' }]);
    if (/library|turn on|module|nursing|configure/.test(s)) return A('A skilled nursing facility runs Command, Intake, Flow, Transitions, Staffing, Assessments, Quality, Medication, Accreditation, Orders, Revenue cycle, Finance, Environment, plus the EESG and GIC rails. No ED, no theatre. A hospital adds those two; residential care drops assessments depth. Same code, different profile.', [{ label: 'Open the library', kind: 'evidence', q: 'What should a nursing home turn on?' }]);
    if (/intake|referral|waiting/.test(s)) { var inc = incoming(); return A(inc.length ? inc.length + ' referrals are waiting from Bridge, field-screened. Admitting writes an ADMISSION to the HIE and the bed count updates everywhere.' : 'No referrals waiting. They arrive live from Bridge over the HIE.', []); }
    if (/afford|out.?of.?pocket|billing/.test(s)) return A('Out-of-pocket share is 31%, flagged Inconsistent until the payer reconciliation in Shield closes. The facility cannot upgrade it by assertion; a matched claim does. Under ' + cur.cfg.payment + ' the claim ties to real admission and discharge events.', []);
    if (/environ|carbon|waste|water|energy/.test(s)) return A('Energy is 58 kWh per bed-day, water 410 L, medical waste 64% recycled, carbon 8% over target. Anaesthetic gases and single-use plastics are the overlooked lines. Each is an EESG emitter and a candidate for the carbon line on the Commons.', []);
    if (/hipaa|soc|trust vault|break.?glass|42 cfr|part 2|privacy/.test(s)) return A('The trust vault shows what the controls should look like: minimum necessary by default, break-glass logged with identity, protected behavioural-health notes sealed with double-key consent. It is an illustrative US-market example. No SOC 2 report or certification is held yet, so nothing there is marked Verified.', [{ label: 'Open Trust Vault', kind: 'evidence', q: 'show trust vault' }]);
    if (/model card|governance|drift|retrain|human.?in.?the.?loop/.test(s)) return A('The model card layout is real: intended use, validation cohort, sensitivity and specificity, calibration, drift thresholds. The figures on it are illustrative until a validation study is run on this facility\'s own data. The rule is not illustrative: every suggestion near a clinical decision needs a clinician to sign, and the model never auto-actions.', [{ label: 'Open Model Governance', kind: 'evidence', q: 'show model card' }]);
    if (/onc|fhir|uscdi|tefca|carequality|commonwell|certification|interop/.test(s)) return A('That page is an illustrative US-market example: ONC, TEFCA, Epic and PointClickCare. No certification is held and none of those connections is live. For other markets the standards differ, and a jurisdiction pack will replace it. FHIR R4 is the common base.', [{ label: 'Open Certification', kind: 'evidence', q: 'show certification' }]);
    if (/coexist|overlay|migration|ride|replace|rip/.test(s)) return A('Apex rides on top. It does not replace your EHR. The FHIR overlay reads from your system of record; your EHR is unchanged. Go-live is 4 to 6 weeks, no migration. If you remove the connection, your EHR is exactly as it was. Most facilities start and stay at Phase 1.', [{ label: 'Open Coexistence', kind: 'evidence', q: 'show coexistence' }]);
    if (/adopt|scribe|documentation time|click|nps/.test(s)) return A('Those adoption figures are illustrative targets, not measurements. Once clinicians use the product, each is computed from real usage data: session logs, edit distance between the AI draft and the signed note, and surveys at 30, 60 and 90 days.', [{ label: 'Open Adoption', kind: 'evidence', q: 'show adoption' }]);
    if (/multi.?facility|system view|roll.?up|whole.?person|cross.?setting/.test(s)) return A('Three facilities on one record: Hospital (180 beds, 82% occupancy), SNF (90 beds, 87%), Residential (60 beds, 80%). One patient, one record, across settings. The discharge opens a window; the SNF picks up the same chart; Bridge continues in the community; the patient sees it in Nova.', [{ label: 'Open System View', kind: 'evidence', q: 'show system view' }]);
    if (/roi|return|payback|hrrp|penalty|financial case|value driver/.test(s)) return A('The ROI page is a projection from illustrative assumptions, with every driver listed so the buyer can replace it with their own volumes and costs. The readmission-penalty driver appears only under the US pack. The point of the page is that no figure is a black box.', [{ label: 'Open ROI', kind: 'evidence', q: 'show ROI' }]);
    if (/case study|reference|analyst|proof|comparable/.test(s)) return A('Every reference on that page is a placeholder or a target. No case study, analyst rating or certificate is held yet, so none is marked Verified. Each becomes Verified when the real record is attached.', [{ label: 'Open References', kind: 'evidence', q: 'show references' }]);
    return A('I read that from ' + cur.name + '\'s own records on the HIE. Ask me about readmissions and the 30-day window, occupancy, staffing, quality, the EESG position or the capital ask. I advise; a licensed clinician makes every clinical call.');
  }

  /* ---------- render + live loop ---------- */
  function render() {
    if (!isOn(mod)) mod = 'command';
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Apex', personaName: cur.persona.name, personaRole: cur.persona.role + ' · ' + cur.name, role: SESSION ? SESSION.roleLabel : null, trustLabel: UI.trust.badgeLabel('provider') }) +
      '<div class="os">' + UI.osNav(navModules(), mod) +
        '<main class="os-main">' + UI.tenantBar(profileTabs(), cur.id) + '<div style="margin-top:16px">' + moduleByKey(mod).render() + '</div></main>' +
      '</div>' + UI.legalFooter({ sector: 'provider' });
    UI.iris.context();
    paintLive(true);
  }
  function paintLive(initial) {
    var b = beds();
    var kb = document.getElementById('k-beds'); if (kb) kb.textContent = b.occ + '/' + b.total;
    var kr = document.getElementById('k-ref'); if (kr) kr.textContent = incoming().length;
    var ki = document.getElementById('k-risk'); if (ki) ki.textContent = inWindow().filter(function (d) { return d.risk === 'high'; }).length;
    var krr = document.getElementById('k-rr'); if (krr) krr.textContent = readmitRate().toFixed(1) + '%';
    var kw = document.getElementById('k-inwin'); if (kw) kw.textContent = inWindow().length;
    var ka = document.getElementById('k-avoid'); if (ka) ka.textContent = avoided();
    if (!initial) { var tr = document.getElementById('ap-trans'); if (tr) tr.innerHTML = transitionRows(); }
  }
  function tick() {
    tickN++;
    acc += 6 * 3600000; // 6 simulated hours per second, so the 30-day clock visibly moves
    var changed = false;
    discharges.forEach(function (d) {
      if (d.status === 'in-window' && dayIn(d) >= 30) { d.status = 'cleared'; changed = true; }
    });
    // occasionally a rising case becomes high
    if (tickN % 7 === 0) { var r = inWindow().filter(function (d) { return d.risk === 'rising'; })[0]; if (r) { r.risk = 'high'; changed = true; } }
    var ov = outcomeVerifiedCount(); if (ov !== lastOv) { lastOv = ov; if (mod === 'impact') changed = true; }
    if (changed && (mod === 'transitions' || mod === 'command' || mod === 'impact')) render(); else paintLive(false);
  }

  /* ---------- events + actions ---------- */
  document.addEventListener('click', function (e) {
    var tn = e.target.getAttribute('data-tenant'); if (tn) { cur = profileById(tn); mod = 'command'; seedState(); render(); return; }
    var mm = e.target.closest('[data-mod]'); if (mm) { mod = mm.getAttribute('data-mod'); render(); return; }
    var tg = e.target.getAttribute('data-toggle'); if (tg) { var mobj = moduleByKey(tg); if (mobj && !mobj.core) { if (!overrides[cur.id]) overrides[cur.id] = {}; overrides[cur.id][tg] = !isOn(tg); render(); } return; }
    var ra = e.target.getAttribute('data-ref-accept'), rd = e.target.getAttribute('data-ref-decline'), rm = e.target.getAttribute('data-ref-admit');
    if (ra) { X.care.respondReferral({ referralId: ra, decision: 'accepted', unit: document.getElementById('ru-' + ra).value, by: cur.persona.name, personaId: cur.persona.id }); UI.toast('Accepted', 'The doctor and the patient are notified.'); render(); return; }
    if (rd) {
      var alt = document.getElementById('ra-' + rd).value;
      var rs = X.care.respondReferral({ referralId: rd, decision: 'declined', reason: document.getElementById('rr-' + rd).value, alternativeOrgId: alt || null, by: cur.persona.name, personaId: cur.persona.id });
      UI.toast(rs && rs.ok ? 'Declined' : 'Not sent', rs && rs.ok ? 'The doctor sees your reason.' : (rs ? rs.reason : '')); render(); return;
    }
    if (rm) { X.care.admit(rm, cur.id, cur.persona.id); UI.toast('Admitted', 'Bed state updated and the record is open.'); render(); return; }
    var hh = e.target.getAttribute('data-admit'); if (hh) { var r = X.referrals().filter(function (x) { return x.household === hh; })[0]; X.append('ADMISSION', { household: hh, patientName: r ? r.patientName : hh, orgId: cur.id }, { app: 'apex', persona: cur.persona.id }); UI.toast('Admitted', (r ? r.patientName : hh) + ' admitted. Bed state updated.'); render(); return; }
    var dp = e.target.getAttribute('data-discharge'); if (dp) {
      var dc = { id: 'DC-' + rnd(300, 999), patient: dp, at: Date.now(), risk: 'low', status: 'in-window', to: 'Union Health Outreach' };
      discharges.unshift(dc);
      X.append('DISCHARGE', { patient: dp, orgId: cur.id, window: 30 }, { app: 'apex', persona: cur.persona.id });
      X.append('REFERRAL', { patientName: dp, household: 'HH-' + dp.replace(/\W/g, ''), village: cur.name, reason: 'post-discharge home health', maker: 'ORG-NEXAGEN', to: 'home-health' }, { app: 'apex', persona: cur.persona.id });
      UI.toast('Discharged', dp + ' discharged. Home-health referral, transport and a 30-day clock started across the HIE.');
      render(); return;
    }
    var dec = e.target.getAttribute('data-decline'); if (dec) { var d1 = discharges.filter(function (x) { return x.id === dec; })[0]; if (d1) { d1.risk = 'high'; UI.toast('Decline flagged', d1.patient + ' flagged. IRIS raised readmission risk; route to the facility, not the ED.'); render(); } return; }
    var clr = e.target.getAttribute('data-clear'); if (clr) { var d2 = discharges.filter(function (x) { return x.id === clr; })[0]; if (d2) { d2.status = 'cleared'; d2.loop = 'closed'; UI.toast('Recovered', d2.patient + ' cleared the window. Counted as a utilization indicator; a health outcome needs a measured improvement.'); render(); } return; }
    var ptEl = e.target.closest('[data-patient]'); if (ptEl) { var pv = ptEl.getAttribute('data-patient'); curPatientId = pv || null; if (pv) mod = 'chart'; chartDomain = 'whole'; glass = {}; render(); return; }
    if (e.target.closest('[data-pii]')) { piiBlur = !piiBlur; render(); return; }
    var dmn = e.target.getAttribute('data-domain'); if (dmn) { chartDomain = dmn; render(); return; }
    var gl = e.target.getAttribute('data-glass'); if (gl) { glass[gl] = true; UI.toast('Break glass', 'Protected note unsealed. The access is logged to the immutable audit trail with your identity and reason.'); render(); return; }
    var ia = e.target.getAttribute('data-iris-ask'); if (ia) { UI.iris.ask(ia); return; }
    var fu = e.target.closest('[data-flowunit]'); if (fu) { flowUnit = fu.getAttribute('data-flowunit'); render(); return; }
    var itRow = e.target.closest('[data-item]'); if (itRow) { curItem = itRow.getAttribute('data-item'); render(); return; }
    if (e.target.closest('[data-item-back]')) { curItem = null; render(); return; }
    var ro = e.target.getAttribute('data-reorder'); if (ro) { UI.toast('Reorder sent', ro + ' reorder routed to Relay for serialised, cold-chain delivery.'); return; }
    var stEl = e.target.closest('[data-staff]'); if (stEl) { curStaff = stEl.getAttribute('data-staff'); render(); return; }
    if (e.target.closest('[data-staff-back]')) { curStaff = null; render(); return; }
    var nn = e.target.getAttribute('data-newnote'); if (nn) { mod = 'documentation'; noteDraft = { pt: nn, mode: 'translate', stage: 'start' }; render(); return; }
    var sn = e.target.getAttribute('data-startnote'); if (sn) {
      noteDraft = { pt: curPatientId || 'PT-AMARA', mode: sn, stage: 'capturing' };
      render();
      setTimeout(function () { if (noteDraft) { noteDraft.stage = 'drafted'; render(); } }, UI.reduce ? 10 : 1600);
      return;
    }
    if (e.target.matches('[data-signnote]')) {
      var who = SESSION && SESSION.roleLabel ? (cur.persona.name) : cur.persona.name;
      var p = patientById(noteDraft.pt);
      notes.unshift({ id: 'N-' + rnd(900, 999), pt: noteDraft.pt, type: noteDraft.mode === 'translate' ? 'Conversation note' : 'Dictated note', by: cur.persona.name, when: 'today', signed: true });
      X.append('CLINICAL_NOTE', { patient: noteDraft.pt, patientName: p ? p.name : '', orgId: cur.id, mode: noteDraft.mode }, { app: 'apex', persona: cur.persona.id });
      UI.toast('Note signed', 'Signed by ' + cur.persona.name + '. Orders and problems released to the record and the HIE.');
      noteDraft = null; render(); return;
    }
    if (e.target.matches('[data-discardnote]')) { noteDraft = null; render(); return; }
    var ct = e.target.getAttribute('data-comptab'); if (ct) { compTab = ct; render(); return; }
    var it = e.target.getAttribute('data-inttab'); if (it) { intTab = it; render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      var pg = outcomeGroups().filter(function (g) { return g.n >= MIN_COHORT; });
      var vm = collectEESG().filter(function (x) { return x.status === 'Verified' && x.gic && x.from !== 'Impact & GIC'; });
      if (!pg.length) { UI.toast('Nothing to publish', 'No outcome cohort has reached ' + MIN_COHORT + ' verified people yet. Unverified results are never posted.'); return; }
      var pn = pg.reduce(function (a, g) { return a + g.n; }, 0);
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: pn + ' verified health outcomes in ' + pg.length + ' cohorts, ' + vm.length + ' verified framework metrics', status: 'Verified', cohortFloor: MIN_COHORT, root: outcomeRoot(), outcomes: pg.map(function (g) { return { measure: g.measure, n: g.n, median: Math.round(g.median * 10) / 10, unit: g.unit, windowDays: g.win, better: g.better }; }) }, { app: 'apex', persona: cur.persona.id });
      UI.toast('Published to GIC', cur.name + ' posted ' + pn + ' verified outcomes in ' + pg.length + ' anonymised cohorts. Root ' + outcomeRoot() + '.');
    }
  });

  X.subscribe(function (ev) { if (ev) { if (mod === 'intake' || mod === 'command' || mod === 'flow' || mod === 'orders') { var ae = document.activeElement; if (!(mod === 'intake' && ae && ae.tagName === 'SELECT')) render(); } else paintLive(false); } });
  UI.watchToasts(function (ev) {
    if (ev.type === 'REFERRAL' && ev.actor && ev.actor.app === 'bridge') return { k: 'Bridge', msg: esc(ev.payload.patientName) + ' referred from ' + esc(ev.payload.village) + '.' };
    if (ev.type === 'CLINIC_REFERRAL') return { k: 'Pulse', msg: esc(ev.payload.patientName) + ' referred by ' + esc(ev.payload.referrer) + ' (' + esc(ev.payload.urgency) + ').' };
    if (ev.type === 'LAB_RESULT') return { k: 'Prism', msg: 'Result returned for ' + esc(ev.payload.testName || 'a test') + '.' };
    return null;
  });

  function greetingFor(r) {
    if (r === 'nurse') return 'IRIS here. Ask about your patients or let me draft a note.';
    if (r === 'doctor') return 'IRIS here. Ask me about a patient or their risk.';
    if (r === 'quality') return 'IRIS here. Ask where quality is slipping.';
    return 'IRIS here. Ask what needs attention.';
  }

  window.QareAuth.boot({
    app: 'Apex', product: 'apex', sector: 'provider',
    roles: [
      { id: 'admin', label: 'Administrator' },
      { id: 'doctor', label: 'Physician' },
      { id: 'nurse', label: 'Nurse' },
      { id: 'quality', label: 'Quality & Safety' }
    ],
    onReady: function (session) {
      SESSION = session;
      UI.iris.mount({ getContext: irisContext, answer: irisAnswer, greeting: greetingFor(session.role) });
      seedState(); render(); setInterval(tick, 1000);
    }
  });
})();
</script>
</body>
</html>
