<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Apex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('apex');
  var orgs = X.orgsFor('apex');
  var cur = X.org('ORG-HOSPITAL');
  var mod = 'command';

  function scale() { return cur.sizeClass === 'LARGE' ? 3 : cur.sizeClass === 'MEDIUM' ? 1 : 0.35; }

  var WARDS = [
    { name: 'General medicine', total: 60, occ: 51 },
    { name: 'Surgery', total: 40, occ: 33 },
    { name: 'Maternity', total: 30, occ: 27 },
    { name: 'Paediatrics', total: 28, occ: 19 },
    { name: 'ICU', total: 12, occ: 11 },
    { name: 'Isolation', total: 10, occ: 3 }
  ];
  var THEATRE = [
    { time: '08:00', proc: 'Caesarean section', surgeon: 'Dr. Ara', theatre: 'OT-1', status: 'In theatre' },
    { time: '09:30', proc: 'Appendectomy', surgeon: 'Dr. Rahman', theatre: 'OT-2', status: 'Scheduled' },
    { time: '11:00', proc: 'ORIF femur', surgeon: 'Dr. Sen', theatre: 'OT-1', status: 'Delayed' },
    { time: '13:00', proc: 'Cataract', surgeon: 'Dr. Noor', theatre: 'OT-3', status: 'Scheduled' }
  ];
  var TRIAGE = [
    { pt: 'Unknown male, ~40', cat: 'Red', complaint: 'Chest pain, diaphoretic', wait: '0 min' },
    { pt: 'F. Akter, 28', cat: 'Yellow', complaint: 'High fever, 3 days', wait: '18 min' },
    { pt: 'Child, 6', cat: 'Yellow', complaint: 'Dehydration', wait: '22 min' },
    { pt: 'M. Islam, 54', cat: 'Green', complaint: 'Laceration, stable', wait: '40 min' }
  ];
  var STOCK = [
    { item: 'Oxygen cylinders', onHand: 22, par: 30, status: 'low' },
    { item: 'IV fluids (NS)', onHand: 310, par: 200, status: 'ok' },
    { item: 'Blood (O-)', onHand: 4, par: 10, status: 'low' },
    { item: 'Insulin', onHand: 85, par: 60, status: 'ok' }
  ];
  var INCIDENTS = [
    { id: 'INC-204', type: 'Medication near-miss', ward: 'General medicine', sev: 'Moderate', status: 'Investigating' },
    { id: 'INC-205', type: 'Patient fall', ward: 'Surgery', sev: 'Minor', status: 'Closed' }
  ];

  var MODS = [
    { key: 'command', label: 'Command', ic: 'CM', group: 'Today' },
    { key: 'intake', label: 'Referral intake', ic: 'RI', group: 'Today' },
    { key: 'emergency', label: 'Emergency', ic: 'ER', group: 'Today' },
    { key: 'beds', label: 'Beds and wards', ic: 'BW', group: 'Operations' },
    { key: 'theatre', label: 'Theatre', ic: 'OT', group: 'Operations' },
    { key: 'census', label: 'Patient census', ic: 'PC', group: 'Operations' },
    { key: 'pharmacy', label: 'Pharmacy and stock', ic: 'PH', group: 'Operations' },
    { key: 'billing', label: 'Billing', ic: 'BL', group: 'Back office' },
    { key: 'quality', label: 'Quality and incidents', ic: 'QI', group: 'Oversight' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function catChip(c) { var m = { Red: 'inconsistent', Yellow: 'claimed', Green: 'verified' }; return '<span class="chip ' + m[c] + '">' + esc(c) + '</span>'; }

  function incoming() { var admitted = X.admissions().map(function (a) { return a.household; }); return X.referrals().filter(function (r) { return admitted.indexOf(r.household) < 0; }); }

  function moduleBody() {
    var inc = incoming();
    var bedsTotal = WARDS.reduce(function (a, w) { return a + w.total; }, 0);
    var bedsOcc = WARDS.reduce(function (a, w) { return a + w.occ; }, 0) + X.admissions().length;
    if (mod === 'command') {
      return head('Command', 'What needs the hospital now. Each line is one action. Referrals arrive live from community workers in Bridge.') +
        kpis([[bedsOcc + '/' + bedsTotal, 'beds occupied'], [inc.length, 'referrals waiting'], ['1', 'red in ED'], [THEATRE.filter(function (t) { return t.status === 'Delayed'; }).length, 'theatre delays']]) +
        '<div class="split"><div>' +
        card('Needs you', (inc.length ? inc.slice().reverse().map(function (r) {
          return row('<span class="sev warn"></span>Referral: ' + esc(r.patientName), esc(r.village) + ' &middot; ' + esc(r.reason), '<button class="btn btn-primary btn-sm" data-admit="' + esc(r.household) + '">Admit</button>');
        }).join('') : '') +
          row('<span class="sev crit"></span>Red triage in Emergency', 'Chest pain, unassigned bed', '<button class="btn btn-ghost btn-sm" data-mod="emergency">Open ED</button>') +
          row('<span class="sev warn"></span>ORIF femur delayed', 'OT-1 running over, 11:00 case', '<button class="btn btn-ghost btn-sm" data-mod="theatre">Theatre</button>') +
          row('<span class="sev warn"></span>Blood O- below par', '4 units on hand, par 10', '<button class="btn btn-ghost btn-sm" data-mod="pharmacy">Stock</button>')) +
        '</div><div>' +
        card('IRIS briefing', '<div class="sub" style="font-size:13px">Occupancy is ' + Math.round(bedsOcc / bedsTotal * 100) + '%. ICU is effectively full at 11 of 12. Two community referrals are waiting on a bed; both are maternity, where you have 3 free. Clear the ORIF delay or the afternoon list slips. A licensed clinician makes every call.</div>') +
        '</div></div>' + prov('reads referrals, admissions and the floor state from the exchange; posts nothing itself');
    }
    if (mod === 'intake') {
      return head('Referral intake', 'Community referrals from Bridge, with the field screening attached. Admit or redirect.') +
        (inc.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>From</th><th>Reason</th><th>Screening</th><th></th></tr></thead><tbody>' +
          inc.slice().reverse().map(function (r) {
            return '<tr><td class="nm">' + esc(r.patientName) + '</td><td>' + esc(r.village) + '</td><td>' + esc(r.reason) + '</td><td><span class="chip claimed">field-screened</span></td><td style="text-align:right"><button class="btn btn-primary btn-sm" data-admit="' + esc(r.household) + '">Admit</button></td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="card"><div class="sub">No referrals waiting. Open Bridge in another tab and refer a household; it appears here live.</div></div>') +
        prov('REFERRAL events from Bridge; admitting writes an ADMISSION back to the exchange');
    }
    if (mod === 'emergency') {
      return head('Emergency', 'Triage board, most acute first. Red is seen immediately.') +
        kpis([['1', 'red'], ['2', 'yellow'], ['1', 'green'], ['14 min', 'median wait']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>Category</th><th>Complaint</th><th>Waiting</th><th></th></tr></thead><tbody>' +
        TRIAGE.map(function (t) { return '<tr><td class="nm">' + esc(t.pt) + '</td><td>' + catChip(t.cat) + '</td><td>' + esc(t.complaint) + '</td><td class="mono">' + esc(t.wait) + '</td><td style="text-align:right"><button class="btn btn-ghost btn-sm">Assign bed</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('triage category drives the queue order, not arrival time');
    }
    if (mod === 'beds') {
      return head('Beds and wards', 'Live occupancy by ward. Each square is a bed.') +
        kpis([[bedsOcc + '/' + bedsTotal, 'occupied'], [Math.round(bedsOcc / bedsTotal * 100) + '%', 'occupancy'], [bedsTotal - bedsOcc, 'free'], ['2', 'blocked']]) +
        '<div class="cards3">' + WARDS.map(function (w) {
          var free = w.total - w.occ;
          return '<div class="card shadow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong style="font-size:14px">' + esc(w.name) + '</strong><span class="mono" style="font-size:12px">' + w.occ + '/' + w.total + '</span></div>' +
            '<div class="wardgrid">' + Array.apply(null, { length: w.total }).map(function (_, i) { return '<span class="bed ' + (i < w.occ ? 'occ' : (i === w.occ && free <= 2 ? 'free' : 'free')) + '"></span>'; }).join('') + '</div>' +
            '<div class="sub2" style="margin-top:8px;font-size:11px;color:var(--mid)">' + free + ' free</div></div>';
        }).join('') + '</div>' + prov('occupancy includes live admissions from the exchange');
    }
    if (mod === 'theatre') {
      return head('Theatre', 'Today\'s operating schedule across three theatres.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Time</th><th>Procedure</th><th>Surgeon</th><th>Theatre</th><th>Status</th></tr></thead><tbody>' +
        THEATRE.map(function (t) { var c = t.status === 'Delayed' ? 'inconsistent' : t.status === 'In theatre' ? 'claimed' : ''; return '<tr><td class="mono">' + esc(t.time) + '</td><td class="nm">' + esc(t.proc) + '</td><td>' + esc(t.surgeon) + '</td><td class="mono">' + esc(t.theatre) + '</td><td><span class="chip ' + c + '">' + esc(t.status) + '</span></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a delay cascades to every later case in the same theatre');
    }
    if (mod === 'census') {
      var n = Math.round(420 * scale());
      return head('Patient census', 'Inpatients by ward with length of stay and the responsible team.') +
        kpis([[n, 'inpatients'], ['4.2d', 'mean LOS'], ['12', 'discharges today'], ['3', 'awaiting discharge']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>Ward</th><th>Admitted</th><th>LOS</th><th>Team</th><th>Status</th></tr></thead><tbody>' +
        [['R. Begum', 'Maternity', '14 Oct', '2d', 'Obstetrics', 'Stable'], ['A. Khan', 'General medicine', '12 Oct', '4d', 'Medicine', 'Improving'], ['S. Roy', 'ICU', '11 Oct', '5d', 'Critical care', 'Critical'], ['T. Islam', 'Surgery', '15 Oct', '1d', 'Surgery', 'Post-op']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td class="mono">' + esc(r[3]) + '</td><td>' + esc(r[4]) + '</td><td>' + (r[5] === 'Critical' ? '<span class="chip inconsistent">Critical</span>' : '<span class="chip verified">' + esc(r[5]) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('every inpatient reads from and writes to the shared record');
    }
    if (mod === 'pharmacy') {
      return head('Pharmacy and stock', 'Hospital formulary stock against par levels. Two lines need action.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th class="num">On hand</th><th class="num">Par</th><th>Status</th><th></th></tr></thead><tbody>' +
        STOCK.map(function (s) { return '<tr><td class="nm">' + esc(s.item) + '</td><td class="num">' + s.onHand + '</td><td class="num">' + s.par + '</td><td>' + (s.status === 'low' ? '<span class="chip inconsistent">below par</span>' : '<span class="chip verified">ok</span>') + '</td><td style="text-align:right">' + (s.status === 'low' ? '<button class="btn btn-primary btn-sm">Requisition</button>' : '') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a requisition can route to Relay for serialised, cold-chain-aware delivery');
    }
    if (mod === 'billing') {
      return head('Billing', 'Accounts and out-of-pocket exposure. Claims route to the payer in Shield against the record.') +
        kpis([[money(Math.round(84000 * scale())), 'billed today'], ['31%', 'out of pocket'], ['18', 'claims to payer'], [money(Math.round(12400 * scale())), 'written off']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Out-of-pocket share is the EESG affordability signal, flagged Inconsistent until the payer reconciliation in Shield closes. The hospital cannot upgrade it by assertion; a matched claim does.</div></div>' +
        prov('claims are adjudicated in Shield against real dispensing and admission events');
    }
    if (mod === 'quality') {
      return head('Quality and incidents', 'Clinical incidents and the open investigations behind them.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Incident</th><th>Type</th><th>Ward</th><th>Severity</th><th>Status</th></tr></thead><tbody>' +
        INCIDENTS.map(function (i) { return '<tr><td class="mono">' + esc(i.id) + '</td><td class="nm">' + esc(i.type) + '</td><td>' + esc(i.ward) + '</td><td>' + (i.sev === 'Moderate' ? '<span class="chip claimed">Moderate</span>' : '<span class="chip">Minor</span>') + '</td><td>' + (i.status === 'Closed' ? '<span class="chip verified">Closed</span>' : '<span class="chip claimed">' + esc(i.status) + '</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('incidents feed the care-quality front of the impact framework');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The hospital\'s contribution to the EESG Health Impact framework, and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Admissions, quarter', value: String(Math.round(4820 * scale())), status: 'Verified' },
          { front: 'Care quality and safety', measure: 'Readmission rate', value: '6.1%', status: 'Claimed' },
          { front: 'Affordability and financial protection', measure: 'Out-of-pocket share', value: '31%', status: 'Inconsistent' }
        ] });
    }
    return '';
  }

  function card(title, inner) { return '<div class="card shadow" style="margin-bottom:14px"><div style="font-family:var(--font-brand);font-weight:700;font-size:14px;margin-bottom:10px">' + esc(title) + '</div>' + inner + '</div>'; }
  function row(left, sub, action) { return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline)"><div><div style="font-size:13px;font-weight:600">' + left + '</div><div class="sub2" style="margin-left:16px">' + sub + '</div></div>' + (action || '') + '</div>'; }

  function render() {
    var who = cur.personas[0];
    var inc = incoming().length;
    var mods = MODS.map(function (m) { return m.key === 'intake' ? Object.assign({}, m, { badge: inc || null }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Apex', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var hh = e.target.getAttribute('data-admit');
    if (hh) {
      var r = X.referrals().filter(function (x) { return x.household === hh; })[0];
      X.append('ADMISSION', { household: hh, patientName: r ? r.patientName : hh, orgId: cur.id }, { app: 'apex', persona: cur.personas[0].id });
      UI.toast('Admitted', (r ? r.patientName : hh) + ' admitted. Bed state updated.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Hospital access and quality, Q current', status: 'Verified' }, { app: 'apex', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'REFERRAL') return { k: 'Bridge', msg: esc(ev.payload.patientName) + ' referred from ' + esc(ev.payload.village) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
