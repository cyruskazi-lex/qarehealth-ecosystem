<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Nexus</title>
<meta name="description" content="Nexus, the operating system for pharma. A configurable element library, each module wired to the exchange, EESG and the GIC capital rail." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script src="../../assets/auth.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('nexus');
  var SESSION = null;

  var orgs = X.orgsFor('nexus');
  var cur = X.org('ORG-NEXAGEN');
  var mod = 'command';

  var REGIONS = ['Dhaka', 'Chattogram', 'Sylhet', 'Khulna', 'Rajshahi'];
  var seedById = {};
  var demand = [], cold = { series: [], breach: false, product: 'OncoNex-100', shipment: 'SHP-ONC-4471' };
  var stockoutAt = 0, tickN = 0;
  var held = {}, acked = {};

  // live state for the newly live modules
  var batches = [], deviations = [], scans = { serialized: 0, total: 0, blocked: 0, feed: [] };
  var env = { carbon: 12, water: 71, effluent: 'within', waste: 86 };
  var suppliers = [
    { name: 'Hovid API Works', material: 'API, cardiovascular', status: 'Qualified', score: 92 },
    { name: 'Gujarat Excipients', material: 'Excipients', status: 'Review', score: 74 },
    { name: 'DhakaPack Ltd', material: 'Primary packaging', status: 'At risk', score: 58 }
  ];

  function scale() { return cur.sizeClass === 'LARGE' ? 1 : cur.sizeClass === 'MEDIUM' ? 0.4 : 0.12; }
  function baseCount() { return cur.sizeClass === 'LARGE' ? 11 : cur.sizeClass === 'MEDIUM' ? 7 : 4; }
  function coverDays() { return cur.sizeClass === 'LARGE' ? 20 : cur.sizeClass === 'MEDIUM' ? 34 : 51; }
  function price(code) { var d = X.drug(code); return d ? d.unitPrice : 0; }
  function nameOf(code) { var d = X.drug(code); return d ? d.name : code; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function pushDemand(code, qty, region, ts, src, fresh) {
    demand.push({ id: 'd-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      code: code, name: nameOf(code), qty: qty, region: region, ts: ts, src: src, fresh: !!fresh });
    if (demand.length > 60) demand = demand.slice(-60);
  }
  function addDeviation(d) { if (!deviations.some(function (x) { return x.id === d.id; })) deviations.unshift(d); }

  function seedBaseline() {
    demand = []; seedById = {}; var now = Date.now(), n = baseCount();
    for (var i = 0; i < n; i++) {
      var code = Math.random() < 0.7 ? 'CARDINEX-10' : 'ONCONEX-100';
      pushDemand(code, code === 'ONCONEX-100' ? rnd(1, 3) : rnd(2, 9), pick(REGIONS), now - rnd(4, 180) * 60000, 'baseline', false);
    }
    demand.sort(function (a, b) { return a.ts - b.ts; });
    cold.series = []; for (var j = 0; j < 14; j++) cold.series.push(+(4.2 + Math.random() * 1.6).toFixed(1));
    cold.breach = false;
    stockoutAt = now + coverDays() * 86400000 + rnd(0, 20) * 3600000;
    batches = [
      { line: 'Line 1', product: 'CardiNex-10', batch: 'BATCH-CARD-0342', oee: 86, status: 'Running', progress: rnd(30, 70) },
      { line: 'Line 2', product: 'OncoNex-100', batch: 'BATCH-ONCO-0101', oee: 78, status: 'Running', progress: rnd(20, 55) },
      { line: 'Line 3', product: 'Metformin 500', batch: 'BATCH-MET-0590', oee: 81, status: 'Changeover', progress: rnd(5, 20) }
    ];
    deviations = [{ id: 'DV-0218', product: 'CardiNex-10', type: 'In-process', status: 'CAPA', note: 'tablet hardness drift on Line 1, CAPA open' }];
    var pk = cur.sizeClass === 'LARGE' ? 2400000 : cur.sizeClass === 'MEDIUM' ? 960000 : 288000;
    scans = { serialized: Math.round(pk * 0.98), total: pk, blocked: rnd(2, 7), feed: [] };
    env = { carbon: 12, water: 71, effluent: 'within', waste: 86 };
  }

  function foldExchange() {
    X.events().forEach(function (e) {
      if (seedById[e.id]) return;
      var p = e.payload || {};
      if (e.type === 'DEMAND_SIGNAL' && p.maker === 'ORG-NEXAGEN') {
        seedById[e.id] = 1; pushDemand(p.drug || 'CARDINEX-10', p.qty || 1, p.region || 'Dhaka', e.ts, 'exchange', true);
      } else if (e.type === 'RX_DISPENSED') {
        var code = p.drug || p.code, d = code ? X.drug(code) : null;
        if (d && d.maker === 'ORG-NEXAGEN') { seedById[e.id] = 1; pushDemand(code, p.qty || 1, p.region || 'Dhaka', e.ts, 'exchange', true); }
      } else if (e.type === 'COLD_CHAIN_ALERT' && (p.maker === 'ORG-NEXAGEN' || !p.maker)) {
        seedById[e.id] = 1; cold.breach = true; cold.product = p.product || cold.product; cold.shipment = p.shipment || cold.shipment;
        if (p.temp) cold.series.push(+p.temp);
        addDeviation({ id: 'DV-COLD-' + (p.shipment || 'X'), product: cold.product, type: 'Cold chain', status: 'Open', note: cold.shipment + ' out of 2 to 8 band, lot quarantined pending QP review' });
      }
    });
    demand.sort(function (a, b) { return a.ts - b.ts; });
  }

  function totals() { var u = 0, v = 0; demand.forEach(function (d) { u += d.qty; v += d.qty * price(d.code); }); return { units: u, value: v }; }
  function clockText() {
    var ms = Math.max(0, stockoutAt - Date.now());
    var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    return d + 'd ' + (h < 10 ? '0' : '') + h + 'h ' + (m < 10 ? '0' : '') + m + 'm ' + (s < 10 ? '0' : '') + s + 's';
  }
  function coldNow() { return cold.series[cold.series.length - 1]; }
  function serialPct() { return scans.total ? (scans.serialized / scans.total * 100) : 0; }
  function openDevs() { return deviations.filter(function (d) { return d.status !== 'Closed'; }); }

  /* ---------- small shared view helpers ---------- */
  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div>' +
    '<div class="actions"><span class="band"><span class="livedot"></span>one exchange, live</span></div></div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function kpiRow(items) { return '<div class="figs" style="margin-bottom:16px">' + items.map(function (a) {
    return '<div class="fig"><div class="fv' + (a[2] ? ' clock' : '') + '"' + (a[3] ? ' id="' + a[3] + '"' : '') + '>' + a[0] + '</div><div class="fk">' + esc(a[1]) + '</div></div>';
  }).join('') + '</div>'; }
  function node(ic, label, val, hot) { return '<div class="node' + (hot || '') + '"><div class="dot">' + ic + '</div><div class="nl">' + esc(label) + '</div><div class="nv">' + val + '</div></div>'; }
  function flowHTML() {
    var hot = cold.breach ? ' hot' : '';
    return '<div class="flow">' + node('API', 'Suppliers', suppliers.filter(function (s) { return s.status === 'Qualified'; }).length + '/' + suppliers.length + ' qualified', '') +
      '<div class="link"></div>' + node('PLT', 'Plant', '82% OEE', '') +
      '<div class="link"></div>' + node('SER', 'Serialise', '<span id="fl-ser">' + serialPct().toFixed(1) + '</span>%', '') +
      '<div class="link' + hot + '"></div>' + node('DST', 'Distribution', '<span id="fl-cold">' + coldNow() + '&deg;C</span>', hot) +
      '<div class="link"></div>' + node('RX', 'Pharmacy', '<span id="fl-sig">' + demand.length + '</span> signals', '') +
      '<div class="link"></div>' + node('PT', 'Patients', '1.8M reached', '') + '</div>';
  }
  function feedHTML(limit) {
    var rows = demand.slice(-(limit || 8)).reverse();
    return '<div class="feed" id="no-feed">' + (rows.length ? rows.map(function (d) {
      return '<div class="ev' + (d.fresh ? ' fresh' : '') + '"><span class="tm">' + UI.timeOf(d.ts) + '</span>' +
        '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + esc(d.name) + ' &middot; ' + d.qty + ' pack' + (d.qty > 1 ? 's' : '') + '</div>' +
        '<div class="sub2">' + esc(d.region) + ' &middot; ' + (d.src === 'exchange' ? 'live dispense from a connected pharmacy' : 'connected pharmacy') + '</div></div>' +
        '<span class="chip iris">reallocate</span></div>';
    }).join('') : '<div class="sub">Quiet. Dispense a Nexagen product in Cura and it lands here live.</div>') + '</div>';
  }
  function coldCardHTML() {
    var bars = cold.series.slice(-14).map(function (t) { return '<i class="' + (t > 8 || t < 2 ? 'hot' : '') + '" style="height:' + Math.max(8, Math.min(100, (t / 12) * 100)) + '%"></i>'; }).join('');
    return '<div class="card shadow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<div style="font-family:var(--font-brand);font-weight:700">Cold chain &middot; ' + esc(cold.product) + '</div>' +
      '<span class="chip ' + (cold.breach ? 'inconsistent' : 'verified') + '" id="no-coldchip">' + (cold.breach ? 'breach' : 'in band') + '</span></div>' +
      '<div class="spark" id="no-coldspark">' + bars + '</div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:6px"><span class="band">2 to 8&deg;C band</span><span class="band mono" id="no-coldnow">' + coldNow() + '&deg;C</span></div></div>';
  }
  function railChips(m) {
    var r = m.rails || {};
    return '<span class="rails">' +
      '<span class="rail exch ' + (r.exchange ? 'on' : '') + '">EXCH</span>' +
      '<span class="rail eesg ' + ((r.eesg && r.eesg.length) ? 'on' : '') + '">EESG</span>' +
      '<span class="rail gic ' + (r.gic ? 'on' : '') + '">GIC</span></span>';
  }

  // Second-level density for the operations surface: a week of throughput, a
  // quality-and-compliance glance, and system health. A Dir of Ops lands on a
  // full picture, not four tiles.
  function commandExtras() {
    var wk = [58, 64, 61, 73, 69, 81, Math.min(99, 60 + demand.length)];
    var bars = wk.map(function (h) { return '<i style="height:' + h + '%"></i>'; }).join('');
    return '<div class="cards3" style="margin-top:16px">' +
      '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Throughput, 7 days</div>' +
        '<div class="spark" style="height:48px">' + bars + '</div>' +
        '<div class="figs" style="margin-top:12px"><div class="fig"><div class="fv">' + (Math.round(1.8 * scale() * 10) / 10) + 'M</div><div class="fk">packs shipped, qtr</div></div><div class="fig"><div class="fv">99.1%</div><div class="fk">OTIF</div></div></div></div>' +
      '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Quality & compliance</div><div class="rows">' +
        glance('Batch release conformance', '98.7%', 'verified') + glance('Open deviations', String(openDevs().length), openDevs().length > 2 ? 'claimed' : 'verified') +
        glance('Serialised to last mile', serialPct().toFixed(1) + '%', serialPct() >= 98 ? 'verified' : 'claimed') + glance('Compliance frameworks live', '11 of 12', 'verified') + '</div></div>' +
      '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">System health</div><div class="rows">' +
        glance('Integrations healthy', '9 of 9', 'verified') + glance('Exchange latency', '48 ms', 'verified') +
        glance('Uptime, 90 days', '99.98%', 'verified') + glance('Security controls active', '12 of 12', 'verified') + '</div></div>' +
      '</div>';
  }
  function glance(label, val, cls) { return '<div class="row" style="padding:8px 10px"><span class="m">' + esc(label) + '</span><span style="display:flex;gap:8px;align-items:center"><span class="v">' + esc(val) + '</span><span class="chip ' + cls + '"></span></span></div>'; }

  /* ================= THE ELEMENT LIBRARY =================
     Each element declares its three-rail contract: which exchange events it reads
     and writes, which EESG metrics it emits, and whether its verified outcomes can
     publish to the GIC. The EESG and Impact views are generated from these
     declarations, so turning a module on wires it to EESG and GIC automatically. */

  function decisions() {
    var d = [];
    if (cold.breach && !held['LOT']) d.push({ sev: 'crit', t: 'Cold-chain breach, ' + cold.product, s: cold.shipment + ' out of band, hold the lot', act: 'hold', label: 'Hold the lot' });
    var last = demand[demand.length - 1];
    if (last && !acked['spike']) d.push({ sev: 'warn', t: 'Demand rising, ' + last.region, s: 'live dispensing is pulling stock, reallocate to cover it', act: 'reallocate', label: 'Reallocate 800 units' });
    if (!acked['eu']) d.push({ sev: 'warn', t: 'EU variation due in 46 days', s: 'two documents still missing on CardiNex-10', act: 'eu', label: 'Open filing' });
    if (suppliers.some(function (s) { return s.status === 'At risk'; }) && !acked['sup']) d.push({ sev: 'warn', t: 'Supplier at risk, DhakaPack Ltd', s: 'packaging score 58, qualify an alternate', act: 'sup', label: 'Qualify alternate' });
    if (held['LOT']) d.push({ sev: 'ok', t: 'Lot held, ' + cold.product, s: 'quarantined and customer notified, QP review open', act: null });
    return d;
  }
  function decList() {
    return decisions().map(function (x) {
      return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hairline)">' +
        '<span class="sev ' + x.sev + '" style="margin-top:6px"></span>' +
        '<div style="flex:1"><div style="font-size:13px;font-weight:600">' + esc(x.t) + '</div><div class="sub2">' + esc(x.s) + '</div></div>' +
        (x.act ? '<button class="btn btn-ghost btn-sm" data-act="' + x.act + '">' + esc(x.label) + '</button>' : '<span class="chip verified">done</span>') + '</div>';
    }).join('');
  }

  var MODULES = [
    { key: 'command', label: 'Command', ic: 'CM', group: 'Operate', core: true,
      desc: 'The operating surface across every enabled module.',
      rails: { exchange: ['DEMAND_SIGNAL', 'COLD_CHAIN_ALERT'], eesg: [], gic: false },
      agents: ['Supply', 'Quality', 'Regulatory', 'Finance'],
      render: function () {
        var t = totals();
        return head('Command', 'The operating surface. Live demand, the cold chain, serialisation, and the calls that cannot wait.') +
          kpiRow([[t.units, 'packs pulled, live', false, 'k-units'], [money(t.value, '$'), 'ex-factory value', false, 'k-value'], [clockText(), 'projected stockout', true, 'no-clock'], [openDevs().length, 'open deviations', false, 'k-dev']]) +
          flowHTML() +
          '<div class="split" style="margin-top:16px"><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:6px">Decisions waiting</div><div id="no-dec">' + decList() + '</div></div>' +
          '<div style="display:flex;flex-direction:column;gap:16px">' + coldCardHTML() +
          '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Live demand</div>' + feedHTML(5) + '</div></div></div>' +
          commandExtras() +
          prov('reads dispensing, cold-chain and serialisation events from the exchange; the operator acts, the system watches');
      } },

    { key: 'sop', label: 'Planning & S&OP', ic: 'SO', group: 'Operate',
      desc: 'Demand forecast reconciled against plant capacity, one number for commercial and operations.',
      rails: { exchange: ['DEMAND_SIGNAL'], eesg: [{ pillar: 'Economic', front: 'Affordability and financial protection', measure: 'Forecast accuracy, 3-month', value: '91%', unit: '', status: 'Claimed' }], gic: false },
      agents: ['Demand', 'Operations', 'Finance'],
      render: function () {
        var t = totals(), cap = Math.round(1200 * scale()), fc = Math.round(cap * 0.86);
        return head('Planning & S&OP', 'One reconciled plan. Live demand feeds the forecast; capacity gates it.') +
          kpiRow([[fc, 'forecast, packs/day', false], [cap, 'capacity, packs/day', false], ['91%', 'forecast accuracy', false], ['72%', 'capacity utilisation', false]]) +
          '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Demand to capacity</div>' +
          '<div class="sub2">Forecast vs capacity, CardiNex-10</div><div class="progress"><div class="fill" style="width:' + Math.min(100, fc / cap * 100) + '%"></div></div>' +
          '<div class="sub" style="font-size:13px;margin-top:12px">The forecast is built from the same live dispensing the rest of Nexus runs on, not a separate planning spreadsheet, so S&OP and operations never diverge. Current pull of ' + t.units + ' packs is tracking the forecast.</div></div>' +
          prov('demand forecast is derived from exchange dispensing, reconciled to plant capacity');
      } },

    { key: 'supply', label: 'Supply chain', ic: 'SC', group: 'Operate',
      desc: 'Live demand, cover, and the cold chain behind it.',
      rails: { exchange: ['DEMAND_SIGNAL', 'COLD_CHAIN_ALERT'], eesg: [{ pillar: 'Governance', front: 'Supply integrity and pharmacovigilance', measure: 'Cold-chain adherence', valueFn: function () { return cold.breach ? '96.1%' : '99.4%'; }, statusFn: function () { return cold.breach ? 'Inconsistent' : 'Verified'; } }], gic: true },
      agents: ['Supply', 'Logistics', 'Quality'],
      render: function () {
        var t = totals();
        return head('Supply chain', 'Demand pulled from real dispensing, the cover it burns, and the exceptions behind it.') +
          kpiRow([[t.units, 'packs pulled', false, 'k-units'], [clockText(), 'cover remaining', true, 'no-clock'], [suppliers.filter(function (s) { return s.status !== 'Qualified'; }).length, 'suppliers at risk', false], ['800', 'units to reallocate', false]]) +
          flowHTML() +
          '<div class="split" style="margin-top:16px"><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Live demand signals</div>' + feedHTML(8) + '</div><div>' + coldCardHTML() + '</div></div>' +
          prov('live dispensing replaces sampled quarterly data; the stockout clock is real');
      } },

    { key: 'procurement', label: 'Procurement', ic: 'PR', group: 'Operate',
      desc: 'Supplier qualification and inbound material risk, API to packaging.',
      rails: { exchange: [], eesg: [{ pillar: 'Governance', front: 'Supply integrity and pharmacovigilance', measure: 'Qualified suppliers', valueFn: function () { return Math.round(suppliers.filter(function (s) { return s.status === 'Qualified'; }).length / suppliers.length * 100) + '%'; }, statusFn: function () { return suppliers.some(function (s) { return s.status === 'At risk'; }) ? 'Inconsistent' : 'Verified'; } }], gic: false },
      agents: ['Procurement', 'Quality', 'Regulatory'],
      render: function () {
        return head('Procurement', 'Supplier qualification and inbound material risk.') +
          '<div class="qt-wrap"><table class="qt"><thead><tr><th>Supplier</th><th>Material</th><th class="num">Score</th><th>Status</th></tr></thead><tbody>' +
          suppliers.map(function (s) { var c = s.status === 'Qualified' ? 'verified' : s.status === 'Review' ? 'claimed' : 'inconsistent';
            return '<tr><td class="nm">' + esc(s.name) + '</td><td>' + esc(s.material) + '</td><td class="num">' + s.score + '</td><td><span class="chip ' + c + '">' + esc(s.status) + '</span></td></tr>'; }).join('') +
          '</tbody></table></div>' + prov('supplier qualification is a live obligation; an at-risk supplier raises a decision in Command');
      } },

    { key: 'manufacturing', label: 'Manufacturing', ic: 'MF', group: 'Operate',
      desc: 'Plant lines, OEE and batch execution, with deviations feeding Quality.',
      rails: { exchange: [], eesg: [
        { pillar: 'Governance', front: 'Care quality and safety', measure: 'Right first time', value: '99.1%', unit: '', status: 'Verified' },
        { pillar: 'Environment', front: 'Environmental stewardship', measure: 'Energy per 1k packs', value: '38 kWh', unit: '', status: 'Claimed' }
      ], gic: true },
      agents: ['Operations', 'Quality', 'Maintenance'],
      render: function () {
        return head('Manufacturing', 'Plant performance and batch execution at the complex. Batches progress live; a deviation feeds Quality.') +
          kpiRow([['82%', 'OEE', false], [batches.filter(function (b) { return b.status === 'Running'; }).length, 'batches in build', false], ['99.1%', 'right first time', false], [openDevs().length, 'deviations open', false, 'k-dev']]) +
          '<div class="qt-wrap"><table class="qt"><thead><tr><th>Line</th><th>Product</th><th>Batch</th><th class="num">OEE</th><th>Progress</th><th>Status</th></tr></thead><tbody id="no-batch">' + batchRows() + '</tbody></table></div>' +
          prov('every batch carries provenance from raw material to release; a deviation raises automatically in Quality');
      } },

    { key: 'serialization', label: 'Serialisation', ic: 'SR', group: 'Operate',
      desc: 'Unit-level track and trace to the last mile. The anti-counterfeit backbone.',
      rails: { exchange: [], eesg: [{ pillar: 'Governance', front: 'Supply integrity and pharmacovigilance', measure: 'Serialised to last mile', valueFn: function () { return serialPct().toFixed(1) + '%'; }, statusFn: function () { return serialPct() >= 98 ? 'Verified' : 'Claimed'; } }], gic: true },
      agents: ['Serialisation', 'Supply', 'Regulatory'],
      render: function () {
        return head('Serialisation & track-and-trace', 'Every pack a unique identity, scanned from release to the last mile.') +
          kpiRow([['<span id="k-serpct">' + serialPct().toFixed(1) + '</span>%', 'serialised to last mile', false], ['<span id="k-sern">' + scans.serialized.toLocaleString('en-US') + '</span>', 'packs serialised', false], [scans.blocked, 'counterfeit scans blocked', false, 'k-block'], ['DSCSA + EU FMD', 'standards', false]]) +
          '<div class="card shadow"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-family:var(--font-brand);font-weight:700">Live scan stream</div><span class="chip verified">aggregated to the exchange</span></div>' +
          '<div class="feed scanfeed" id="no-scan">' + scanRows() + '</div></div>' +
          prov('serialisation is the verified supply-integrity measure that publishes to the Commons');
      } },

    { key: 'quality', label: 'Quality', ic: 'QA', group: 'Assure',
      desc: 'Deviations, CAPA and batch disposition. The spine of a pharma company.',
      rails: { exchange: ['COLD_CHAIN_ALERT'], eesg: [
        { pillar: 'Social', front: 'Care quality and safety', measure: 'Batch release conformance', value: '98.7%', unit: '', status: 'Verified' },
        { pillar: 'Governance', front: 'Care quality and safety', measure: 'Deviations closed in SLA', valueFn: function () { return (deviations.length ? Math.round(deviations.filter(function (d) { return d.status === 'Closed'; }).length / deviations.length * 100) : 100) + '%'; }, statusFn: function () { return openDevs().some(function (d) { return d.type === 'Cold chain'; }) ? 'Inconsistent' : 'Claimed'; } }
      ], gic: true },
      agents: ['Quality', 'Operations', 'Regulatory'],
      render: function () {

  function moduleByKey(k) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].key === k) return MODULES[i]; return null; }

  /* ---------- per-tenant manifest + live overrides ---------- */
  var MANIFEST = {
    'ORG-PHARMA-SML': ['command', 'supply', 'manufacturing', 'quality', 'demand', 'finance', 'integration', 'compliance', 'environment', 'eesg', 'impact', 'library'],
    'ORG-PHARMA-MID': ['command', 'sop', 'supply', 'procurement', 'manufacturing', 'serialization', 'quality', 'safety', 'regulatory', 'demand', 'finance', 'integration', 'compliance', 'environment', 'workforce', 'eesg', 'impact', 'library'],
    'ORG-NEXAGEN': 'all'
  };
  var overrides = {};
  function baseEnabled(orgId) { var m = MANIFEST[orgId] || 'all'; return m === 'all' ? MODULES.map(function (x) { return x.key; }) : m.slice(); }
  function isOn(key) { var o = overrides[cur.id] || {}; if (key in o) return o[key]; return baseEnabled(cur.id).indexOf(key) >= 0; }
  function enabledMods() { return MODULES.filter(function (m) { return isOn(m.key); }); }
  function navModules() { return enabledMods().map(function (m) { return { key: m.key, label: m.label, ic: m.ic, group: m.group }; }); }

  /* ---------- EESG rollup, generated from enabled modules ---------- */
  function collectEESG() {
    var out = [];
    enabledMods().forEach(function (m) {
      (m.rails.eesg || []).forEach(function (met) {
        out.push({ pillar: met.pillar, front: met.front, measure: met.measure,
          value: met.valueFn ? met.valueFn() : met.value, status: met.statusFn ? met.statusFn() : met.status,
          from: m.label, gic: !!m.rails.gic });
      });
    });
    return out;
  }
  function eesgGridHTML() {
    var mets = collectEESG(), pillars = X.FRAMEWORK.pillars;
    return '<div class="eesg">' + pillars.map(function (p) {
      var rows = mets.filter(function (m) { return m.pillar === p; });
      return '<div class="pillar"><h4>' + esc(p) + '</h4>' + (rows.length ? rows.map(function (m) {
        return '<div class="met"><div class="mv"><span class="mn">' + esc(m.measure) + '</span>' + UI.statusChip(m.status) + '</div>' +
          '<div class="mv"><span class="mnum">' + esc(m.value) + '</span><span class="src">' + esc(m.from) + '</span></div></div>';
      }).join('') : '<div class="empty">No enabled module emits here.</div>') + '</div>';
    }).join('') + '</div>';
  }

  /* ---------- live rows ---------- */
  function batchRows() {
    return batches.map(function (b) {
      var c = b.status === 'Hold' ? 'inconsistent' : b.status === 'Changeover' ? 'claimed' : 'verified';
      var fillc = b.status === 'Hold' ? 'crit' : b.progress > 90 ? 'ok' : '';
      return '<tr><td class="nm">' + esc(b.line) + '</td><td>' + esc(b.product) + '</td><td class="mono">' + esc(b.batch) + '</td><td class="num">' + b.oee + '%</td>' +
        '<td style="min-width:120px"><div class="progress"><div class="fill ' + fillc + '" style="width:' + b.progress + '%"></div></div></td>' +
        '<td><span class="chip ' + c + '">' + esc(b.status.toLowerCase()) + '</span></td></tr>';
    }).join('');
  }
  function devRows() {
    if (!deviations.length) return '<div class="sub">No open deviations.</div>';
    return deviations.map(function (d) {
      var c = d.status === 'Open' ? 'inconsistent' : d.status === 'CAPA' ? 'claimed' : 'verified';

    }).join('');

  function dispoRows() {
    var rows = [];
    if (cold.breach || held['LOT']) rows.push(['BATCH-ONCO-0097', 'OncoNex-100', 'On hold', 'cold-chain breach, QP review open']);
    rows.push(['BATCH-CARD-0341', 'CardiNex-10', 'Released', 'all specs met']);
    rows.push(['BATCH-CARD-0342', 'CardiNex-10', 'In test', 'awaiting QC']);
    return rows.map(function (r) { var c = r[2] === 'On hold' ? 'inconsistent' : r[2] === 'Released' ? 'verified' : 'claimed';
      return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td><td><span class="chip ' + c + '">' + esc(r[2]) + '</span></td><td class="sub2">' + esc(r[3]) + '</td></tr>'; }).join('');

  function scanRows() {

    return scans.feed.slice(-7).reverse().map(function (s) {
      return '<div class="ev' + (s.fresh ? ' fresh' : '') + '"><span class="tm">' + UI.timeOf(s.ts) + '</span>' +

        '<span class="chip ' + (s.ok ? 'verified' : 'inconsistent') + '">' + (s.ok ? 'authentic' : 'blocked') + '</span></div>';
    }).join('');
  }
  function seedScan(fresh) {
    var ok = Math.random() > 0.04;
    scans.feed.push({ ts: Date.now(), sn: 'SN-' + rnd(10000, 99999) + '-' + rnd(100, 999), product: Math.random() < 0.7 ? 'CardiNex-10' : 'OncoNex-100', where: pick(REGIONS) + ' pharmacy', ok: ok, fresh: !!fresh });
    if (scans.feed.length > 40) scans.feed = scans.feed.slice(-40);
    if (!ok) scans.blocked++;

    var out = '', lastG = null;
    MODULES.forEach(function (m) {
      if (m.group !== lastG) { out += '<tr class="grp-row"><td colspan="4">' + esc(m.group) + '</td></tr>'; lastG = m.group; }
      var on = isOn(m.key);
      out += '<tr><td style="width:40px"><button class="toggle' + (on ? ' on' : '') + (m.core ? ' locked' : '') + '" data-toggle="' + esc(m.key) + '"' + (m.core ? ' disabled title="core module, always on"' : '') + '></button></td>' +
        '<td><div class="nm">' + esc(m.label) + '</div><div class="ds">' + esc(m.desc) + '</div></td>' +
        '<td>' + railChips(m) + '</td>' +
        '<td class="sub2">' + (m.core ? 'core' : on ? 'enabled' : 'available') + '</td></tr>';
    });
    return out;
  }

  function irisContext() {

    var sMap = {
      command: ['What needs me right now?', 'Why is the cold chain flagged?', 'How long until stockout?'],
      quality: ['Why is the OncoNex lot on hold?', 'What is still open?'],
      manufacturing: ['How are the lines running?'],
      serialization: ['How much is serialised?', 'Any counterfeit blocked?'],
      environment: ['Where is carbon over target?', 'What blocks the carbon line?'],
      eesg: ['Summarise our EESG position', 'What is not yet verified?'],
      impact: ['What can we raise capital against?', 'What blocks the carbon line?'],
      library: ['What should a small maker turn on?'],
      demand: ['Which product is moving?'], supply: ['What should I reallocate?'],
      safety: ['Explain the CardiNex signal'], regulatory: ['What is the EU filing risk?'],
      finance: ['What is the working-capital pressure?'], procurement: ['Which supplier is at risk?'],
      sop: ['Are we within capacity?'], workforce: ['Is training current?']
    };
    return { label: m.label || '', suggestions: sMap[mod] || [] };
  }
  function role() { return SESSION ? SESSION.role : 'coo'; }
  function irisAnswer(q) {
    var s = q.toLowerCase(), t = totals(), m = moduleByKey(mod) || {}, agents = m.agents || ['Telos'], r = role();
    function A(text, acts) { return { text: text, agents: agents, actions: acts || [] }; }
    // Role-aware framing for the general "what needs me" query.
    if (/what needs me|right now|my (day|priorities|desk)|brief/.test(s)) {
      if (r === 'quality') return A(openDevs().length + ' deviations open, ' + deviations.filter(function (d) { return d.status === 'CAPA'; }).length + ' in CAPA. ' + (cold.breach ? 'A cold-chain breach is gating an OncoNex lot. ' : '') + 'Batch release conformance 98.7%, serialisation ' + serialPct().toFixed(1) + '%. The slow risk is the EU variation. A qualified person dispositions each batch.', [{ label: 'Open Quality', kind: 'evidence', q: 'what is still open?' }]);
      if (r === 'regulatory') return A('The EU variation on CardiNex-10 is due in 46 days with two documents missing, the one filing at risk. US FDA annual report is coming, WHO PQ has open queries. Registrations in 60 of 62 markets are in good standing.', [{ label: 'Open Regulatory', kind: 'evidence', q: 'what is the EU filing risk?' }]);
      if (r === 'cfo') return A('Working capital is the pressure: ' + money(Math.round(320000 * scale()), '$') + ' overdue from a Middle East distributor, DSO creeping. Revenue tracking to plan, EBITDA 18%. Live demand of ' + t.units + ' packs is worth ' + money(t.value, '$') + ' ex-factory this session.', [{ label: 'Open Finance', kind: 'evidence', q: 'working capital' }]);
      return A('Operations: ' + t.units + ' packs pulled live worth ' + money(t.value, '$') + ', cover to ' + clockText() + ', ' + openDevs().length + ' open deviations' + (cold.breach ? ', a cold-chain breach to clear' : '') + '. The decisions are in Command. A licensed person signs each call.', [{ label: 'Open Command', kind: 'evidence', q: 'how long until stockout?' }]);
    }
    if (/cold|chain|temp|breach|hold/.test(s)) {
      return A(cold.breach
        ? cold.product + ' on ' + cold.shipment + ' is reading ' + coldNow() + 'C, outside the 2 to 8 band. It has already raised a deviation in Quality and placed the lot on hold. My read: confirm the hold, notify the customer, open the QP review. A qualified person signs it.'
        : 'Cold chain is in band at ' + coldNow() + 'C against a 2 to 8 window. No action. If Relay raises a breach it lands here and in Quality as a deviation automatically.',
        cold.breach ? [{ label: 'Hold the lot', reply: 'Lot held and quarantined. QP review opened. A licensed person signs disposition.' }, { label: 'Show the deviation', kind: 'evidence', q: 'What is still open?' }] : []);
    }
    if (/stock|cover|out/.test(s)) return A('Cover runs to ' + clockText() + ' at the current pull of ' + t.units + ' packs. That clock moves with real dispensing. Reallocating 800 units buys back about four days.', [{ label: 'Reallocate 800 units', reply: '800 units reallocated. Cover clock extended. A planner confirms the move.' }, { label: 'See the math', kind: 'evidence', q: 'Which product is moving?' }]);
    if (/serial|counterfeit|trace|track/.test(s)) return A(serialPct().toFixed(1) + '% of packs are serialised to the last mile, ' + scans.serialized.toLocaleString('en-US') + ' units, with ' + scans.blocked + ' counterfeit scans blocked this session. That figure is the verified supply-integrity outcome that publishes to the Commons.', [{ label: 'Open serialisation', kind: 'evidence', q: 'How much is serialised?' }]);
    if (/quality|deviation|capa|release/.test(s)) return A(openDevs().length + ' deviations are open, ' + deviations.filter(function (d) { return d.status === 'CAPA'; }).length + ' in CAPA. ' + (openDevs().some(function (d) { return d.type === 'Cold chain'; }) ? 'The cold-chain one on ' + cold.product + ' gates release of the affected lot. ' : '') + 'Release conformance is 98.7%. A qualified person dispositions each batch.', [{ label: 'Advance a deviation', reply: 'Deviation advanced to the next stage. A QA lead signs the step.' }]);
    if (/carbon|environment|effluent|water|waste/.test(s)) return A('Carbon intensity is ' + env.carbon + '% over target, the one red line, and it blocks the carbon-credit line on the Commons until verified down. API effluent is within consent and water recycling is at ' + env.water + '%. Each is an EESG emitter read from operations.', [{ label: 'Open Environment', kind: 'evidence', q: 'What blocks the carbon line?' }]);
    if (/eesg|framework|position/.test(s)) { var mets = collectEESG(), ver = mets.filter(function (x) { return x.status === 'Verified'; }).length; return A('Across the ' + enabledMods().length + ' enabled modules, ' + mets.length + ' EESG metrics are emitting, ' + ver + ' Verified. The weak spots are carbon intensity and the serialisation claim. Turn on more modules and the position fills in; it is generated, not hand-written.', [{ label: 'Open EESG', kind: 'evidence', q: 'What is not yet verified?' }]); }
    if (/capital|gic|commons|raise|fund/.test(s)) { var v = collectEESG().filter(function (x) { return x.status === 'Verified' && x.gic; }); return A('You can raise against ' + v.length + ' verified outcomes, led by access, 1.8M patients reached, and supply integrity. $1.2M requested, $0.4M committed. The carbon line is blocked until carbon is verified down. Nothing unverified posts.', [{ label: 'Publish to GIC', reply: 'Verified record staged for the Commons. A signatory approves the publication.' }, { label: 'See outcomes', kind: 'evidence', q: 'Summarise our EESG position' }]); }
    if (/library|turn on|module|small|configure/.test(s)) return A('For a small generics maker I would turn on Command, Supply, Manufacturing, Quality, Demand, Finance and Environment, plus the EESG and GIC rails. That is the current ' + cur.name + ' set. Procurement, serialisation, S&OP, PV, regulatory and workforce come on as they scale. Same code, different manifest.', [{ label: 'Open the library', kind: 'evidence', q: 'What should a small maker turn on?' }]);
    if (/line|manufactur|oee|batch/.test(s)) return A('Three lines, OEE 82% overall, right-first-time 99.1%. Batches are progressing live; Line 3 is in changeover. Any deviation feeds Quality automatically.', []);
    if (/demand|moving|pull|region/.test(s)) { var last = demand[demand.length - 1]; return A('Live demand is ' + t.units + ' packs worth ' + money(t.value, '$') + ', summed from connected pharmacies. Most recent: ' + (last ? last.name + ' in ' + last.region : 'quiet') + '. Measured dispensing, not forecast.', []); }
    if (/eu|filing|regulat|variation/.test(s)) return A('The EU variation on CardiNex-10 is due in 46 days with two documents missing. Close them or the filing slips a cycle. A regulatory lead owns the submission.', [{ label: 'Open filing', reply: 'Filing opened. The two missing documents are flagged for the regulatory lead.' }]);
    if (/safety|signal|oedema|pv|adverse/.test(s)) return A('Four peripheral oedema reports on CardiNex-10 in the 65+ group over 90 days cross the threshold. The denominator is real dispensing, so the rate is trustworthy. A qualified person decides on escalation.', []);
    if (/finance|cash|receivable|working/.test(s)) return A('Working capital is the pressure. A ' + money(Math.round(320000 * scale()), '$') + ' receivable is 45 days overdue from a Middle East distributor. Finance reads the same events as operations, one ledger.', []);
    if (/supplier|procure/.test(s)) return A('DhakaPack Ltd is at risk, packaging score 58. I would qualify an alternate before it gates a batch. Procurement owns qualification.', [{ label: 'Qualify alternate', reply: 'Alternate supplier added to the qualification queue. Procurement runs the audit.' }]);
    if (/capacity|sop|forecast|plan/.test(s)) return A('Capacity utilisation is 72% and the forecast tracks within band, so you are inside capacity. The forecast is built from live dispensing, so S&OP and operations never diverge.', []);
    if (/training|workforce|hse|safety incident/.test(s)) return A('GMP training is 94% current with 12 qualifications overdue; lost-time injury rate is 0.3. Both are EESG emitters tied to the record that gates release.', []);
    return A('I read that from ' + cur.name + '\'s own records on the exchange. Ask me about demand, the cold chain, quality, serialisation, the environment, the EESG position or the capital ask. I advise; a licensed person makes every clinical, quality and regulatory call.');
  }

  /* ---------- render + live loop ---------- */
  function render() {
    if (!isOn(mod)) mod = 'command';
    var who = cur.personas[0];
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Nexus', personaName: who.name, personaRole: who.role + ' · ' + cur.name, role: SESSION ? SESSION.roleLabel : null, trustLabel: UI.trust.badgeLabel('pharma') }) +
      '<div class="os">' + UI.osNav(navModules(), mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + (moduleByKey(mod).render()) + '</div></main>' +
      '</div>' + UI.legalFooter({ sector: 'pharma' });
    UI.iris.context();
    paintLive(true);
  }
  function paintLive(initial) {
    var t = totals();
    var u = document.getElementById('k-units'); if (u) UI.countUp(u, t.units);
    var v = document.getElementById('k-value'); if (v) UI.countUp(v, t.value, { pre: '$' });
    var c = document.getElementById('no-clock'); if (c) c.textContent = clockText();
    var kd = document.getElementById('k-dev'); if (kd) kd.textContent = openDevs().length;
    var fc = document.getElementById('fl-cold'); if (fc) fc.innerHTML = coldNow() + '&deg;C';
    var fs = document.getElementById('fl-sig'); if (fs) fs.textContent = demand.length;
    var flr = document.getElementById('fl-ser'); if (flr) flr.textContent = serialPct().toFixed(1);
    var cn = document.getElementById('no-coldnow'); if (cn) cn.innerHTML = coldNow() + '&deg;C';
    var cc = document.getElementById('no-coldchip'); if (cc) { cc.textContent = cold.breach ? 'breach' : 'in band'; cc.className = 'chip ' + (cold.breach ? 'inconsistent' : 'verified'); }
    var cs = document.getElementById('no-coldspark'); if (cs) cs.innerHTML = cold.series.slice(-14).map(function (x) { return '<i class="' + (x > 8 || x < 2 ? 'hot' : '') + '" style="height:' + Math.max(8, Math.min(100, (x / 12) * 100)) + '%"></i>'; }).join('');
    var sp = document.getElementById('k-serpct'); if (sp) sp.textContent = serialPct().toFixed(1);
    var sn = document.getElementById('k-sern'); if (sn) sn.textContent = scans.serialized.toLocaleString('en-US');
    var kb = document.getElementById('k-block'); if (kb) kb.textContent = scans.blocked;
    if (!initial) {
      var f = document.getElementById('no-feed'); if (f) f.outerHTML = feedHTML(mod === 'demand' ? 12 : mod === 'supply' ? 8 : 5);
      var dd = document.getElementById('no-dec'); if (dd) dd.innerHTML = decList();
      var bb = document.getElementById('no-batch'); if (bb) bb.innerHTML = batchRows();
      var sc = document.getElementById('no-scan'); if (sc) sc.innerHTML = scanRows();
      var dv = document.getElementById('no-dev'); if (dv) dv.innerHTML = devRows();
    }
    demand.forEach(function (d) { d.fresh = false; }); scans.feed.forEach(function (s) { s.fresh = false; });
  }
  function tick() {
    tickN++;
    if (tickN % 5 === 0) {
      var code = Math.random() < 0.7 ? 'CARDINEX-10' : 'ONCONEX-100';
      pushDemand(code, code === 'ONCONEX-100' ? rnd(1, 2) : rnd(1, 6), pick(REGIONS), Date.now(), 'baseline', true);
      stockoutAt -= rnd(3, 11) * 60000;
      scans.serialized = Math.min(scans.total, scans.serialized + rnd(400, 1400));
      paintLive(false);
    }
    if (tickN % 3 === 0) {
      var last = coldNow(), next = cold.breach ? +(last + (Math.random() - 0.4)).toFixed(1) : +(Math.max(3.4, Math.min(7.4, last + (Math.random() - 0.5) * 0.7))).toFixed(1);
      cold.series.push(next); if (cold.series.length > 40) cold.series = cold.series.slice(-40);
      batches.forEach(function (b) { if (b.status === 'Running' && b.progress < 100) b.progress = Math.min(100, b.progress + rnd(1, 4)); });
      seedScan(true);
      paintLive(false);
    }
    var c = document.getElementById('no-clock'); if (c) c.textContent = clockText();
  }

  /* ---------- events + actions ---------- */
  document.addEventListener('click', function (e) {
    var tn = e.target.getAttribute('data-tenant'); if (tn) { cur = X.org(tn); mod = 'command'; seedBaseline(); foldExchange(); render(); return; }
    var mm = e.target.closest('[data-mod]'); if (mm) { mod = mm.getAttribute('data-mod'); render(); return; }
    var tg = e.target.getAttribute('data-toggle'); if (tg) { var mobj = moduleByKey(tg); if (mobj && !mobj.core) { if (!overrides[cur.id]) overrides[cur.id] = {}; overrides[cur.id][tg] = !isOn(tg); render(); } return; }
    var dv = e.target.getAttribute('data-dev'); if (dv) { var d = deviations.filter(function (x) { return x.id === dv; })[0]; if (d) { d.status = d.status === 'Open' ? 'CAPA' : 'Closed'; UI.toast('Deviation ' + d.id, 'advanced to ' + d.status + '. A QA lead signs the step.'); paintLive(false); } return; }
    var a = e.target.getAttribute('data-act');
    if (a === 'hold') { held['LOT'] = true; UI.toast('Lot held', cold.product + ' quarantined, QP review opened, customer notified.'); paintLive(false); return; }
    if (a === 'reallocate') { acked['spike'] = true; stockoutAt += 4 * 86400000; UI.toast('Reallocated', '800 units moved to cover live demand. Cover clock updated.'); paintLive(false); return; }
    if (a === 'eu') { acked['eu'] = true; UI.iris.ask('What is the EU filing risk?'); paintLive(false); return; }
    if (a === 'sup') { acked['sup'] = true; UI.toast('Qualification started', 'An alternate packaging supplier was added to the qualification queue.'); paintLive(false); return; }
    if (e.target.matches('[data-gic-publish]')) {
      var v = collectEESG().filter(function (x) { return x.status === 'Verified' && x.gic; });
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: v.length + ' verified outcomes, Q current', status: 'Verified', capitalAsk: 1200000 }, { app: 'nexus', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted ' + v.length + ' verified outcomes and a capital request.');
    }
  });

  X.subscribe(function (ev) { if (ev) { foldExchange(); if (mod === 'quality' || mod === 'command') render(); else paintLive(false); } });
  UI.watchToasts(function (ev) {
    if (ev.type === 'DEMAND_SIGNAL' && ev.payload.maker === 'ORG-NEXAGEN') return { k: 'Cura', msg: esc(ev.payload.drugName || nameOf(ev.payload.drug)) + ' dispensed in ' + esc(ev.payload.region || 'the field') + '. Demand updated.' };
    if (ev.type === 'COLD_CHAIN_ALERT') return { k: 'Relay', msg: 'Cold-chain breach on ' + esc(ev.payload.product || cold.product) + '. Deviation raised in Quality.' };
    return null;
  });

  function greetingFor(r) {
    if (r === 'quality') return 'IRIS here. Ask what is open in quality.';
    if (r === 'regulatory') return 'IRIS here. Ask what filing is at risk.';
    if (r === 'cfo') return 'IRIS here. Ask about the cash position.';
    return 'IRIS here. Ask what needs attention.';
  }

  window.QareAuth.boot({
    app: 'Nexus', product: 'nexus', sector: 'pharma',
    roles: [
      { id: 'coo', label: 'Director of Ops' },
      { id: 'quality', label: 'Head of Quality' },
      { id: 'regulatory', label: 'Regulatory' },
      { id: 'cfo', label: 'Finance' }
    ],
    onReady: function (session) {
      SESSION = session;
      UI.iris.mount({ getContext: irisContext, answer: irisAnswer, greeting: greetingFor(session.role) });
      seedBaseline(); foldExchange(); render(); setInterval(tick, 1000);
    }
  });
})();
</script>
</body>
</html>
