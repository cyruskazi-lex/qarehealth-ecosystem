<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('nexus');
  var orgs = X.orgsFor('nexus');
  var cur = X.org('ORG-NEXAGEN');
  var mod = 'command';
  var seen = {};

  function scale() { return cur.sizeClass === 'LARGE' ? 1 : cur.sizeClass === 'MEDIUM' ? 0.4 : 0.12; }

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  var MODS = [
    { key: 'command', label: 'Command', ic: 'CM', group: 'Operate' },
    { key: 'supply', label: 'Supply chain', ic: 'SC', group: 'Operate' },
    { key: 'manufacturing', label: 'Manufacturing', ic: 'MF', group: 'Operate' },
    { key: 'quality', label: 'Quality', ic: 'QA', group: 'Assure' },
    { key: 'safety', label: 'Safety intelligence', ic: 'SI', group: 'Assure' },
    { key: 'regulatory', label: 'Regulatory', ic: 'RG', group: 'Assure' },
    { key: 'demand', label: 'Demand', ic: 'DM', group: 'Commercial' },
    { key: 'finance', label: 'Finance', ic: 'FN', group: 'Commercial' },
    { key: 'sustainability', label: 'Sustainability', ic: 'SU', group: 'Impact' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Impact' }
  ];

  function demandSignals() { return X.eventsOfType('DEMAND_SIGNAL').filter(function (e) { return e.payload.maker === 'ORG-NEXAGEN'; }); }
  function coldAlerts() { return X.coldChainAlerts().filter(function (a) { return a.maker === 'ORG-NEXAGEN'; }); }

  function moduleBody() {
    var sig = demandSignals();
    var units = sig.reduce(function (a, s) { return a + (s.payload.qty || 0); }, 0);
    var revenue = sig.reduce(function (a, s) { var d = X.drug(s.payload.drug); return a + (d ? d.unitPrice * s.payload.qty : 0); }, 0);
    var alerts = coldAlerts();
    if (mod === 'command') {
      return head('Command', 'The operating surface. Live demand from the field, a cold-chain exception, and the decisions that cannot wait.') +
        kpis([[units, 'packs pulled, live'], [money(revenue), 'ex-factory value'], ['21d', 'projected stockout'], ['A-', 'health impact score']]) +
        '<div class="split"><div><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Decisions waiting</div>' +
        (alerts.length ? decRow('crit', 'Cold-chain breach, ' + esc(alerts[alerts.length - 1].product), esc(alerts[alerts.length - 1].shipment) + ' at ' + alerts[alerts.length - 1].temp + '°C, hold the lot') : decRow('warn', 'Cold-chain watch, OncoNex-100', 'raise it from Relay to see it escalate here')) +
        (sig.length ? decRow('warn', 'Demand spike, ' + esc(sig[sig.length - 1].payload.region), 'reallocate stock to meet it') : decRow('idle', 'Demand quiet', 'dispense in Cura to see it build')) +
        decRow('warn', 'EU variation due in 46 days', 'two documents still missing') + '</div></div>' +
        '<div><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">IRIS briefing</div><div class="sub" style="font-size:13px">' + (alerts.length ? 'A cold-chain breach on ' + esc(alerts[alerts.length - 1].product) + ' needs a QP decision now; hold the lot and notify the customer. ' : '') + 'Live demand is running ' + (units > 0 ? 'on ' + sig.length + ' real dispensing events' : 'quiet') + '. The EU variation is the slow risk: close the two documents this week or the filing slips. A licensed person signs each call.</div></div></div></div>' +
        prov('reads dispensing and cold-chain events from the exchange; the operator acts, the system watches');
    }
    if (mod === 'supply') {
      return head('Supply chain', 'Demand pulled from real dispensing, inventory cover, and the supplier risk behind it.') +
        kpis([[units, 'packs pulled'], ['21d', 'cover remaining'], ['2', 'suppliers at risk'], ['800', 'units to reallocate']]) +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Live demand signals</div>' +
        (sig.length ? sig.slice().reverse().map(function (s) { var fresh = !seen[s.id]; seen[s.id] = true; return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hairline)' + (fresh ? ';background:var(--iris-tint)' : '') + '"><div><div style="font-weight:600;font-size:13px">' + esc(s.payload.drugName) + ' &middot; ' + s.payload.qty + ' pack' + (s.payload.qty > 1 ? 's' : '') + '</div><div class="sub2">' + esc(s.payload.region) + ' &middot; via a connected pharmacy</div></div><span class="chip iris">reallocate</span></div>'; }).join('') : '<div class="sub">Dispense a product in Cura and the demand lands here live.</div>') + '</div>' +
        prov('live dispensing replaces sampled quarterly data; the stockout clock is real');
    }
    if (mod === 'manufacturing') {
      return head('Manufacturing', 'Plant performance and environmental monitoring at the Nexagen complex.') +
        kpis([['82%', 'OEE'], ['3', 'batches in build'], ['99.1%', 'right first time'], ['0', 'GMP deviations open']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Line</th><th>Product</th><th>Batch</th><th class="num">OEE</th><th>Status</th></tr></thead><tbody>' +
        [['Line 1', 'CardiNex-10', 'BATCH-CARD-0342', '86%', 'Running'], ['Line 2', 'OncoNex-100', 'BATCH-ONCO-0101', '78%', 'Running'], ['Line 3', 'Metformin 500', 'BATCH-MET-0590', '81%', 'Changeover']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td class="num">' + esc(r[3]) + '</td><td>' + (r[4] === 'Changeover' ? '<span class="chip claimed">changeover</span>' : '<span class="chip verified">running</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('every batch carries provenance from raw material to release');
    }
    if (mod === 'quality') {
      return head('Quality', 'Batch disposition, deviations and the holds that gate release.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Batch</th><th>Product</th><th>Disposition</th><th>Note</th></tr></thead><tbody>' +
        [['BATCH-ONCO-0097', 'OncoNex-100', 'On hold', 'cold-chain breach under review'], ['BATCH-CARD-0341', 'CardiNex-10', 'Released', 'all specs met'], ['BATCH-CARD-0342', 'CardiNex-10', 'In test', 'awaiting QC']].map(function (r) {
          var c = r[2] === 'On hold' ? 'inconsistent' : r[2] === 'Released' ? 'verified' : 'claimed';
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td><td><span class="chip ' + c + '">' + esc(r[2]) + '</span></td><td class="sub2">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('a cold-chain breach raised in Relay places the affected lot on hold here automatically');
    }
    if (mod === 'safety') {
      return head('Safety intelligence', 'Pharmacovigilance: adverse-event signals detected across the product in the field.') +
        kpis([['4', 'clustered AEs, 90d'], ['1', 'signal under evaluation'], ['CardiNex-10', 'product'], ['oedema', 'MedDRA term']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Four peripheral oedema events on CardiNex-10 in the 65+ group in 90 days cross the signal threshold. Because dispensing is on the exchange, the denominator is real, so the rate is trustworthy, not a guess. A qualified person decides whether to escalate to the regulator.</div></div>' +
        prov('a real dispensing denominator turns a cluster of reports into a measurable rate');
    }
    if (mod === 'regulatory') {
      return head('Regulatory', 'Registrations by market and the submissions in flight.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Market</th><th>Product</th><th>Status</th><th>Next action</th></tr></thead><tbody>' +
        [['US FDA', 'CardiNex-10', 'Approved', 'annual report due'], ['EU (AGES)', 'CardiNex-10', 'Variation', 'due 46d, 2 docs missing'], ['TGA', 'OncoNex-100', 'Approved', 'none'], ['NAFDAC', 'CardiNex-10', 'In review', 'respond to queries']].map(function (r) {
          var c = r[2] === 'Approved' ? 'verified' : r[2] === 'Variation' ? 'inconsistent' : 'claimed';
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td><span class="chip ' + c + '">' + esc(r[2]) + '</span></td><td class="sub2">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('registrations and submissions are tracked as live obligations, not a static file');
    }
    if (mod === 'demand') {
      return head('Demand', 'Live demand by product and region, pulled from every connected pharmacy.') +
        kpis([[units, 'packs pulled, live'], [money(revenue), 'ex-factory value'], [sig.length, 'signals today'], ['3', 'regions active']]) +
        (sig.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Product</th><th class="num">Units</th><th>Region</th><th>Source</th></tr></thead><tbody>' +
          sig.slice().reverse().map(function (s) { return '<tr><td class="nm">' + esc(s.payload.drugName) + '</td><td class="num">' + s.payload.qty + '</td><td>' + esc(s.payload.region) + '</td><td><span class="chip iris">pharmacy dispense</span></td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">No live demand yet. Dispense in Cura and it appears here.</div></div>') +
        prov('demand is the sum of real dispensing events, not a forecast model');
    }
    if (mod === 'finance') {
      return head('Finance', 'Revenue, cost and the working-capital pressure behind operations.') +
        kpis([[money(Math.round(400000000 * scale())), 'revenue, year'], [money(Math.round(320000 * scale())), 'receivables overdue'], ['62', 'export markets'], ['18%', 'EBITDA margin']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">A receivable of ' + money(Math.round(320000 * scale())) + ' is 45 days overdue from a Middle East distributor, the main working-capital pressure this quarter. BFRS and IFRS reporting reconcile to the same operational events the rest of Nexus runs on, so finance is not a separate version of the truth.</div></div>' +
        prov('finance reads the same events as operations; there is one ledger of reality');
    }
    if (mod === 'sustainability') {
      return head('Sustainability', 'The EESG position: environment, social and governance, measured from operations, not a separate report.') +
        kpis([['+12%', 'carbon vs target'], ['98%', 'serialised to last mile'], ['1.8M', 'patients reached'], ['A', 'governance score']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Carbon intensity is running 12% above the EESG target, the one red line this quarter; the board is asking about carbon credits. Every Telos node carries EESG metadata, so this reads across modules rather than requiring a separate data collection. This is the same data that becomes the verified outcome on the Commons.</div></div>' +
        prov('EESG is architectural here; sustainability reads the operational record, it does not re-key it');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'Nexagen\'s contribution to the framework and its verified publication to the Commons, where it raises capital.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Patients reached, quarter', value: '1.8M', status: 'Verified' },
          { front: 'Supply integrity and pharmacovigilance', measure: 'Serialised to the last mile', value: '98%', status: 'Claimed' },
          { front: 'Environment', measure: 'Carbon intensity vs target', value: '+12%', status: 'Inconsistent' }
        ] }) +
        '<div class="card shadow" style="margin-top:16px"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:8px">Capital on the Commons</div><div class="figs"><div class="fig"><div class="fv">$1.2M</div><div class="fk">requested</div></div><div class="fig"><div class="fv">$0.4M</div><div class="fk">committed</div></div></div><div class="sub" style="font-size:13px;margin-top:10px">Nexagen is raising expansion capital against verified access and supply-integrity outcomes. Nothing unverified is posted.</div></div>';
    }
    return '';
  }

  function decRow(sev, t, s) { return '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + sev + '" style="margin-top:6px"></span><div><div style="font-size:13px;font-weight:600">' + esc(t) + '</div><div class="sub2">' + esc(s) + '</div></div></div>'; }

  function render() {
    var who = cur.personas[0];
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Nexus', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(MODS, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Medicines access and supply integrity, Q current', status: 'Verified', capitalAsk: 1200000 }, { app: 'nexus', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified outcome and a capital request.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'DEMAND_SIGNAL' && ev.payload.maker === 'ORG-NEXAGEN') return { k: 'Cura', msg: esc(ev.payload.drugName) + ' dispensed in ' + esc(ev.payload.region) + '. Demand updated.' };
    if (ev.type === 'COLD_CHAIN_ALERT' && ev.payload.maker === 'ORG-NEXAGEN') return { k: 'Relay', msg: 'Cold-chain breach on ' + esc(ev.payload.product) + ' ' + esc(ev.payload.shipment) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
