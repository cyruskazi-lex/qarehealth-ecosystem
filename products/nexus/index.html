<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 28px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .sig { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .sig.fresh { animation: flash 1.4s ease; }
  @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .sig .s-d { font-size: 14px; font-weight: 600; }
  .sig .s-m { font-size: 12px; color: var(--mid); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('nexus');
  var org = X.org('ORG-NEXAGEN'), who = org.personas[0];
  var seen = {};

  function render() {
    var signals = X.eventsOfType('DEMAND_SIGNAL').filter(function (e) { return e.payload.maker === org.id; });
    var units = signals.reduce(function (a, e) { return a + (e.payload.qty || 0); }, 0);
    var revenue = signals.reduce(function (a, e) { var d = X.drug(e.payload.drug); return a + (d ? d.unitPrice * e.payload.qty : 0); }, 0);
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Nexus', personaName: who.name, personaRole: who.role + ' · ' + org.name + ' (large manufacturer)' }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Pharma operations</div>' +
        '<div class="greet">' + (signals.length ? ('Live demand on ' + signals.length + ' dispensing event' + (signals.length > 1 ? 's' : '') + '.') : 'The market is quiet. One cold-chain item needs you.') + '</div>' +
        '<div class="sub">' + UI.esc(org.name) + ' · ' + UI.esc(org.region) + ' · demand updates the moment a pharmacy dispenses your product</div>' +
        '<div class="figs" style="margin-top:18px">' +
          '<div class="fig"><div class="fv">' + units + '</div><div class="fk">packs pulled, live</div></div>' +
          '<div class="fig"><div class="fv">' + UI.money(revenue, '$') + '</div><div class="fk">ex-factory value</div></div>' +
          '<div class="fig"><div class="fv">21d</div><div class="fk">projected stockout</div></div>' +
          '<div class="fig"><div class="fv">A-</div><div class="fk">health impact score</div></div>' +
        '</div>' +
        '<div class="cols">' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Demand signals from the field</h2>' +
              (signals.length ? signals.slice().reverse().map(function (e) {
                var fresh = !seen[e.id]; seen[e.id] = true;
                return '<div class="sig' + (fresh ? ' fresh' : '') + '"><div><div class="s-d">' + UI.esc(e.payload.drugName) + ' · ' + e.payload.qty + ' pack' + (e.payload.qty > 1 ? 's' : '') + '</div>' +
                  '<div class="s-m">' + UI.esc(e.payload.region) + ' · dispensed via a connected pharmacy</div></div>' +
                  '<span class="chip iris">reallocate</span></div>';
              }).join('') : '<p class="sub" style="margin-top:6px">Dispense a CardiNex-10 in Cura and the demand lands here live.</p>') +
              '<p class="provenance">reads dispensing events from the exchange; replaces sampled quarterly data with live signal</p>' +
            '</div>' +
            '<div class="card shadow stripe-crit" style="margin-top:16px"><h2 class="sec">Cold chain · OncoNex-100</h2>' +
              '<p class="sub" style="margin-top:0">Shipment BN-2026-007 peaked at 12.9°C for 400 units. IRIS: hold the lot, notify the US hospital customer, open a deviation. A licensed QP signs off.</p>' +
              '<button class="btn btn-primary btn-sm" style="margin-top:12px">Open recall command</button></div>' +
          '</section>' +
          '<section>' + UI.impactPanel(org, { measures: [
            { front: 'Access and coverage', measure: 'Patients reached, quarter', value: '1.8M', status: 'Verified' },
            { front: 'Supply integrity and pharmacovigilance', measure: 'Serialised to the last mile', value: '98%', status: 'Claimed' },
            { front: 'Environment', measure: 'Carbon intensity vs target', value: '+12%', status: 'Inconsistent' }
          ] }) +
          '<div class="card shadow" style="margin-top:16px"><h2 class="sec">Capital on the Commons</h2>' +
            '<p class="sub" style="margin-top:0">Nexagen is raising expansion capital against verified access and supply-integrity outcomes. Nothing unverified is posted.</p>' +
            '<div class="figs" style="margin-top:12px"><div class="fig"><div class="fv">$1.2M</div><div class="fk">requested</div></div><div class="fig"><div class="fv">$0.4M</div><div class="fk">committed</div></div></div>' +
          '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: org.id, orgName: org.name, outcome: 'Medicines access and supply integrity, Q current', status: 'Verified', capitalAsk: 1200000 }, { app: 'nexus', persona: who.id });
      UI.toast('Published to GIC', 'Nexagen posted a verified outcome and a capital request.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'DEMAND_SIGNAL' && ev.payload.maker === org.id) return { k: 'Cura', msg: UI.esc(ev.payload.drugName) + ' dispensed in ' + UI.esc(ev.payload.region) + '. Demand updated.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
