<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Prism</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .lj { height: 90px; position: relative; border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface); margin-top: 8px; }
  .lj .mean, .lj .sd { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
  .lj .mean { border-top: 1px solid var(--iris-line); }
  .lj svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--mid); margin-top: 8px; flex-wrap: wrap; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/care.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('prism');
  var orgs = X.orgsFor('prism');
  var cur = X.org('ORG-LAB');
  var mod = 'orders';

  // ---- Deep sample data ----
  var DEPTS = ['Chemistry', 'Hematology', 'Microbiology', 'Serology'];
  // Internal worklist orders (plus the exchange-driven Amara orders, merged below)
  var INTERNAL = [
    { id: 'ORD-4471', pt: 'M. Rahman', mrn: 'QH-PT-100771', dept: 'Chemistry', tests: ['Fasting glucose', 'HbA1c'], prio: 'Routine', status: 'In process', coll: '07:12' },
    { id: 'ORD-4472', pt: 'S. Begum', mrn: 'QH-PT-100088', dept: 'Hematology', tests: ['CBC', 'ESR'], prio: 'Urgent', status: 'Received', coll: '07:40' },
    { id: 'ORD-4473', pt: 'K. Das', mrn: 'QH-PT-100342', dept: 'Microbiology', tests: ['Blood culture'], prio: 'STAT', status: 'In process', coll: '06:55' },
    { id: 'ORD-4474', pt: 'R. Khatun', mrn: 'QH-PT-100519', dept: 'Serology', tests: ['Dengue NS1'], prio: 'Urgent', status: 'Validated', coll: '06:30' },
    { id: 'ORD-4475', pt: 'A. Haque', mrn: 'QH-PT-100233', dept: 'Chemistry', tests: ['Lipid panel', 'Creatinine'], prio: 'Routine', status: 'Received', coll: '08:05' }
  ];
  var REAGENTS = [
    { name: 'HbA1c cartridge', onHand: 42, reorder: 30, lot: 'RLZ-8841', exp: '2027-02' },
    { name: 'Lipid reagent kit', onHand: 11, reorder: 20, lot: 'LPD-2210', exp: '2026-12' },
    { name: 'Blood culture bottles', onHand: 8, reorder: 25, lot: 'BCB-1190', exp: '2026-11' },
    { name: 'Dengue NS1 strips', onHand: 120, reorder: 40, lot: 'DNG-5521', exp: '2027-04' },
    { name: 'CBC diluent', onHand: 60, reorder: 30, lot: 'CBC-3310', exp: '2027-01' }
  ];
  // QC: last 14 points for the HbA1c analyzer, one out of range (Westgard 1-3s).
  var QC = [5.1, 5.0, 5.2, 4.9, 5.1, 5.0, 5.3, 5.1, 5.0, 4.8, 5.2, 5.9, 5.1, 5.0];
  var QC_MEAN = 5.1, QC_SD = 0.2;
  var TAT = [{ d: 'Chemistry', med: 4.2, tgt: 6 }, { d: 'Hematology', med: 2.1, tgt: 4 }, { d: 'Microbiology', med: 38, tgt: 48 }, { d: 'Serology', med: 3.4, tgt: 6 }];

  function exchangeOrders() {
    // Orders a clinician sent to this lab over the exchange, not yet resulted.
    return X.care.labOrders({ labOrgId: cur.id }).filter(function (o) { return !o.result; }).map(function (o) {
      return { id: o.orderId, pt: o.patientName, mrn: o.patientId, dept: 'Chemistry', tests: [o.testName], prio: o.urgency, status: 'Received', coll: new Date(o.ts).toTimeString().slice(0, 5), exchange: true, order: o, from: o.clinicName };
    });
  }

  function statusChip(s) {
    var m = { 'Received': 'claimed', 'In process': 'claimed', 'Validated': 'verified', 'Released': 'verified' };
    return '<span class="chip ' + (m[s] || '') + '">' + esc(s) + '</span>';
  }
  function prioTag(p) {
    var c = p === 'STAT' ? 'inconsistent' : p === 'Urgent' ? 'claimed' : '';
    return '<span class="chip ' + c + '">' + esc(p) + '</span>';
  }

  var MODS = [
    { key: 'orders', label: 'Order queue', ic: 'OQ', group: 'Bench', badge: null },
    { key: 'accession', label: 'Accessioning', ic: 'AC', group: 'Bench' },
    { key: 'worklist', label: 'Worklist', ic: 'WL', group: 'Bench' },
    { key: 'validate', label: 'Result validation', ic: 'RV', group: 'Bench' },
    { key: 'qc', label: 'Quality control', ic: 'QC', group: 'Quality' },
    { key: 'tat', label: 'Turnaround', ic: 'TT', group: 'Quality' },
    { key: 'reagents', label: 'Reagents', ic: 'RG', group: 'Resources' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function moduleBody() {
    var exOrders = exchangeOrders();
    if (mod === 'orders') {
      var all = exOrders.concat(INTERNAL);
      return head('Order queue', all.length + ' active orders across ' + DEPTS.length + ' departments. Orders from the exchange carry the clinic and patient from the visit.') + (exOrders.length ? '' : '<div class="card shadow" style="margin-bottom:14px"><div class="sub">No orders from the exchange for ' + esc(cur.name) + '. Order a test in Pulse and it lands here live.</div></div>') +
        kpis([[all.length, 'active orders'], [all.filter(function (o) { return o.prio === 'STAT'; }).length, 'STAT'], [exOrders.length, 'from exchange'], ['6h', 'target TAT']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Order</th><th>Patient</th><th>Department</th><th>Tests</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>' +
        all.map(function (o) {
          return '<tr><td><span class="mono">' + esc(o.id) + '</span>' + (o.exchange ? ' <span class="chip iris">exchange</span>' : '') + '</td>' +
            '<td><div class="nm">' + esc(o.pt) + '</div><div class="sub2 mono">' + esc(o.mrn) + '</div></td>' +
            '<td>' + esc(o.dept) + '</td><td>' + esc(o.tests.join(', ')) + '</td><td>' + prioTag(o.prio) + '</td><td>' + statusChip(o.status) + '</td>' +
            '<td style="text-align:right">' + (o.exchange ? '<button class="btn btn-primary btn-sm" data-release="' + esc(o.id) + '">Result and release</button>' : '<button class="btn btn-ghost btn-sm">Open</button>') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>' + prov('reads order events from the exchange; releasing writes a LAB_RESULT the clinician and patient see live');
    }
    if (mod === 'accession') {
      return head('Accessioning', 'Specimen receipt, labelling and chain of custody. Every tube is barcoded on arrival and tracked to disposal.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Accession</th><th>Specimen</th><th>Received</th><th>Condition</th><th>Chain of custody</th></tr></thead><tbody>' +
        [['ACC-99120', 'Serum, SST', '07:12', 'Acceptable', 'sealed, 2 handoffs'], ['ACC-99121', 'EDTA whole blood', '07:40', 'Acceptable', 'sealed, 1 handoff'], ['ACC-99122', 'Blood culture set', '06:55', 'Flagged: delay', 'sealed, 3 handoffs'], ['ACC-99123', 'Serum', '06:30', 'Acceptable', 'sealed, 1 handoff']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td>' + (r[3].indexOf('Flagged') === 0 ? '<span class="chip inconsistent">' + esc(r[3]) + '</span>' : '<span class="chip verified">' + esc(r[3]) + '</span>') + '</td><td class="sub2">' + esc(r[4]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('every specimen is barcoded and its custody is append-only');
    }
    if (mod === 'worklist') {
      return head('Worklist', 'Pending work by department and analyzer. The bench runs from here.') +
        DEPTS.map(function (d) {
          var rows = INTERNAL.concat(exOrders).filter(function (o) { return o.dept === d && o.status !== 'Validated'; });
          return '<div class="card shadow" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>' + esc(d) + '</strong><span class="chip">' + rows.length + ' pending</span></div>' +
            (rows.length ? '<div class="qt-wrap" style="border:0"><table class="qt"><tbody>' + rows.map(function (o) {
              return '<tr><td class="mono">' + esc(o.id) + '</td><td>' + esc(o.pt) + '</td><td>' + esc(o.tests.join(', ')) + '</td><td>' + prioTag(o.prio) + '</td><td>' + statusChip(o.status) + '</td></tr>';
            }).join('') + '</tbody></table></div>' : '<div class="sub">Clear.</div>') + '</div>';
        }).join('') + prov('derived from live orders; this view reads and does not release');
    }
    if (mod === 'validate') {
      var pend = exOrders;
      return head('Result validation', 'Enter and validate results. A result only leaves the lab when a validator signs it; releasing writes it to the shared record.') +
        (pend.length ? pend.map(function (o) {
          var t = o.test;
          var val = t.code === 'HBA1C' ? '8.1' : t.code === 'CREAT' ? '1.0' : '180';
          var flag = parseFloat(val) > t.flagAbove;
          return '<div class="card shadow" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">' +
            '<div><div class="nm">' + esc(t.name) + ' &middot; ' + esc(o.pt) + '</div><div class="sub2 mono">ref ' + esc(t.ref) + ' ' + esc(t.unit) + ' &middot; ' + esc(o.id) + '</div></div>' +
            '<div style="display:flex;gap:10px;align-items:center"><span class="mono" style="font-size:18px;color:' + (flag ? 'var(--inconsistent)' : 'var(--verified)') + '">' + val + ' ' + esc(t.unit) + '</span>' +
            (flag ? '<span class="chip inconsistent">out of range</span>' : '<span class="chip verified">in range</span>') +
            '<button class="btn btn-primary btn-sm" data-release="' + esc(t.code) + '">Validate and release</button></div></div></div>';
        }).join('') : '<div class="card"><div class="sub">No results pending validation.</div></div>') +
        prov('IRIS checks delta against prior results; a human validator signs every release');
    }
    if (mod === 'qc') {
      var w = 100 / (QC.length - 1);
      var pts = QC.map(function (v, i) { var y = 70 - ((v - (QC_MEAN - 3 * QC_SD)) / (6 * QC_SD)) * 60; return (i * w).toFixed(1) + ',' + y.toFixed(1); }).join(' ');
      return head('Quality control', 'Levey-Jennings for the HbA1c analyzer, Westgard rules applied. Point 12 broke 1-3s and is held.') +
        '<div class="card shadow"><div style="display:flex;justify-content:space-between;align-items:center"><strong>HbA1c analyzer &middot; Level 2 control</strong><span class="chip inconsistent">1 rule violation</span></div>' +
        '<div class="lj"><svg viewBox="0 0 100 80" preserveAspectRatio="none"><line x1="0" y1="40" x2="100" y2="40" stroke="var(--iris-line)" stroke-width="0.5"/><line x1="0" y1="10" x2="100" y2="10" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2"/><line x1="0" y1="70" x2="100" y2="70" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="2"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="var(--iris)" stroke-width="0.8"/>' +
        QC.map(function (v, i) { var y = 70 - ((v - (QC_MEAN - 3 * QC_SD)) / (6 * QC_SD)) * 60; var hot = Math.abs(v - QC_MEAN) > 3 * QC_SD; return '<circle cx="' + (i * w).toFixed(1) + '" cy="' + y.toFixed(1) + '" r="1.3" fill="' + (hot ? 'var(--inconsistent)' : 'var(--iris)') + '"/>'; }).join('') +
        '</svg></div><div class="legend"><span><i style="background:var(--iris-line)"></i>mean ' + QC_MEAN + '%</span><span><i style="background:var(--border)"></i>&plusmn;3SD</span><span><i style="background:var(--inconsistent)"></i>violation</span></div></div>' +
        prov('no patient result is released from a run whose QC has not passed');
    }
    if (mod === 'tat') {
      var max = 50;
      return head('Turnaround', 'Median turnaround by department against target. Microbiology is the long pole, as expected for culture.') +
        kpis([['4.1h', 'median TAT'], ['92%', 'within target'], ['3', 'breaching now'], ['1,284', 'tests this week']]) +
        '<div class="card shadow">' + TAT.map(function (t) {
          var pct = Math.min(100, t.med / max * 100); var cls = t.med > t.tgt ? 'crit' : 'ok';
          return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>' + esc(t.d) + '</span><span class="mono">' + t.med + 'h &middot; target ' + t.tgt + 'h</span></div><div class="meter"><div class="fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
        }).join('') + '</div>' + prov('computed from accession-to-release timestamps');
    }
    if (mod === 'reagents') {
      return head('Reagents', 'On-hand stock against reorder point, with lot and expiry. Two lines are below reorder.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Reagent</th><th>Lot</th><th>Expiry</th><th class="num">On hand</th><th class="num">Reorder</th><th>Status</th></tr></thead><tbody>' +
        REAGENTS.map(function (r) {
          var low = r.onHand < r.reorder;
          return '<tr><td class="nm">' + esc(r.name) + '</td><td class="mono">' + esc(r.lot) + '</td><td class="mono">' + esc(r.exp) + '</td><td class="num">' + r.onHand + '</td><td class="num">' + r.reorder + '</td><td>' + (low ? '<span class="chip inconsistent">reorder</span>' : '<span class="chip verified">ok</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('a reagent lot ties every result to the batch that produced it');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'What this lab contributes to the EESG Health Impact framework, and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Results released on the exchange', value: String(X.labResults().filter(function (r) { return r.labOrgId === cur.id; }).length), status: X.labResults().some(function (r) { return r.labOrgId === cur.id; }) ? 'Verified' : 'Unmeasured' },
          { front: 'Care quality and safety', measure: 'QC pass rate', value: '99.3%', status: 'Claimed' },
          { front: 'Access and coverage', measure: 'Median turnaround', value: '4.1h', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'Critical results called < 1h', value: '96%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  function render() {
    var who = cur.personas[0];
    var exCount = exchangeOrders().length;
    var mods = MODS.map(function (m) { return m.key === 'orders' ? Object.assign({}, m, { badge: exCount || null, calm: true }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Prism', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var rel = e.target.getAttribute('data-release');
    if (rel) {
      var ord = X.care.labOrders({ labOrgId: cur.id }).filter(function (o) { return o.orderId === rel && !o.result; })[0];
      if (!ord) return;
      var ev = X.care.releaseLab(ord, cur.id, cur.personas[0].id);
      UI.toast('Released', ev.payload.testName + ' ' + ev.payload.value + ' ' + ev.payload.unit + ' is on the visit record (simulated analyzer).');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Diagnostic access and quality, Q current', measures: UI.verifiedMeasures(), status: 'Verified' }, { app: 'prism', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
