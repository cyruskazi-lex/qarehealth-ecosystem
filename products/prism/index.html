<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Prism</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .row .d { font-size: 14px; font-weight: 600; }
  .row .m { font-size: 12px; color: var(--mid); margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('prism');
  var orgs = X.orgsFor('prism');
  var cur = X.org('ORG-LAB');
  var pt = X.PATIENT;

  // Orders pending for Amara: one seeded order per test not yet resulted.
  function pendingTests() {
    var done = X.labResults().map(function (r) { return r.test; });
    return X.LAB_TESTS.filter(function (t) { return done.indexOf(t.code) < 0; });
  }

  function render() {
    var who = cur.personas[0];
    var pending = pendingTests();
    var results = X.labResults();
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Prism', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Laboratory</div>' +
        '<div class="greet">' + (pending.length ? (pending.length + ' order' + (pending.length > 1 ? 's' : '') + ' to result for ' + pt.name + '.') : 'Bench is clear. All orders resulted.') + '</div>' +
        '<div class="sub">Orders arrive from the exchange; released results land in Pulse and Nova</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Order queue and QC</h2>' +
            (pending.length ? pending.map(function (t) {
              return '<div class="row"><div><div class="d">' + UI.esc(t.name) + '</div><div class="m">' + UI.esc(pt.name) + ' · ref ' + UI.esc(t.ref) + ' ' + UI.esc(t.unit) + ' · <span class="mono">ORD-' + UI.esc(t.code) + '</span></div></div>' +
                '<button class="btn btn-primary btn-sm" data-result="' + UI.esc(t.code) + '">Run and release</button></div>';
            }).join('') : '<p class="sub" style="margin-top:6px">Nothing pending.</p>') +
            '<p class="provenance">releases a LAB_RESULT event to the exchange; the ordering clinician and the patient see it live</p>' +
          '</section>' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Released</h2>' +
              (results.length ? results.slice().reverse().map(function (r) {
                return '<div class="row"><div><div class="d">' + UI.esc(r.testName) + ' · ' + UI.esc(r.value) + ' ' + UI.esc(r.unit) + '</div><div class="m">' + UI.esc(r.patientName) + '</div></div>' +
                  (r.flag ? '<span class="chip inconsistent">out of range</span>' : '<span class="chip verified">normal</span>') + '</div>';
              }).join('') : '<p class="sub" style="margin-top:6px">No results yet.</p>') +
            '</div>' +
            '<div style="margin-top:20px">' + UI.impactPanel(cur, { measures: [
              { front: 'Care quality and safety', measure: 'QC pass rate', value: '99.3%', status: 'Verified' },
              { front: 'Access and coverage', measure: 'Median turnaround', value: '6h', status: 'Claimed' }
            ] }) + '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant');
    if (t) { cur = X.org(t); render(); return; }
    var code = e.target.getAttribute('data-result');
    if (code) {
      var test = X.labTest(code);
      // Deterministic demo values: HbA1c high (diabetes), others in range.
      var val = code === 'HBA1C' ? 8.1 : code === 'CREAT' ? 1.0 : 180;
      X.append('LAB_RESULT', { test: code, testName: test.name, value: val, unit: test.unit, flag: val > test.flagAbove, patientId: pt.id, patientName: pt.name, labOrgId: cur.id }, { app: 'prism', persona: cur.personas[0].id });
      UI.toast('Released', test.name + ' ' + val + ' ' + test.unit + ' is on the record.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Diagnostic access and quality, Q current', status: 'Verified' }, { app: 'prism', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
