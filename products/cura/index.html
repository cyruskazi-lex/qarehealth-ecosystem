<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Cura</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/care.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('cura');
  var orgs = X.orgsFor('cura');
  var cur = X.org('ORG-PHARMACY');
  var mod = 'dispensing';
  var seen = {};

  function scale() { return cur.sizeClass === 'LARGE' ? 50 : cur.sizeClass === 'MEDIUM' ? 6 : 1; }

  var INVENTORY = [
    { item: 'CardiNex-10', onHand: 180, reorder: 60, maker: 'Nexagen', status: 'ok' },
    { item: 'OncoNex-100', onHand: 4, reorder: 10, maker: 'Nexagen', status: 'low' },
    { item: 'Metformin 500', onHand: 640, reorder: 200, maker: 'Generic', status: 'ok' },
    { item: 'Amoxicillin 500', onHand: 22, reorder: 80, maker: 'Generic', status: 'low' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  var MODS = [
    { key: 'dispensing', label: 'Dispensing queue', ic: 'DQ', group: 'Counter' },
    { key: 'scan', label: 'Scan and reconcile', ic: 'SR', group: 'Counter' },
    { key: 'substitution', label: 'Substitution', ic: 'SB', group: 'Counter' },
    { key: 'counselling', label: 'Counselling', ic: 'CN', group: 'Counter' },
    { key: 'inventory', label: 'Inventory', ic: 'IN', group: 'Stock' },
    { key: 'serialization', label: 'Serialisation', ic: 'SZ', group: 'Stock' },
    { key: 'claims', label: 'Claims and billing', ic: 'CL', group: 'Finance' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function moduleBody() {
    var queue = X.prescriptions().filter(function (r) { return !X.isDispensed(r.rxId) && (!r.pharmacyId || r.pharmacyId === cur.id); });
    var elsewhere = X.prescriptions().filter(function (r) { return !X.isDispensed(r.rxId) && r.pharmacyId && r.pharmacyId !== cur.id; }).length;
    var done = X.dispenses().filter(function (d) { return !d.byOrgId || d.byOrgId === cur.id; });
    if (mod === 'dispensing') {
      return head('Dispensing queue', 'Prescriptions arrive from Pulse addressed to this pharmacy, because the patient chose it. Dispensing sends a supply signal to the maker, never the patient\'s name.') +
        kpis([[queue.length, 'waiting'], [done.length, 'dispensed today'], ['not yet', 'checked against Relay'], [INVENTORY.filter(function (i) { return i.status === 'low'; }).length, 'lines low']]) +
        (queue.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th>Patient</th><th>Prescriber</th><th>Rx</th><th></th></tr></thead><tbody>' +
          queue.slice().reverse().map(function (r) { var fresh = !seen[r.rxId]; seen[r.rxId] = true; return '<tr' + (fresh ? ' style="background:var(--iris-tint)"' : '') + '><td class="nm">' + esc(r.drugName) + ' x' + r.qty + '</td><td>' + esc(r.patientName) + '</td><td>' + esc(r.prescriber) + '</td><td class="mono sub2">' + esc(r.rxId) + '</td><td style="text-align:right"><button class="btn btn-primary btn-sm" data-disp="' + esc(r.rxId) + '">Scan and dispense</button></td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">Counter is clear' + (elsewhere ? ', and ' + elsewhere + ' prescription' + (elsewhere > 1 ? 's are' : ' is') + ' waiting at other pharmacies the patients chose' : '') + '. Open Pulse in another tab and write a prescription for ' + esc(cur.name) + '; it appears here live.</div></div>') +
        prov('reads RX_WRITTEN addressed to this pharmacy; dispensing writes RX_DISPENSED and a SUPPLY_SIGNAL to the maker');
    }
    if (mod === 'scan') {
      return head('Scan and reconcile', 'Every pack is scanned against the manufacturer serial before it leaves the counter, so a counterfeit cannot be dispensed.') +
        '<div class="card shadow"><div class="sub" style="font-size:13px;margin-bottom:12px">Scan a pack to reconcile it against the Relay chain of custody. A serial that does not match, or that was already dispensed, is rejected.</div>' +
        '<div class="qt-wrap" style="border:0"><table class="qt"><tbody>' +
        (done.length ? done.slice().reverse().map(function (d) { return '<tr><td class="mono">' + esc(d.packSerial || d.rxId) + '</td><td class="nm">' + esc(d.drugName) + '</td><td><span class="chip claimed">scanned</span></td></tr>'; }).join('') : '<tr><td class="sub">No packs scanned yet. Dispense from the queue.</td></tr>') +
        '</tbody></table></div></div>' + prov('the same serial reconciles against the Relay track-and-trace chain');
    }
    if (mod === 'substitution') {
      return head('Substitution', 'Generic and formulary substitution against the live catalogue, with the prescriber and payer rules applied.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Prescribed</th><th>Substitute</th><th class="num">Saving</th><th>Rule</th></tr></thead><tbody>' +
        [['CardiNex-10 (brand)', 'Amlodipine generic', '78%', 'Payer prefers generic'], ['OncoNex-100', 'No substitute', '0%', 'Biologic, no generic']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="num">' + esc(r[2]) + '</td><td class="sub2">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('substitution reads the formulary and the payer plan from the exchange, not a paper list');
    }
    if (mod === 'counselling') {
      return head('Counselling', 'Patient counselling prompts generated from the record, so advice fits the person, not just the drug.') +
        '<div class="card shadow"><div class="iris" style="background:var(--iris-tint);border:1px solid var(--iris-line);border-radius:12px;padding:13px;font-size:13px"><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--iris-deep);margin-bottom:5px">IRIS</div>Amara takes metformin and is now on CardiNex-10. Counsel on taking it at the same time daily, and flag that she is penicillin allergic for any future antibiotic. Advice is grounded in her record; the pharmacist delivers it.</div></div>' +
        prov('counselling prompts read the record, so they account for her other medicines and allergies');
    }
    if (mod === 'inventory') {
      return head('Inventory', 'Stock against reorder point. Two lines are low; dispensing draws down automatically.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th>Maker</th><th class="num">On hand</th><th class="num">Reorder</th><th>Status</th><th></th></tr></thead><tbody>' +
        INVENTORY.map(function (i) { return '<tr><td class="nm">' + esc(i.item) + '</td><td>' + esc(i.maker) + '</td><td class="num">' + i.onHand + '</td><td class="num">' + i.reorder + '</td><td>' + (i.status === 'low' ? '<span class="chip inconsistent">reorder</span>' : '<span class="chip verified">ok</span>') + '</td><td style="text-align:right">' + (i.status === 'low' ? '<button class="btn btn-primary btn-sm">Order via Relay</button>' : '') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a reorder routes to Relay for serialised, cold-chain-aware replenishment');
    }
    if (mod === 'serialization') {
      return head('Serialisation', 'The GS1 serials this pharmacy holds and has dispensed, each traceable to the maker and the patient.') +
        kpis([[done.length, 'dispensed, serialised'], ['not yet', 'checked against Relay'], ['0', 'suspect serials'], ['0', 'duplicates']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Every pack carries an SGTIN scanned at receipt from Relay and again at dispense. The chain means a recall from Nexus can name the exact packs this pharmacy holds, and the exact patients who received one.</div></div>' +
        prov('serialisation closes the loop from manufacturer to patient, both directions');
    }
    if (mod === 'claims') {
      var claimed = X.claims().length;
      return head('Claims and billing', 'Dispensing creates a claim that the payer in Shield adjudicates against this exact dispensing event.') +
        kpis([[done.length, 'billable dispenses'], [claimed, 'adjudicated by payer'], [money(Math.round(done.length * 42 * 0.8)), 'reimbursed'], ['0', 'rejected']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Because the claim is the dispensing event, there is no separate billing entry to reconcile. The pharmacist dispenses once; the payer in Shield sees the claim and the record behind it at the same moment.</div></div>' +
        prov('one event is both the dispense and the claim, so billing cannot drift from what was given');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The pharmacy\'s contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Scripts filled on the exchange', value: String(done.length), status: done.length ? 'Verified' : 'Unmeasured' },
          { front: 'Supply integrity and pharmacovigilance', measure: 'Serialised packs verified', value: '100%', status: 'Claimed' },
          { front: 'Affordability and financial protection', measure: 'Generic substitution rate', value: '63%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function render() {
    var who = cur.personas[0];
    var q = X.prescriptions().filter(function (r) { return !X.isDispensed(r.rxId) && (!r.pharmacyId || r.pharmacyId === cur.id); }).length;
    var mods = MODS.map(function (m) { return m.key === 'dispensing' ? Object.assign({}, m, { badge: q || null, calm: true }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Cura', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var rx = e.target.getAttribute('data-disp');
    if (rx) {
      var res = X.care.dispense({ rxId: rx, pharmacyId: cur.id, personaId: cur.personas[0].id });
      if (!res) return;
      UI.toast('Dispensed', esc(res.dispense.drugName) + ' &middot; pack ' + esc(res.dispense.packSerial) + '. Supply signal sent to the maker, ' + (res.signal.indication ? 'with clinical context the patient allowed.' : 'without clinical context (no patient opt-in).'));
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Medicines access, Q current', measures: UI.verifiedMeasures(), status: 'Verified' }, { app: 'cura', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_WRITTEN') return { k: 'Pulse', msg: esc(ev.payload.prescriber) + ' wrote ' + esc(ev.payload.drugName) + ' for ' + esc(ev.payload.patientName) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
