<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Cura</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 28px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .task { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .task.fresh { animation: flash 1.4s ease; }
  @keyframes flash { 0%{background:var(--iris-tint);border-color:var(--iris-line)} 100%{background:var(--surface)} }
  .task .t-d { font-size: 14px; font-weight: 600; }
  .task .t-m { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .empty { color: var(--mid); font-size: 14px; padding: 18px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('cura');
  var orgs = X.orgsFor('cura'), cur = X.org('ORG-PHARMACY'), who = cur.personas[0];
  var lastSeen = {};

  function render() {
    who = cur.personas[0];
    var queue = X.prescriptions().filter(function (r) { return !X.isDispensed(r.rxId); });
    var doneCount = X.dispenses().length;
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Cura', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Pharmacist workspace</div>' +
        '<div class="greet">' + (queue.length ? (queue.length + ' prescription' + (queue.length > 1 ? 's' : '') + ' waiting to dispense.') : 'Nothing waiting. The counter is clear.') + '</div>' +
        '<div class="sub">' + UI.esc(cur.name) + ' · ' + UI.esc(cur.region) + ' · prescriptions arrive from Pulse the moment a clinician writes them</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Dispensing queue</h2>' +
            (queue.length ? queue.slice().reverse().map(function (r) {
              var fresh = !lastSeen[r.rxId]; lastSeen[r.rxId] = true;
              return '<div class="task' + (fresh ? ' fresh' : '') + '">' +
                '<div><div class="t-d">' + UI.esc(r.drugName) + ' x' + r.qty + '</div>' +
                '<div class="t-m">' + UI.esc(r.patientName) + ' · prescribed by ' + UI.esc(r.prescriber) + ' · <span class="mono">' + UI.esc(r.rxId) + '</span></div></div>' +
                '<button class="btn btn-primary btn-sm" data-dispense="' + UI.esc(r.rxId) + '">Scan pack and dispense</button>' +
              '</div>';
            }).join('') : '<div class="empty">Open Pulse in another tab, write a prescription, and it appears here live.</div>') +
            '<p class="provenance">reads RX events from the exchange; dispensing writes back a serialised pack event</p>' +
          '</section>' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Dispensed today</h2>' +
              '<div class="figs"><div class="fig"><div class="fv">' + doneCount + '</div><div class="fk">packs dispensed</div></div>' +
              '<div class="fig"><div class="fv">100%</div><div class="fk">serial reconciled</div></div></div></div>' +
            '<div style="margin-top:20px">' + UI.impactPanel(cur, { measures: [
              { front: 'Access and coverage', measure: 'Scripts filled, quarter', value: '3,910', status: 'Verified' },
              { front: 'Supply integrity and pharmacovigilance', measure: 'Serialised packs verified', value: '100%', status: 'Verified' }
            ] }) + '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant');
    if (t) { cur = X.org(t); who = cur.personas[0]; render(); return; }
    var rx = e.target.getAttribute('data-dispense');
    if (rx) {
      var p = X.prescriptions().filter(function (r) { return r.rxId === rx; })[0];
      if (!p) return;
      var serial = 'PK-' + p.drug.slice(0, 4) + '-' + Date.now().toString().slice(-5);
      X.append('RX_DISPENSED', { rxId: rx, drug: p.drug, drugName: p.drugName, qty: p.qty, packSerial: serial, byOrgId: cur.id, maker: p.maker, region: p.region, patientName: p.patientName }, { app: 'cura', persona: who.id });
      X.append('DEMAND_SIGNAL', { drug: p.drug, drugName: p.drugName, qty: p.qty, region: p.region, maker: p.maker }, { app: 'cura', persona: who.id });
      UI.toast('Dispensed', p.drugName + ' · pack ' + serial + '. Demand signal sent to the maker.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Medicines access, Q current', status: 'Verified' }, { app: 'cura', persona: who.id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_WRITTEN') return { k: 'Pulse', msg: UI.esc(ev.payload.prescriber) + ' wrote ' + UI.esc(ev.payload.drugName) + ' for ' + UI.esc(ev.payload.patientName) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
