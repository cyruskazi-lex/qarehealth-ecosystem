<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .gate { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--hairline); border-radius: 12px; margin-bottom: 10px; background: var(--surface); }
  .gate .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; flex: 0 0 auto; }
  .gate.ok .ic { background: var(--verified-tint); color: var(--verified); }
  .gate.block .ic { background: var(--unmeasured-tint); color: var(--mid); }
  .gate .g-t { font-size: 13px; font-weight: 600; } .gate .g-m { font-size: 12px; color: var(--mid); }
  .cohort-n { font-family: var(--font-mono); font-size: 40px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('lumen');
  var orgs = X.orgsFor('lumen');
  var cur = X.org('ORG-LUMEN-MID');

  function render() {
    var who = cur.personas[0];
    var consented = X.consentGranted('research') === true;
    // Cohort size is a de-identified count; base plus the one consented record.
    var base = cur.sizeClass === 'LARGE' ? 128400 : cur.sizeClass === 'MEDIUM' ? 24100 : 3200;
    var n = base + (consented ? 1 : 0);
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Lumen', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Research</div>' +
        '<div class="greet">A cohort you can trust, built only from consent.</div>' +
        '<div class="sub">Draws anonymised records from the Commons; a record enters only with the patient\'s secondary-use consent</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Cohort: Type 2 diabetes, adults</h2>' +
            '<div class="cohort-n">' + n.toLocaleString('en-US') + '</div>' +
            '<div class="sub" style="margin-top:2px">consented, anonymised records</div>' +
            '<div style="margin-top:16px">' +
            '<div class="gate ok"><span class="ic">✓</span><div><div class="g-t">Consent provenance verified</div><div class="g-m">every record carries a live, revocable secondary-use grant</div></div></div>' +
            '<div class="gate ok"><span class="ic">✓</span><div><div class="g-t">De-identification applied</div><div class="g-m">no name, MRN or provider identity in the export</div></div></div>' +
            '<div class="gate ' + (consented ? 'ok' : 'block') + '"><span class="ic">' + (consented ? '✓' : '·') + '</span><div><div class="g-t">Amara Okonkwo (demo record)</div><div class="g-m">' + (consented ? 'included: she granted research consent in Nova' : 'excluded: no research consent yet. Grant it in Nova and watch the cohort update') + '</div></div></div>' +
            '</div>' +
            '<button class="btn btn-primary" style="margin-top:14px">Export study dataset</button>' +
            '<p class="provenance">reads CONSENT events from the exchange; a revoked grant removes the record from the next build</p>' +
          '</section>' +
          '<section>' + UI.impactPanel(cur, { measures: [
            { front: 'Health outcomes', measure: 'Studies supported, year', value: '12', status: 'Verified' },
            { front: 'Governance', measure: 'Records without valid consent', value: '0', status: 'Verified' }
          ] }) + '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Research evidence generated, year', status: 'Verified' }, { app: 'lumen', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified research record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'CONSENT_GRANTED' && ev.payload.to === 'research') return { k: 'Nova', msg: 'A patient granted research consent. Cohort updated.' };
    if (ev.type === 'CONSENT_REVOKED' && ev.payload.to === 'research') return { k: 'Nova', msg: 'Research consent revoked. Record removed from the cohort.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
