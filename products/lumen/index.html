<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .gate { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--hairline); border-radius: 12px; margin-bottom: 10px; background: var(--surface); }
  .gate .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; flex: 0 0 auto; margin-top: 1px; }
  .gate.ok .ic { background: var(--verified-tint); color: var(--verified); }
  .gate.block .ic { background: var(--unmeasured-tint); color: var(--mid); }
  .gate .g-t { font-size: 13px; font-weight: 600; } .gate .g-m { font-size: 12px; color: var(--mid); }
  .cohort-n { font-family: var(--font-mono); font-size: 40px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('lumen');
  var orgs = X.orgsFor('lumen');
  var cur = X.org('ORG-LUMEN-MID');
  var mod = 'cohort';

  function base() { return cur.sizeClass === 'LARGE' ? 128400 : cur.sizeClass === 'MEDIUM' ? 24100 : 3200; }

  var STUDIES = [
    { id: 'STU-114', title: 'Metformin adherence and HbA1c, T2DM', phase: 'Enrolling', n: 24100, irb: 'Approved' },
    { id: 'STU-108', title: 'Hypertension control in primary care', phase: 'Analysis', n: 11800, irb: 'Approved' },
    { id: 'STU-121', title: 'Dengue severity predictors', phase: 'Design', n: 0, irb: 'Under review' }
  ];
  var DICT = [
    { field: 'age_band', type: 'categorical', deid: '5-year bands' },
    { field: 'sex', type: 'categorical', deid: 'as recorded' },
    { field: 'hba1c', type: 'numeric', deid: 'value, no identifier' },
    { field: 'district', type: 'categorical', deid: 'district only, no village' },
    { field: 'medication', type: 'categorical', deid: 'ATC class' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  var MODS = [
    { key: 'cohort', label: 'Cohort builder', ic: 'CB', group: 'Study' },
    { key: 'provenance', label: 'Consent provenance', ic: 'CP', group: 'Study' },
    { key: 'studies', label: 'Studies', ic: 'ST', group: 'Study' },
    { key: 'dataset', label: 'Datasets', ic: 'DS', group: 'Data' },
    { key: 'dictionary', label: 'Data dictionary', ic: 'DD', group: 'Data' },
    { key: 'ethics', label: 'Ethics and IRB', ic: 'ET', group: 'Governance' },
    { key: 'evidence', label: 'Evidence outputs', ic: 'EV', group: 'Governance' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Governance' }
  ];

  function moduleBody() {
    var consented = X.consentGranted('research') === true;
    var n = base() + (consented ? 1 : 0);
    if (mod === 'cohort') {
      return head('Cohort builder', 'A cohort drawn from the Commons, where a record enters only with the patient\'s secondary-use consent.') +
        '<div class="split"><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Type 2 diabetes, adults</div>' +
        '<div class="cohort-n">' + n.toLocaleString('en-US') + '</div><div class="sub" style="margin-top:2px">consented, anonymised records</div>' +
        '<div style="margin-top:16px">' +
        '<div class="gate ok"><span class="ic">&#10003;</span><div><div class="g-t">Consent provenance verified</div><div class="g-m">every record carries a live, revocable secondary-use grant</div></div></div>' +
        '<div class="gate ok"><span class="ic">&#10003;</span><div><div class="g-t">De-identification applied</div><div class="g-m">no name, MRN or provider identity in the export</div></div></div>' +
        '<div class="gate ' + (consented ? 'ok' : 'block') + '"><span class="ic">' + (consented ? '&#10003;' : '&middot;') + '</span><div><div class="g-t">Amara Okonkwo (demo record)</div><div class="g-m">' + (consented ? 'included: she granted research consent in Nova' : 'excluded: no research consent yet. Grant it in Nova and watch the cohort update') + '</div></div></div>' +
        '</div><button class="btn btn-primary" style="margin-top:14px">Export study dataset</button></div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Inclusion criteria</div>' +
        '<div class="sub" style="font-size:13px">Adults 18 and over, diagnosis of T2DM on the record, at least one HbA1c result, secondary-use consent active. The count updates live as consent changes in Nova and as results are released in Prism.</div></div></div>' +
        prov('reads CONSENT events; a revoked grant removes the record from the next build');
    }
    if (mod === 'provenance') {
      var grants = X.events().filter(function (e) { return e.type === 'CONSENT_GRANTED' || e.type === 'CONSENT_REVOKED'; }).filter(function (e) { return e.payload.to === 'research'; });
      return head('Consent provenance', 'The audit trail that lets a reviewer confirm every record in the cohort is there by consent.') +
        kpis([[n.toLocaleString(), 'in cohort'], ['100%', 'with valid consent'], [X.eventsOfType('CONSENT_REVOKED').length, 'revocations honoured'], ['0', 'records without consent']]) +
        (grants.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Event</th><th>Scope</th><th>Effect on cohort</th><th>Time</th></tr></thead><tbody>' +
          grants.slice().reverse().map(function (e) { var g = e.type === 'CONSENT_GRANTED'; return '<tr><td>' + (g ? '<span class="chip verified">granted</span>' : '<span class="chip inconsistent">revoked</span>') + '</td><td>secondary use</td><td>' + (g ? 'record added' : 'record removed') + '</td><td class="mono">' + UI.timeOf(e.ts) + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">No research-consent events yet. Toggle research consent in Nova to see the trail build.</div></div>') +
        prov('consent is not a checkbox at enrollment; it is a live grant the patient can withdraw at any time');
    }
    if (mod === 'studies') {
      return head('Studies', 'Active and planned studies drawing on consented cohorts.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Study</th><th>Title</th><th>Phase</th><th class="num">N</th><th>IRB</th></tr></thead><tbody>' +
        STUDIES.map(function (s) { var c = s.phase === 'Analysis' ? 'claimed' : s.phase === 'Design' ? '' : 'verified'; return '<tr><td class="mono">' + esc(s.id) + '</td><td class="nm">' + esc(s.title) + '</td><td><span class="chip ' + c + '">' + esc(s.phase) + '</span></td><td class="num">' + s.n.toLocaleString() + '</td><td>' + (s.irb === 'Approved' ? '<span class="chip verified">approved</span>' : '<span class="chip claimed">review</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a study cannot enrol a record whose consent does not cover its purpose');
    }
    if (mod === 'dataset') {
      return head('Datasets', 'Export-ready, de-identified datasets with their consent and quality lineage.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Dataset</th><th>Study</th><th class="num">Rows</th><th>De-identified</th><th>Consent</th></tr></thead><tbody>' +
        [['DS-114a', 'STU-114', n, 'Yes', 'Verified'], ['DS-108a', 'STU-108', 11800, 'Yes', 'Verified']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="mono">' + esc(r[1]) + '</td><td class="num">' + r[2].toLocaleString() + '</td><td>' + UI.statusChip('Verified').replace('Verified', 'Yes') + '</td><td>' + UI.statusChip(r[4]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('a dataset carries its own lineage, so a reviewer can trace any row back to a consented record');
    }
    if (mod === 'dictionary') {
      return head('Data dictionary', 'Every field a study can use, and how it is de-identified before it leaves the exchange.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Field</th><th>Type</th><th>De-identification</th></tr></thead><tbody>' +
        DICT.map(function (d) { return '<tr><td class="mono nm">' + esc(d.field) + '</td><td>' + esc(d.type) + '</td><td class="sub2">' + esc(d.deid) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('fine-grained identifiers such as village or exact date never leave the exchange');
    }
    if (mod === 'ethics') {
      return head('Ethics and IRB', 'The governance that stands between a research question and a person\'s record.') +
        '<div class="cards3">' + [['Purpose binding', 'A record is used only for the purpose its consent names, never repurposed silently.'], ['IRB approval', 'Every study carries an approval on file before it can build a cohort.'], ['Right to withdraw', 'A withdrawn consent removes the record from future builds and is logged.']].map(function (c) { return '<div class="card shadow"><div style="font-weight:700;font-size:14px;margin-bottom:6px">' + esc(c[0]) + '</div><div class="sub" style="font-size:13px">' + esc(c[1]) + '</div></div>'; }).join('') + '</div>' +
        prov('consent, purpose and approval are enforced together; one missing piece blocks the build');
    }
    if (mod === 'evidence') {
      return head('Evidence outputs', 'What the research produces, and how it flows back to care and to the Commons.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Output</th><th>Study</th><th>Status</th></tr></thead><tbody>' +
        [['Adherence improves HbA1c by 0.6%', 'STU-114', 'Preprint'], ['Primary-care BP protocol effective', 'STU-108', 'Published'], ['Guideline update proposed', 'STU-108', 'Under review']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td class="mono">' + esc(r[1]) + '</td><td>' + (r[2] === 'Published' ? '<span class="chip verified">published</span>' : '<span class="chip claimed">' + esc(r[2]) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('evidence generated here can become a verified health-outcome record on the Commons');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The research contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Health outcomes', measure: 'Studies supported, year', value: '12', status: 'Verified' },
          { front: 'Governance', measure: 'Records without valid consent', value: '0', status: 'Verified' },
          { front: 'Social', measure: 'Evidence adopted into guidelines', value: '3', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function render() {
    var who = cur.personas[0];
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Lumen', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(MODS, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Research evidence generated, year', status: 'Verified' }, { app: 'lumen', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified research record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'CONSENT_GRANTED' && ev.payload.to === 'research') return { k: 'Nova', msg: 'A patient granted research consent. Cohort updated.' };
    if (ev.type === 'CONSENT_REVOKED' && ev.payload.to === 'research') return { k: 'Nova', msg: 'Research consent revoked. Record removed from the cohort.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
