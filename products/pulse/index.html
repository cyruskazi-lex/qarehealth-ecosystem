<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .rx label { display: block; font-size: 12px; color: var(--mid); margin: 10px 0 4px; font-weight: 600; }
  .rx select, .rx input { width: 100%; font-family: var(--font-ui); font-size: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .rx select:focus, .rx input:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--iris-bright); }
  .rec { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .rec .k { color: var(--mid); }
  .iris { background: var(--iris-tint); border: 1px solid var(--iris-line); border-radius: 12px; padding: 13px; font-size: 13px; }
  .iris .h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-deep); margin-bottom: 5px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('pulse');
  var orgs = X.orgsFor('pulse');
  var cur = X.org('ORG-CLINIC');
  var mod = 'queue';
  var pt = X.PATIENT;

  var QUEUE = [
    { name: 'Amara Okonkwo', mrn: 'QH-PT-100482', reason: 'Hypertension review', wait: 'now', focus: true },
    { name: 'M. Rahman', mrn: 'QH-PT-100771', reason: 'Diabetes follow-up', wait: '10 min' },
    { name: 'S. Begum', mrn: 'QH-PT-100088', reason: 'Antenatal visit', wait: '25 min' },
    { name: 'K. Das', mrn: 'QH-PT-100342', reason: 'Fever, 3 days', wait: '40 min' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  var MODS = [
    { key: 'queue', label: 'Patient queue', ic: 'PQ', group: 'Clinic' },
    { key: 'record', label: 'Patient record', ic: 'PR', group: 'Clinic' },
    { key: 'prescribe', label: 'Prescribe', ic: 'RX', group: 'Clinic' },
    { key: 'orders', label: 'Orders', ic: 'OR', group: 'Clinic' },
    { key: 'results', label: 'Results', ic: 'RS', group: 'Clinic' },
    { key: 'referrals', label: 'Referrals', ic: 'RF', group: 'Coordination' },
    { key: 'tasks', label: 'Tasks', ic: 'TK', group: 'Coordination' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function moduleBody() {
    var sent = X.prescriptions().filter(function (r) { return r.by === 'pulse'; });
    var results = X.labResults().filter(function (r) { return r.patientId === pt.id; });
    if (mod === 'queue') {
      return head('Patient queue', QUEUE.length + ' patients waiting. Open the record, decide, and the decision is on the exchange before they leave.') +
        kpis([[QUEUE.length, 'in queue'], [sent.length, 'prescribed today'], [results.filter(function (r) { return r.flag; }).length, 'abnormal results back'], ['12 min', 'mean consult']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>Reason</th><th>Waiting</th><th></th></tr></thead><tbody>' +
        QUEUE.map(function (q) { return '<tr><td><div class="nm">' + esc(q.name) + '</div><div class="sub2 mono">' + esc(q.mrn) + '</div></td><td>' + esc(q.reason) + '</td><td class="mono">' + esc(q.wait) + '</td><td style="text-align:right"><button class="btn ' + (q.focus ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-mod="record">Open</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('the queue reads appointment and referral events; opening a record pulls it from the exchange');
    }
    if (mod === 'record') {
      return head('Patient record', 'One record, assembled from every app that has touched this patient. Consent to it is held by the patient in Nova.') +
        '<div class="split"><div class="card shadow">' +
        '<div style="font-family:var(--font-brand);font-weight:700;font-size:16px;margin-bottom:10px">' + esc(pt.name) + '</div>' +
        '<div class="rec"><span class="k">Identifiers</span><span>' + pt.age + ', ' + esc(pt.sex) + ' &middot; <span class="mono">' + esc(pt.mrn) + '</span></span></div>' +
        '<div class="rec"><span class="k">Conditions</span><span>' + esc(pt.conditions.join(', ')) + '</span></div>' +
        '<div class="rec"><span class="k">Allergies</span><span style="color:var(--inconsistent)">' + esc(pt.allergies.join(', ')) + '</span></div>' +
        '<div class="rec"><span class="k">Active medicines</span><span>' + (sent.length ? esc(sent.map(function (r) { return r.drugName; }).join(', ')) : 'none recorded') + '</span></div>' +
        '<div class="rec"><span class="k">Recent results</span><span>' + (results.length ? esc(results.map(function (r) { return r.testName + ' ' + r.value + r.unit; }).join(', ')) : 'none yet') + '</span></div>' +
        '<button class="btn btn-primary" style="margin-top:14px" data-mod="prescribe">Prescribe</button> <button class="btn btn-ghost" style="margin-top:14px" data-mod="orders">Order a test</button>' +
        '</div><div class="card shadow"><div class="iris"><div class="h">IRIS</div>Blood pressure trend is up over three visits and her HbA1c, if ordered, will confirm control. CardiNex-10 suits the hypertension and has no interaction with her metformin. She is penicillin allergic, not relevant here. A licensed clinician decides.</div></div></div>' +
        prov('reads from the exchange; the record is assembled, not re-entered');
    }
    if (mod === 'prescribe') {
      return head('Prescribe', 'Write to the exchange. The pharmacy in Cura, the maker in Nexus and the patient in Nova all see it at once.') +
        '<div class="split"><div class="card shadow rx">' +
        '<label for="drug">Medicine</label><select id="drug">' + X.FORMULARY.map(function (d) { return '<option value="' + d.code + '">' + esc(d.name) + ' &middot; ' + esc(d.form) + '</option>'; }).join('') + '</select>' +
        '<label for="qty">Quantity (packs)</label><input id="qty" type="number" value="1" min="1" max="12">' +
        '<label for="sig">Directions</label><input id="sig" value="One tablet daily">' +
        '<button class="btn btn-primary" id="writeRx" style="margin-top:14px;width:100%">Write prescription to the exchange</button></div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Written this session</div>' +
        (sent.length ? sent.slice().reverse().map(function (r) { return '<div class="rec"><span>' + esc(r.drugName) + ' x' + r.qty + '</span>' + (X.isDispensed(r.rxId) ? '<span class="chip verified">dispensed</span>' : '<span class="chip claimed">at pharmacy</span>') + '</div>'; }).join('') : '<div class="sub">Nothing yet.</div>') + '</div></div>' +
        prov('writes an RX_WRITTEN event; a licensed clinician signs every prescription');
    }
    if (mod === 'orders') {
      return head('Orders', 'Order a lab or imaging test. It routes to the lab in Prism and the result returns to this record.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Test</th><th>Department</th><th>Status</th><th></th></tr></thead><tbody>' +
        X.LAB_TESTS.map(function (t) { var done = results.some(function (r) { return r.test === t.code; }); return '<tr><td class="nm">' + esc(t.name) + '</td><td>Chemistry</td><td>' + (done ? '<span class="chip verified">resulted</span>' : '<span class="chip claimed">ordered</span>') + '</td><td style="text-align:right">' + (done ? '<button class="btn btn-ghost btn-sm" data-mod="results">View</button>' : '<span class="sub2">awaiting Prism</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('an order is a message to Prism; release there lands the result back here, no fax, no paper');
    }
    if (mod === 'results') {
      return head('Results', 'Results released by the lab in Prism, on the record the moment they are validated.') +
        (results.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Test</th><th class="num">Value</th><th>Reference</th><th>Flag</th></tr></thead><tbody>' +
          results.slice().reverse().map(function (r) { var tt = X.labTest(r.test); return '<tr><td class="nm">' + esc(r.testName) + '</td><td class="num">' + esc(r.value) + ' ' + esc(r.unit) + '</td><td class="sub2">' + esc(tt ? tt.ref : '') + '</td><td>' + (r.flag ? '<span class="chip inconsistent">out of range</span>' : '<span class="chip verified">normal</span>') + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">No results yet. Open Prism in another tab and release a result for Amara; it lands here live.</div></div>') +
        prov('reads LAB_RESULT events; a flagged result is surfaced, not buried in a report');
    }
    if (mod === 'referrals') {
      var mine = X.referrals();
      return head('Referrals', 'Refer to a hospital or specialist. The receiving facility in Apex sees it live.') +
        '<div class="card shadow" style="margin-bottom:14px"><div class="sub" style="font-size:13px">To refer this patient to the district hospital, confirm below. In the full build, community referrals also arrive here from Bridge.</div><button class="btn btn-primary" style="margin-top:12px">Refer to Shapla District Hospital</button></div>' +
        (mine.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>From</th><th>Reason</th></tr></thead><tbody>' + mine.slice().reverse().map(function (r) { return '<tr><td class="nm">' + esc(r.patientName) + '</td><td>' + esc(r.village || 'clinic') + '</td><td>' + esc(r.reason) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
        prov('a referral is a shared event, so the hospital has the record before the patient arrives');
    }
    if (mod === 'tasks') {
      return head('Tasks', 'Follow-ups and results that need the clinician to act.') +
        '<div class="card shadow">' +
        taskRow(results.some(function (r) { return r.flag; }) ? 'crit' : 'idle', 'Abnormal HbA1c to review', results.some(function (r) { return r.test === 'HBA1C' && r.flag; }) ? 'Amara Okonkwo, 8.1%' : 'none pending') +
        taskRow('warn', 'Two prescriptions awaiting pickup', 'follow up if not collected in 48h') +
        taskRow('idle', 'Antenatal recall, S. Begum', 'due next week') + '</div>' +
        prov('tasks are generated from events on the record, not a separate to-do list');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The clinic\'s contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Consults completed, quarter', value: '1,284', status: 'Verified' },
          { front: 'Care quality and safety', measure: 'Guideline-concordant scripts', value: '96%', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'BP controlled at 6 months', value: '71%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function taskRow(sev, t, s) { return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + sev + '"></span><div style="flex:1"><span style="font-size:13px;font-weight:600">' + esc(t) + '</span></div><span class="sub2">' + esc(s) + '</span></div>'; }

  function render() {
    var who = cur.personas[0];
    var abn = X.labResults().filter(function (r) { return r.patientId === pt.id && r.flag; }).length;
    var mods = MODS.map(function (m) { return m.key === 'results' ? Object.assign({}, m, { badge: abn || null }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Pulse', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.id === 'writeRx') {
      var code = document.getElementById('drug').value; var qty = Math.max(1, parseInt(document.getElementById('qty').value, 10) || 1);
      var d = X.drug(code);
      X.append('RX_WRITTEN', { rxId: 'RX-' + Date.now().toString().slice(-6), by: 'pulse', patientId: pt.id, patientName: pt.name, drug: code, drugName: d.name, qty: qty, maker: d.maker, orgId: cur.id, region: cur.region, prescriber: who() }, { app: 'pulse', persona: cur.personas[0].id });
      UI.toast('Written', d.name + ' x' + qty + ' is now on the exchange.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Primary care access, Q current', status: 'Verified' }, { app: 'pulse', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });
  function who() { return cur.personas[0].name; }

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'LAB_RESULT' && ev.payload.patientId === pt.id) return { k: 'Prism', msg: ev.payload.testName + ' resulted: ' + ev.payload.value + ' ' + ev.payload.unit + '.' };
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'A prescription was dispensed.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
