<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .rx label { display: block; font-size: 12px; color: var(--mid); margin: 10px 0 4px; font-weight: 600; }
  .rx select, .rx input { width: 100%; font-family: var(--font-ui); font-size: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .rx select:focus, .rx input:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--iris-bright); }
  .rec { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .rec .k { color: var(--mid); flex: none; }
  .iris { background: var(--iris-tint); border: 1px solid var(--iris-line); border-radius: 12px; padding: 13px; font-size: 13px; }
  .iris .h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-deep); margin-bottom: 5px; }
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fld label { font-size: 12px; color: var(--mid); font-weight: 600; }
  .fld input, .fld select { width: 100%; font-family: var(--font-ui); font-size: 13px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .fld input:focus-visible, .fld select:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .grid3, .grid2 { grid-template-columns: 1fr; } }
  .cand { border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); } .cand.sel { border-color: var(--iris-line); background: var(--iris-tint); }
  .sms { background: var(--chrome); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-family: var(--font-mono); font-size: 12px; margin: 10px 0; }
  .sub2 { font-size: 12px; color: var(--mid); }
  .step { display: flex; align-items: center; gap: 10px; font-family: var(--font-brand); font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .step .n { width: 24px; height: 24px; border-radius: 999px; background: var(--iris-tint); border: 1px solid var(--iris-line); color: var(--iris-deep); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .tl { border-left: 2px solid var(--hairline); margin-left: 6px; padding-left: 14px; }
  .tl .it { padding: 6px 0; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/care.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, C = X.care;
  UI.init('pulse');
  var orgs = X.orgsFor('pulse');
  var cur = X.org('ORG-CLINIC');
  var mod = 'queue';

  var QUEUE = [
    { name: 'Amara Okonkwo', mrn: 'QH-PT-100482', reason: 'Hypertension review', wait: 'now', focus: true, q: { name: 'Amara Okonkwo', sex: 'F', dob: '1974-03-12', phone: '01711000482', village: 'Dhaka', father: '' } },
    { name: 'M. Rahman', mrn: 'QH-PT-100771', reason: 'Diabetes follow-up', wait: '10 min', q: { name: 'Mohammed Rahman', sex: 'M', dob: '', phone: '', village: 'Dhaka', father: '' } },
    { name: 'S. Begum', mrn: 'QH-PT-100088', reason: 'Antenatal visit', wait: '25 min', q: { name: 'Shirin Begum', sex: 'F', dob: '', phone: '', village: 'Gazipur', father: '' } },
    { name: 'K. Das', mrn: 'QH-PT-100342', reason: 'Fever, 3 days', wait: '40 min', q: { name: 'Kanai Das', sex: 'M', dob: '', phone: '', village: 'Dhaka', father: '' } }
  ];

  // Visit start form state. Lives in memory; the visit itself lives on the exchange.
  var vq = null;
  function newVq(i) {
    var e = QUEUE[i] || { reason: '', q: { name: '', sex: '', dob: '', phone: '', village: '', father: '' } };
    return { qi: i, mode: 'in-person', reason: e.reason, q: Object.assign({}, e.q), res: null, sel: null, confirmed: null, otp: null, makerOptIn: false, msg: '' };
  }

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function fld(id, label, val, ph) { return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label><input id="' + id + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '"></div>'; }
  function sel(id, label, opts, val) { return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>'; }
  function step(n, t) { return '<div class="step"><span class="n">' + n + '</span>' + esc(t) + '</div>'; }
  function ctitle(t) { return '<div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">' + esc(t) + '</div>'; }
  function ago(ts) { var m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 1 ? 'just now' : m + ' min ago'; }

  function pidFor(recId) {
    var cl = X.registry.clusterOf(recId), pid = null;
    cl.records.forEach(function (id) { var r = X.registry.record(id); if (!pid && r && r.patientId) pid = r.patientId; });
    return pid || cl.id;
  }
  function active() { return C.activeVisit(cur.id); }
  function lastVisit() { var v = C.visits().filter(function (x) { return x.clinicId === cur.id; }); return v.length ? v[v.length - 1] : null; }
  function focusVisit() { return active() || lastVisit(); }

  var MODS = [
    { key: 'queue', label: 'Patient queue', ic: 'PQ', group: 'Clinic' },
    { key: 'visit', label: 'Visit', ic: 'VS', group: 'Clinic' },
    { key: 'record', label: 'Patient record', ic: 'PR', group: 'Clinic' },
    { key: 'prescribe', label: 'Prescribe', ic: 'RX', group: 'Clinic' },
    { key: 'orders', label: 'Orders', ic: 'OR', group: 'Clinic' },
    { key: 'results', label: 'Results', ic: 'RS', group: 'Clinic' },
    { key: 'referrals', label: 'Referrals', ic: 'RF', group: 'Coordination' },
    { key: 'payments', label: 'Payments', ic: 'PY', group: 'Coordination' },
    { key: 'tasks', label: 'Tasks', ic: 'TK', group: 'Coordination' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  /* ---------- what needs the clinician ---------- */
  function needs() {
    var out = [], v = active();
    var vids = C.visits().filter(function (x) { return x.clinicId === cur.id; }).map(function (x) { return x.visitId; });
    C.labOrders().filter(function (o) { return vids.indexOf(o.visitId) >= 0 && o.result && o.result.flag; }).forEach(function (o) { out.push({ sev: 'crit', t: 'Abnormal ' + o.testName + ' for ' + o.patientName, s: o.result.value + ' ' + o.result.unit, go: 'results', cta: 'Review' }); });
    C.referrals().filter(function (r) { return vids.indexOf(r.visitId) >= 0; }).forEach(function (r) {
      if (r.status === 'declined') out.push({ sev: 'crit', t: r.toOrgName + ' declined ' + r.patientName, s: r.response.reason, go: 'referrals', cta: 'Re-refer' });
      if (r.status === 'accepted') out.push({ sev: 'idle', t: r.toOrgName + ' accepted ' + r.patientName, s: r.notice ? r.notice.unit + ', expected ' + r.notice.expectedBy.toLowerCase() : '', go: 'referrals', cta: 'Open' });
    });
    if (v) out.unshift({ sev: 'warn', t: 'Visit open: ' + v.patientName, s: v.mode + ', started ' + ago(v.startedAt), go: 'visit', cta: 'Continue' });
    return out;
  }
  function inbox() {
    var n = needs();
    return '<div class="card shadow" style="margin-bottom:16px">' + ctitle('Needs you') +
      (n.length ? n.map(function (x) { return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + x.sev + '"></span><div style="flex:1"><div style="font-size:13px;font-weight:600">' + esc(x.t) + '</div><div class="sub2">' + esc(x.s) + '</div></div><button class="btn btn-ghost btn-sm" data-mod="' + x.go + '">' + esc(x.cta) + '</button></div>'; }).join('') : '<div class="sub">Nothing is waiting on you. Start a visit from the queue.</div>') + '</div>';
  }

  /* ---------- visit: identity step then the visit ---------- */
  function candList() {
    var r = vq.res; if (!r) return '';
    if (!r.candidates.length) return '<div class="sub" style="margin-top:10px">' + esc(r.note) + '</div>';
    return '<div style="margin-top:12px"><div class="sub2" style="margin-bottom:8px">' + esc(r.note) + '</div>' + r.candidates.slice(0, 4).map(function (c) {
      var o = c.rec, chip = c.band === 'auto' ? 'verified' : c.band === 'review' ? 'claimed' : 'unmeasured';
      return '<div class="cand' + (vq.sel === o.id ? ' sel' : '') + '"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div style="font-size:13px;font-weight:600">' + esc(o.name) + ' <span class="mono sub2">' + esc(o.id) + '</span></div>' +
        '<div class="sub2">' + esc([o.sex, o.dob || 'date of birth unknown', o.father ? 'father ' + o.father : '', o.village].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div style="text-align:right"><span class="chip ' + chip + '">' + esc(c.band === 'auto' ? 'likely' : c.band === 'review' ? 'possible' : 'unlikely') + ' ' + Math.round(c.p * 100) + '%</span><div style="margin-top:6px"><button class="btn ' + (vq.sel === o.id ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-pick="' + esc(o.id) + '">' + (vq.sel === o.id ? 'Selected' : 'This is the patient') + '</button></div></div></div></div>';
    }).join('') + '</div>';
  }
  function methodBox() {
    if (vq.confirmed) {
      return '<div class="cand sel"><span class="chip verified">identity confirmed</span> <span style="font-size:13px">' + esc(vq.confirmed.label) + '</span> <button class="btn btn-ghost btn-sm" data-unconfirm style="margin-left:8px">Change</button></div>';
    }
    var inp = vq.mode === 'in-person';
    var out = '<div class="sub2" style="margin-bottom:8px">' + (inp ? 'Check the person in front of you, or have them confirm with a code on their phone.' : 'This is a virtual visit, so nobody can check an ID card. The patient confirms with a code on their phone, or a community health worker vouches.') + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      (inp ? '<button class="btn btn-ghost btn-sm" data-method="in-person ID check"' + (vq.sel ? '' : ' disabled') + '>ID checked in person</button>' : '') +
      '<button class="btn btn-ghost btn-sm" data-method="patient code"' + (vq.sel ? '' : ' disabled') + '>Send a code to the patient</button>' +
      '<button class="btn btn-ghost btn-sm" data-method="community health worker"' + (vq.sel ? '' : ' disabled') + '>Community health worker vouches</button>' +
      (inp ? '<button class="btn btn-ghost btn-sm" data-method="new registration">Register as a new person</button>' : '') + '</div>';
    if (vq.otp) {
      out += '<div class="sms">SIMULATED SMS to ' + esc(vq.otp.to) + ': Qäre code ' + esc(vq.otp.simulatedCode) + '. Do not share it.</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap"><div style="width:180px">' + fld('vf-otp', 'Code the patient reads out', '', '6 digits') + '</div><button class="btn btn-primary" data-otpverify>Confirm identity</button></div>';
    }
    return out;
  }
  function startPanel() {
    var qrow = '<div class="grid3">' + fld('vf-name', 'Name', vq.q.name) + sel('vf-sex', 'Sex', [['', 'Not stated'], ['F', 'Female'], ['M', 'Male']], vq.q.sex) + fld('vf-dob', 'Date of birth or year', vq.q.dob, '1988 or 1988-04-02') +
      fld('vf-father', 'Father\'s name', vq.q.father) + fld('vf-phone', 'Phone', vq.q.phone) + fld('vf-village', 'Village or area', vq.q.village) + '</div>';
    var queueBtns = QUEUE.map(function (q, i) { return '<button class="btn ' + (vq.qi === i ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-startq="' + i + '">' + esc(q.name) + '</button>'; }).join(' ') + ' <button class="btn ' + (vq.qi === -1 ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-startq="-1">Walk-in</button>';
    return head('Start a visit', 'Know who the patient is before anything is ordered or prescribed. The match uses the registry in Core, and the patient or a trusted person confirms it.') +
      '<div class="card shadow" style="margin-bottom:14px">' + step(1, 'Who is the patient?') + '<div style="margin-bottom:12px">' + queueBtns + '</div>' + qrow +
      '<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-primary" data-find>Find in the registry</button><span class="sub2" style="align-self:center">A common name needs more than the name. Add the father\'s name or birth year.</span></div>' + candList() + '</div>' +
      '<div class="card shadow" style="margin-bottom:14px">' + step(2, 'Confirm identity') + methodBox() + '</div>' +
      '<div class="card shadow" style="margin-bottom:14px">' + step(3, 'The visit') + '<div class="grid2">' + sel('vf-mode', 'How', [['in-person', 'In person'], ['virtual', 'Virtual (video or phone)']], vq.mode) + fld('vf-reason', 'Reason for the visit', vq.reason) + '</div>' +
      '<label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px"><input type="checkbox" id="vf-maker"' + (vq.makerOptIn ? ' checked' : '') + ' style="margin-top:3px"> <span>The patient agrees to share their medicine, condition and age band (never their name) with the medicine maker, to keep supply and safety working. They can withdraw this in Nova.</span></label>' +
      '<div style="margin-top:14px"><button class="btn btn-primary" data-begin' + (vq.confirmed ? '' : ' disabled') + '>Start visit</button></div>' + (vq.msg ? '<div class="sub" style="margin-top:10px;color:var(--inconsistent)">' + esc(vq.msg) + '</div>' : '') + '</div>' +
      prov('a visit is a VISIT_STARTED event with the identity method recorded; a treatment access decision is written to the audit trail');
  }
  function visitPanel(v) {
    var orders = C.labOrders({ visitId: v.visitId }), rxs = X.prescriptions().filter(function (r) { return r.visitId === v.visitId; }), refs = C.referrals({ visitId: v.visitId });
    var tl = [];
    tl.push([v.startedAt, 'Visit started, ' + v.mode + '. Identity: ' + v.identity.label]);
    orders.forEach(function (o) { tl.push([o.ts, o.testName + ' ordered at ' + o.labName + (o.result ? '. Resulted ' + o.result.value + ' ' + o.result.unit + (o.result.flag ? ', out of range' : '') : '')]); });
    rxs.forEach(function (r) { tl.push([r.rxId && X.eventsOfType('RX_WRITTEN').filter(function (e) { return e.payload.rxId === r.rxId; })[0].ts, r.drugName + ' x' + r.qty + ' to ' + r.pharmacyName + (X.isDispensed(r.rxId) ? ', dispensed' : ', waiting')]); });
    refs.forEach(function (r) { tl.push([r.ts, 'Referred to ' + r.toOrgName + ': ' + r.status]); });
    tl.sort(function (a, b) { return a[0] - b[0]; });
    var virt = v.mode === 'virtual' ? '<div class="card shadow" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center"><span class="chip claimed">simulated call</span><span style="font-size:13px">Video or phone consult in progress with ' + esc(v.patientName) + '. No call is made in this demonstration.</span></div></div>' : '';
    return head('Visit: ' + v.patientName, v.mode === 'virtual' ? 'A virtual visit. Orders and prescriptions go to the same lab and the patient\'s own pharmacy as an in-person visit.' : 'In person. Orders and prescriptions go to the lab and to the patient\'s own pharmacy.') + virt +
      '<div class="split"><div class="card shadow">' + ctitle('This visit') +
      '<div class="rec"><span class="k">Patient</span><span>' + esc(v.patientName) + ' <span class="mono sub2">' + esc(v.patientId) + '</span></span></div>' +
      '<div class="rec"><span class="k">Identity</span><span>' + esc(v.identity.label) + '</span></div>' +
      '<div class="rec"><span class="k">Reason</span><span>' + esc(v.reason || 'not stated') + '</span></div>' +
      '<div class="rec"><span class="k">Pharmacy</span><span>' + esc(C.nominatedPharmacy(v.patientId).name) + ' <span class="sub2">(' + (C.nominatedPharmacy(v.patientId).source === 'patient' ? 'chosen by the patient' : 'default, ask the patient') + ')</span></span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-primary btn-sm" data-mod="orders">Order a test</button><button class="btn btn-primary btn-sm" data-mod="prescribe">Prescribe</button><button class="btn btn-ghost btn-sm" data-mod="referrals">Refer</button><button class="btn btn-ghost btn-sm" data-mod="payments">Payments</button>' +
      (v.status === 'open' ? '<button class="btn btn-ghost btn-sm" data-close="' + esc(v.visitId) + '">Close visit</button>' : '<span class="chip unmeasured">closed</span>') + '</div></div>' +
      '<div class="card shadow">' + ctitle('Timeline') + '<div class="tl">' + tl.map(function (t) { return '<div class="it"><span class="sub2 mono">' + ago(t[0]) + '</span> ' + esc(t[1]) + '</div>'; }).join('') + '</div></div></div>' +
      prov('everything in this visit is an event; the lab, the pharmacy, the hospital and the patient each see only what their role allows');
  }
  function needVisit(what) {
    return head(what, 'Start a visit first, so the order, prescription or referral is tied to a confirmed patient.') +
      '<div class="card shadow"><div class="sub" style="margin-bottom:12px">No visit is open at ' + esc(cur.name) + '.</div><button class="btn btn-primary" data-mod="visit">Start a visit</button></div>';
  }

  function recordBody() {
    var v = focusVisit();
    if (!v) return head('Patient record', 'Open a visit to see the record for that patient.') + '<div class="card shadow"><button class="btn btn-primary" data-mod="visit">Start a visit</button></div>';
    var pid = v.patientId, rec = v.recordId ? X.registry.record(v.recordId) : null, isA = pid === 'PT-AMARA', pt = X.PATIENT;
    var sent = X.prescriptions().filter(function (r) { return r.patientId === pid; });
    var results = X.labResults().filter(function (r) { return r.patientId === pid; });
    return head('Patient record', 'One record, assembled from every app that has touched this patient. Consent to it is held by the patient in Nova.') +
      '<div class="split"><div class="card shadow">' +
      '<div style="font-family:var(--font-brand);font-weight:700;font-size:16px;margin-bottom:10px">' + esc(v.patientName) + '</div>' +
      '<div class="rec"><span class="k">Identifiers</span><span>' + (isA ? pt.age + ', ' + esc(pt.sex) + ' &middot; <span class="mono">' + esc(pt.mrn) + '</span>' : rec ? esc([rec.sex, rec.dob].filter(Boolean).join(', ')) + ' &middot; <span class="mono">' + esc(rec.mrn) + '</span>' : 'new registration') + '</span></div>' +
      '<div class="rec"><span class="k">Conditions</span><span>' + (isA ? esc(pt.conditions.join(', ')) : 'none recorded on the exchange') + '</span></div>' +
      '<div class="rec"><span class="k">Allergies</span><span style="color:var(--inconsistent)">' + (isA ? esc(pt.allergies.join(', ')) : 'none recorded') + '</span></div>' +
      '<div class="rec"><span class="k">Medicines</span><span>' + (sent.length ? esc(sent.map(function (r) { return r.drugName; }).join(', ')) : 'none recorded') + '</span></div>' +
      '<div class="rec"><span class="k">Recent results</span><span>' + (results.length ? esc(results.map(function (r) { return r.testName + ' ' + r.value + r.unit; }).join(', ')) : 'none yet') + '</span></div>' +
      '</div><div class="card shadow"><div class="iris"><div class="h">IRIS</div>' + (isA ? 'Blood pressure trend is up over three visits and her HbA1c, if ordered, will confirm control. CardiNex-10 suits the hypertension and has no interaction with her metformin. She is penicillin allergic, not relevant here. A licensed clinician decides.' : 'There is no history on the exchange for this patient yet, so I have nothing to compare against. Ask about current medicines and allergies and record them. A licensed clinician decides.') + '</div></div></div>' +
      prov('reads from the exchange; the record is assembled, not re-entered');
  }

  function prescribeBody() {
    var v = active(); if (!v) return needVisit('Prescribe');
    var np = C.nominatedPharmacy(v.patientId), sent = X.prescriptions().filter(function (r) { return r.visitId === v.visitId; });
    return head('Prescribe', 'The prescription goes to ' + np.name + ', the pharmacy ' + (np.source === 'patient' ? 'the patient chose' : 'on file. Ask the patient if this is still where they want it') + '. The maker sees supply, not the patient.') +
      '<div class="split"><div class="card shadow rx">' +
      '<label for="drug">Medicine</label><select id="drug">' + X.FORMULARY.map(function (d) { return '<option value="' + d.code + '">' + esc(d.name) + ' &middot; ' + esc(d.form) + '</option>'; }).join('') + '</select>' +
      '<label for="qty">Quantity (packs)</label><input id="qty" type="number" value="1" min="1" max="12">' +
      '<label for="sig">Directions</label><input id="sig" value="One tablet daily">' +
      '<label for="pharm">Pharmacy</label><select id="pharm">' + X.orgsFor('cura').map(function (o) { return '<option value="' + o.id + '"' + (o.id === np.orgId ? ' selected' : '') + '>' + esc(o.name) + ' &middot; ' + esc(o.region) + '</option>'; }).join('') + '</select>' +
      '<div class="sub2" style="margin-top:6px">Change this only if the patient asks. The new choice is saved as theirs.</div>' +
      '<button class="btn btn-primary" id="writeRx" style="margin-top:14px;width:100%">Sign and send prescription</button></div>' +
      '<div class="card shadow">' + ctitle('Written this visit') +
      (sent.length ? sent.slice().reverse().map(function (r) { return '<div class="rec"><span>' + esc(r.drugName) + ' x' + r.qty + '<div class="sub2">' + esc(r.pharmacyName) + '</div></span>' + (X.isDispensed(r.rxId) ? '<span class="chip verified">dispensed</span>' : '<span class="chip claimed">at pharmacy</span>') + '</div>'; }).join('') : '<div class="sub">Nothing yet.</div>') + '</div></div>' +
      prov('writes an RX_WRITTEN event addressed to one pharmacy; a licensed clinician signs every prescription');
  }

  function ordersBody() {
    var v = active(); if (!v) return needVisit('Orders');
    var list = C.labOrders({ visitId: v.visitId });
    return head('Orders', 'Order a lab test. It goes to the lab you pick in Prism, and the result returns to this visit.') +
      '<div class="split"><div class="card shadow rx">' +
      '<label for="otest">Test</label><select id="otest">' + X.LAB_TESTS.map(function (t) { return '<option value="' + t.code + '">' + esc(t.name) + '</option>'; }).join('') + '</select>' +
      '<label for="ourg">Urgency</label><select id="ourg"><option>Routine</option><option>Urgent</option><option>STAT</option></select>' +
      '<label for="olab">Lab</label><select id="olab">' + X.orgsFor('prism').map(function (o) { return '<option value="' + o.id + '"' + (o.id === 'ORG-LAB' ? ' selected' : '') + '>' + esc(o.name) + '</option>'; }).join('') + '</select>' +
      '<button class="btn btn-primary" id="orderLab" style="margin-top:14px;width:100%">Send order to the lab</button></div>' +
      '<div class="card shadow">' + ctitle('This visit') + (list.length ? list.slice().reverse().map(function (o) {
        return '<div class="rec"><span>' + esc(o.testName) + '<div class="sub2">' + esc(o.labName) + ' &middot; ' + esc(o.urgency) + '</div></span>' + (o.result ? '<span class="chip ' + (o.result.flag ? 'inconsistent' : 'verified') + '">' + esc(o.result.value + ' ' + o.result.unit) + '</span>' : '<span class="chip claimed">awaiting lab</span>') + '</div>'; }).join('') : '<div class="sub">No orders yet.</div>') + '</div></div>' +
      prov('an order is a LAB_ORDERED event for one lab; releasing the result there writes it back to this visit');
  }

  function resultsBody() {
    var v = focusVisit(), pid = v ? v.patientId : null;
    var list = C.labOrders(pid ? { patientId: pid } : null).filter(function (o) { return o.result; });
    return head('Results', 'Results released by the lab in Prism, on the record the moment they are validated.') +
      (list.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Test</th><th>Patient</th><th class="num">Value</th><th>Reference</th><th>Flag</th></tr></thead><tbody>' +
        list.slice().reverse().map(function (o) { var r = o.result, tt = X.labTest(r.test); return '<tr><td class="nm">' + esc(r.testName) + '<div class="sub2">' + esc(o.labName) + '</div></td><td>' + esc(o.patientName) + '</td><td class="num">' + esc(r.value) + ' ' + esc(r.unit) + '</td><td class="sub2">' + esc(tt ? tt.ref : '') + '</td><td>' + (r.flag ? '<span class="chip inconsistent">out of range</span>' : '<span class="chip verified">normal</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="sub2" style="margin-top:8px">Analyzer values are simulated in this demonstration.</p>' : '<div class="card"><div class="sub">No results yet. Open Prism in another tab, find the order and release a result; it lands here live.</div></div>') +
      prov('reads LAB_RESULT events tied to an order; a flagged result is surfaced, not buried in a report');
  }

  function referralsBody() {
    var v = active(), mine = C.referrals().filter(function (r) { return r.fromOrgId === cur.id; });
    var form = v ? '<div class="card shadow rx" style="margin-bottom:14px">' + ctitle('Refer ' + v.patientName) +
      '<label for="rto">Hospital</label><select id="rto">' + C.RECEIVING.map(function (id) { return '<option value="' + id + '">' + esc(X.org(id).name) + ' &middot; ' + esc(X.org(id).region) + '</option>'; }).join('') + '</select>' +
      '<label for="rurg">Urgency</label><select id="rurg"><option>Routine</option><option>Urgent</option><option>STAT</option></select>' +
      '<label for="rwhy">Reason</label><input id="rwhy" value="Uncontrolled blood pressure with raised HbA1c; admission for stabilisation">' +
      '<div class="sub2" style="margin-top:8px">The hospital receives the reason, current medicines and results, and nothing else. They can accept or decline, and a decline comes back with a reason.</div>' +
      '<button class="btn btn-primary" id="sendRef" style="margin-top:12px">Send referral</button></div>' : '<div class="card shadow" style="margin-bottom:14px"><div class="sub" style="margin-bottom:10px">Open a visit to refer a patient.</div><button class="btn btn-primary" data-mod="visit">Start a visit</button></div>';
    var chip = { sent: '<span class="chip claimed">sent, awaiting reply</span>', accepted: '<span class="chip verified">accepted</span>', declined: '<span class="chip inconsistent">declined</span>', admitted: '<span class="chip verified">admitted</span>' };
    return head('Referrals', 'Refer to a hospital. The receiving facility in Apex sees it live and accepts or declines.') + form +
      (mine.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>To</th><th>Reason</th><th>Status</th></tr></thead><tbody>' + mine.slice().reverse().map(function (r) {
        var det = r.status === 'declined' ? '<div class="sub2">' + esc(r.response.reason) + (r.response.alternativeName ? ' Suggested: ' + esc(r.response.alternativeName) : '') + '</div>' : r.notice ? '<div class="sub2">' + esc(r.notice.unit) + ', expected ' + esc(r.notice.expectedBy.toLowerCase()) + '</div>' : '';
        return '<tr><td class="nm">' + esc(r.patientName) + '</td><td>' + esc(r.toOrgName) + '</td><td>' + esc(r.reason) + '</td><td>' + chip[r.status] + det + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
      prov('CLINIC_REFERRAL, then REFERRAL_RESPONSE and HOSPITAL_NOTICE from Apex; the loop closes on the same record');
  }

  function paymentsBody() {
    var v = focusVisit(); if (!v) return needVisit('Payments');
    var p = C.payments(v.visitId), cc = p.currency;
    return head('Payments', 'What this visit costs and who pays. Shown to explain the flow. No money moves in this demonstration.') +
      UI.illustrative('Tariffs and co-payment shares are placeholders in ' + cc + '. Real tariffs come from the payer and the ministry schedule.') +
      '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th>Paid to</th><th class="num">Amount</th><th class="num">Patient pays</th><th class="num">Payer covers</th></tr></thead><tbody>' +
      p.lines.map(function (l) { return '<tr><td class="nm">' + esc(l.item) + '</td><td>' + esc(l.payee) + '</td><td class="num">' + l.amount + '</td><td class="num">' + l.patient + '</td><td class="num">' + l.payer + '</td></tr>'; }).join('') +
      '<tr><td class="nm">Total (' + esc(cc) + ')</td><td></td><td class="num"><strong>' + p.total.amount + '</strong></td><td class="num"><strong>' + p.total.patient + '</strong></td><td class="num"><strong>' + p.total.payer + '</strong></td></tr></tbody></table></div>' +
      '<div class="card shadow" style="margin-top:14px">' + ctitle('How the money would move') +
      '<div class="rec"><span class="k">Patient</span><span>Pays the co-payment at each point of care, or by mobile money</span></div>' +
      '<div class="rec"><span class="k">Payer (Shield)</span><span>Adjudicates the claim against the visit, the lab order and the dispense</span></div>' +
      '<div class="rec"><span class="k">Clinic, lab, pharmacy</span><span>Each is paid for what its own event shows it did</span></div></div>' +
      prov('each line is derived from an event on this visit, so a payment cannot drift from what was done');
  }

  function moduleBody() {
    var sentAll = X.prescriptions().filter(function (r) { return r.by === 'pulse'; });
    var resultsAll = X.labResults();
    if (mod === 'queue') {
      var v = active();
      return head('Patient queue', QUEUE.length + ' patients waiting. Start a visit, confirm who they are, decide, and the decision is on the exchange before they leave.') + inbox() +
        kpis([[QUEUE.length, 'in queue'], [sentAll.length, 'prescribed'], [resultsAll.filter(function (r) { return r.flag; }).length, 'abnormal results back'], [C.visits().filter(function (x) { return x.clinicId === cur.id; }).length, 'visits']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>Reason</th><th>Waiting</th><th></th></tr></thead><tbody>' +
        QUEUE.map(function (q, i) { return '<tr><td><div class="nm">' + esc(q.name) + '</div><div class="sub2 mono">' + esc(q.mrn) + '</div></td><td>' + esc(q.reason) + '</td><td class="mono">' + esc(q.wait) + '</td><td style="text-align:right"><button class="btn ' + (q.focus ? 'btn-primary' : 'btn-ghost') + ' btn-sm" data-startq="' + i + '"' + (v ? ' disabled' : '') + '>Start visit</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('the queue reads appointment and referral events; a visit starts only after the patient is identified');
    }
    if (mod === 'visit') { var av = active(); if (av) return visitPanel(av); if (!vq) vq = newVq(0); return startPanel(); }
    if (mod === 'record') return recordBody();
    if (mod === 'prescribe') return prescribeBody();
    if (mod === 'orders') return ordersBody();
    if (mod === 'results') return resultsBody();
    if (mod === 'referrals') return referralsBody();
    if (mod === 'payments') return paymentsBody();
    if (mod === 'tasks') {
      var ab = needs().filter(function (n) { return n.sev === 'crit'; });
      return head('Tasks', 'Follow-ups and results that need the clinician to act.') +
        '<div class="card shadow">' + (ab.length ? ab.map(function (n) { return taskRow('crit', n.t, n.s); }).join('') : taskRow('idle', 'No abnormal results or declined referrals', 'none pending')) +
        taskRow('idle', 'Antenatal recall, S. Begum', 'due next week') + '</div>' +
        prov('tasks are generated from events on the record, not a separate to-do list');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The clinic\'s contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Visits completed on the exchange', value: String(C.visits().filter(function (x) { return x.clinicId === cur.id && x.status === 'closed'; }).length), status: 'Claimed' },
          { front: 'Care quality and safety', measure: 'Guideline-concordant scripts', value: '96%', status: 'Claimed' },
          { front: 'Health outcomes', measure: 'BP controlled at 6 months', value: '71%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function taskRow(sev, t, s) { return '<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hairline)"><span class="sev ' + sev + '"></span><div style="flex:1"><span style="font-size:13px;font-weight:600">' + esc(t) + '</span></div><span class="sub2">' + esc(s) + '</span></div>'; }

  var pending = false;
  function render() {
    var ae = document.activeElement;
    if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && document.getElementById('root').contains(ae)) { pending = true; return; }
    pending = false;
    var who = cur.personas[0];
    var abn = needs().filter(function (n) { return n.sev === 'crit'; }).length;
    var mods = MODS.map(function (m) { return m.key === 'results' ? Object.assign({}, m, { badge: abn || null }) : m.key === 'visit' && active() ? Object.assign({}, m, { badge: 1, calm: true }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Pulse', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }
  document.addEventListener('focusout', function () { setTimeout(function () { if (pending) render(); }, 0); });

  function readForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
    if (!vq) return;
    ['name', 'sex', 'dob', 'father', 'phone', 'village'].forEach(function (k) { var v = g('vf-' + k); if (v !== null) vq.q[k] = v.trim(); });
    var m = g('vf-mode'); if (m) vq.mode = m;
    var r = g('vf-reason'); if (r !== null) vq.reason = r;
    var mk = document.getElementById('vf-maker'); if (mk) vq.makerOptIn = mk.checked;
  }
  document.addEventListener('change', function (e) { if (e.target.id && e.target.id.indexOf('vf-') === 0) { readForm(); if (e.target.id === 'vf-mode') { vq.confirmed = null; vq.otp = null; render(); } } });

  function who() { return cur.personas[0].name; }
  function sendRx(code, qty, sig, pharmId) {
    var v = active(); if (!v) return;
    var np = C.nominatedPharmacy(v.patientId);
    if (pharmId && pharmId !== np.orgId) C.nominate(v.patientId, pharmId, 'patient, asked at visit', true);
    var ev = C.prescribe({ visitId: v.visitId, drug: code, qty: qty, sig: sig, pharmacyId: pharmId });
    UI.toast('Sent', ev.payload.drugName + ' x' + qty + ' to ' + ev.payload.pharmacyName + '.');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); vq = null; render(); return; }
    var m = e.target.closest('[data-mod]'); if (m && !m.disabled) { mod = m.getAttribute('data-mod'); render(); return; }
    var a = e.target;

    // identity step
    var sq = a.getAttribute('data-startq'); if (sq !== null) { vq = newVq(parseInt(sq, 10)); if (parseInt(sq, 10) === -1) vq.reason = ''; mod = 'visit'; render(); return; }
    if (a.hasAttribute('data-find')) { readForm(); vq.res = X.registry.match(vq.q); vq.sel = null; vq.confirmed = null; vq.otp = null; vq.msg = ''; if (vq.res.decision === 'auto' || vq.res.decision === 'review') vq.sel = vq.res.candidates[0].rec.id; render(); return; }
    var pk = a.getAttribute('data-pick'); if (pk) { readForm(); vq.sel = pk; vq.confirmed = null; vq.otp = null; render(); return; }
    if (a.hasAttribute('data-unconfirm')) { vq.confirmed = null; vq.otp = null; render(); return; }
    var mt = a.getAttribute('data-method');
    if (mt) {
      readForm();
      var cand = vq.res && vq.res.candidates.filter(function (c) { return c.rec.id === vq.sel; })[0];
      if (mt === 'new registration') { vq.sel = null; vq.confirmed = { method: mt, label: 'New registration, checked in person (no match in the registry)', recordId: null, band: 'new', p: 0 }; render(); return; }
      if (!cand) return;
      if (mt === 'patient code') { vq.otp = X.registry.challenge(cand.rec.id); if (vq.otp && vq.otp.channel === 'chw') { vq.msg = vq.otp.note; vq.otp = null; } render(); return; }
      var lbl = mt === 'in-person ID check' ? 'Checked in person against ' + cand.rec.name + ' (' + cand.rec.id + ')' : 'Community health worker vouched for ' + cand.rec.name + ' (' + cand.rec.id + ')';
      vq.confirmed = { method: mt, label: lbl, recordId: cand.rec.id, band: cand.band, p: cand.p }; render(); return;
    }
    if (a.hasAttribute('data-otpverify')) {
      var code = (document.getElementById('vf-otp') || {}).value, c2 = vq.res.candidates.filter(function (c) { return c.rec.id === vq.sel; })[0];
      if (c2 && X.registry.verifyCode(c2.rec.id, code)) { vq.confirmed = { method: 'patient code', label: 'Patient confirmed with a one-time code to the phone on file (' + c2.rec.id + ')', recordId: c2.rec.id, band: c2.band, p: c2.p }; vq.otp = null; vq.msg = ''; }
      else vq.msg = 'That code does not match. Ask the patient to read it again.';
      render(); return;
    }
    if (a.hasAttribute('data-begin')) {
      readForm();
      var cf = vq.confirmed; if (!cf) return;
      var rec = cf.recordId ? X.registry.record(cf.recordId) : null;
      var pid = rec ? pidFor(rec.id) : 'PT-NEW-' + X.hash53(vq.q.name + vq.q.dob).slice(-6).toUpperCase();
      var r = C.startVisit({ clinicId: cur.id, mode: vq.mode, patientId: pid, patientName: rec ? rec.name : vq.q.name, recordId: cf.recordId, reason: vq.reason, identity: { method: cf.method, label: cf.label, band: cf.band, p: Math.round(cf.p * 1000) / 1000 }, clinician: who(), personaId: cur.personas[0].id, makerOptIn: vq.makerOptIn });
      if (!r.ok) { vq.msg = r.reason; render(); return; }
      vq = null; UI.toast('Visit started', 'Identity confirmed. Treatment access is logged.'); render(); return;
    }
    var cl = a.getAttribute('data-close'); if (cl) { C.closeVisit(cl, ''); vq = null; mod = 'queue'; UI.toast('Visit closed', 'The visit is on the record.'); return; }

    // orders, prescriptions, referrals
    if (a.id === 'orderLab') {
      var v = active(); if (!v) return;
      var o = C.orderLab({ visitId: v.visitId, test: document.getElementById('otest').value, urgency: document.getElementById('ourg').value, labOrgId: document.getElementById('olab').value });
      UI.toast('Ordered', o.payload.testName + ' sent to ' + o.payload.labName + '.'); return;
    }
    if (a.id === 'writeRx') {
      sendRx(document.getElementById('drug').value, Math.max(1, parseInt(document.getElementById('qty').value, 10) || 1), document.getElementById('sig').value, document.getElementById('pharm').value); return;
    }
    if (a.id === 'sendRef') {
      var vv = active(); if (!vv) return;
      var rr = C.refer({ visitId: vv.visitId, toOrgId: document.getElementById('rto').value, urgency: document.getElementById('rurg').value, reason: document.getElementById('rwhy').value });
      if (!rr.ok) { UI.toast('Not sent', rr.reason); return; }
      UI.toast('Referral sent', 'The hospital sees it now and can accept or decline.'); return;
    }
    if (a.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Primary care access, Q current', status: 'Claimed' }, { app: 'pulse', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    var p = ev.payload;
    if (ev.type === 'LAB_RESULT') return { k: 'Prism', msg: esc(p.testName) + ' resulted for ' + esc(p.patientName) + ': ' + esc(p.value) + ' ' + esc(p.unit) + '.' };
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: esc(p.drugName) + ' was dispensed.' };
    if (ev.type === 'REFERRAL_RESPONSE') return { k: 'Apex', msg: 'Referral ' + esc(p.decision) + (p.reason ? ': ' + esc(p.reason) : '') + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
