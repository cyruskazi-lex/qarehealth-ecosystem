<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 28px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .rx-form label { display: block; font-size: 12px; color: var(--mid); margin: 12px 0 4px; font-weight: 600; }
  .rx-form select, .rx-form input { width: 100%; font-family: var(--font-ui); font-size: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .rx-form select:focus, .rx-form input:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--iris-bright); }
  .rec-line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .rec-line .k { color: var(--mid); }
  .iris-note { background: var(--iris-tint); border: 1px solid var(--iris-line); border-radius: 12px; padding: 14px; margin-top: 16px; font-size: 13px; }
  .iris-note .h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-deep); margin-bottom: 6px; }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('pulse');
  var orgs = X.orgsFor('pulse'), cur = X.org('ORG-CLINIC'), who = cur.personas[0], pt = X.PATIENT;

  function render() {
    who = cur.personas[0];
    var sent = X.prescriptions().filter(function (r) { return r.by === 'pulse'; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Pulse', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Clinician workspace</div>' +
        '<div class="greet">One patient in the room. One decision to make.</div>' +
        '<div class="sub">' + UI.esc(cur.name) + ' · ' + UI.esc(cur.region) + ' · consent to this record is held in Nova</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow">' +
            '<h2 class="sec">Prescribe for ' + UI.esc(pt.name) + '</h2>' +
            '<div class="rec-line"><span class="k">Patient</span><span>' + UI.esc(pt.name) + ', ' + pt.age + ' · ' + UI.esc(pt.sex) + ' · <span class="mono">' + UI.esc(pt.mrn) + '</span></span></div>' +
            '<div class="rec-line"><span class="k">Conditions</span><span>' + UI.esc(pt.conditions.join(', ')) + '</span></div>' +
            '<div class="rec-line"><span class="k">Allergies</span><span style="color:var(--inconsistent)">' + UI.esc(pt.allergies.join(', ')) + '</span></div>' +
            '<div class="iris-note"><div class="h">IRIS</div>CardiNex-10 fits the hypertension picture and has no interaction with her current metformin. She is penicillin allergic, which does not apply here. A licensed clinician makes the call; this is advice from her record.</div>' +
            '<form class="rx-form" id="rxform">' +
              '<label for="drug">Medicine</label>' +
              '<select id="drug">' + X.FORMULARY.map(function (d) { return '<option value="' + d.code + '">' + UI.esc(d.name) + ' · ' + UI.esc(d.form) + '</option>'; }).join('') + '</select>' +
              '<label for="qty">Quantity (packs)</label>' +
              '<input id="qty" type="number" value="1" min="1" max="12" />' +
              '<button class="btn btn-primary" type="submit" style="margin-top:16px;width:100%">Write prescription to the exchange</button>' +
            '</form>' +
            '<p class="provenance">writes an RX event to the Qäre HIE; Cura, Nexus and Nova read it live</p>' +
          '</section>' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Written this session</h2>' +
              (sent.length ? sent.slice().reverse().map(function (r) {
                return '<div class="rec-line"><span>' + UI.esc(r.drugName) + ' x' + r.qty + '</span><span>' + (X.isDispensed(r.rxId) ? UI.statusChip('Verified').replace('Verified','Dispensed') : '<span class="chip claimed">awaiting pharmacy</span>') + '</span></div>';
              }).join('') : '<p class="sub" style="margin-top:6px">Nothing yet. Write one and watch it land in the other apps.</p>') +
            '</div>' +
            '<div style="margin-top:20px">' + UI.impactPanel(cur, { measures: [
              { front: 'Access and coverage', measure: 'Consults completed, quarter', value: '1,284', status: 'Verified' },
              { front: 'Care quality and safety', measure: 'Guideline-concordant scripts', value: '96%', status: 'Claimed' }
            ] }) + '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'rxform') return;
    e.preventDefault();
    var code = document.getElementById('drug').value;
    var qty = Math.max(1, parseInt(document.getElementById('qty').value, 10) || 1);
    var d = X.drug(code);
    X.append('RX_WRITTEN', {
      rxId: 'RX-' + Date.now().toString().slice(-6),
      by: 'pulse', patientId: pt.id, patientName: pt.name,
      drug: code, drugName: d.name, qty: qty, maker: d.maker,
      orgId: cur.id, region: cur.region, prescriber: who.name
    }, { app: 'pulse', persona: who.id });
    UI.toast('Written', d.name + ' x' + qty + ' is now on the exchange.');
  });

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant');
    if (t) { cur = X.org(t); who = cur.personas[0]; render(); return; }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Primary care access, Q current', status: 'Verified' }, { app: 'pulse', persona: who.id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'A pharmacy dispensed one of your prescriptions.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
