<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .row .d { font-size: 14px; font-weight: 600; }
  .row .m { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .offline { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--claimed); background: var(--claimed-tint); border-radius: 999px; padding: 4px 11px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('bridge');
  var orgs = X.orgsFor('bridge');
  var cur = orgs[0];
  // Seeded households for the field visit list.
  var HOUSEHOLDS = [
    { id: 'HH-01', name: 'Rahima Begum', village: 'Union A', need: 'BP check, 2nd trimester' },
    { id: 'HH-02', name: 'Abdul Karim', village: 'Union B', need: 'Diabetes follow-up' },
    { id: 'HH-03', name: 'Shefali Akter', village: 'Union C', need: 'Child immunisation due' }
  ];

  function render() {
    var who = cur.personas[0];
    var refs = X.referrals().filter(function (r) { return r.byOrgId === cur.id; });
    var refd = refs.map(function (r) { return r.household; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Bridge', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Community health worker</div>' +
        '<div class="greet">Three households on today\'s round.</div>' +
        '<div class="sub">Works offline on low-end hardware; a referral syncs to the exchange and reaches the hospital</div>' +
        '<div style="margin-top:12px"><span class="offline">offline-first · syncs when back online</span></div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Field visits</h2>' +
            HOUSEHOLDS.map(function (h) {
              var done = refd.indexOf(h.id) >= 0;
              return '<div class="row"><div><div class="d">' + UI.esc(h.name) + '</div><div class="m">' + UI.esc(h.village) + ' · ' + UI.esc(h.need) + '</div></div>' +
                (done ? '<span class="chip verified">referred</span>' : '<button class="btn btn-primary btn-sm" data-refer="' + UI.esc(h.id) + '">Screen and refer</button>') + '</div>';
            }).join('') +
            '<p class="provenance">a referral writes a REFERRAL event; the receiving hospital in Apex sees it live</p>' +
          '</section>' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Referred to a facility</h2>' +
              (refs.length ? refs.slice().reverse().map(function (r) { return '<div class="row"><div class="d">' + UI.esc(r.patientName) + '</div><span class="chip claimed">awaiting admission</span></div>'; }).join('') : '<p class="sub" style="margin-top:6px">None yet. Screen a household and refer.</p>') +
            '</div>' +
            '<div style="margin-top:20px">' + UI.impactPanel(cur, { measures: [
              { front: 'Access and coverage', measure: 'Households reached, quarter', value: '2,140', status: 'Verified' },
              { front: 'Health outcomes', measure: 'Referrals completed', value: '88%', status: 'Claimed' }
            ] }) + '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var hh = e.target.getAttribute('data-refer');
    if (hh) {
      var h = HOUSEHOLDS.filter(function (x) { return x.id === hh; })[0];
      X.append('REFERRAL', { household: hh, patientName: h.name, village: h.village, reason: h.need, byOrgId: cur.id, region: cur.region }, { app: 'bridge', persona: cur.personas[0].id });
      UI.toast('Referred', h.name + ' referred to the district hospital.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Last-mile access, Q current', status: 'Verified' }, { app: 'bridge', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
