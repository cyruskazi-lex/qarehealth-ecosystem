<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .offline { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--claimed); background: var(--claimed-tint); border-radius: 999px; padding: 4px 11px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('bridge');
  var orgs = X.orgsFor('bridge');
  var cur = orgs[0];
  var mod = 'round';
  var queued = 0; // simulated offline sync queue

  function scale() { return cur.sizeClass === 'LARGE' ? 60 : cur.sizeClass === 'MEDIUM' ? 8 : 1; }

  var HOUSEHOLDS = [
    { id: 'HH-01', head: 'Rahima Begum', members: 5, village: 'Union A', need: 'ANC visit, 2nd trimester', flag: 'anc' },
    { id: 'HH-02', head: 'Abdul Karim', members: 4, village: 'Union B', need: 'Diabetes follow-up', flag: 'ncd' },
    { id: 'HH-03', head: 'Shefali Akter', members: 6, village: 'Union C', need: 'Child immunisation due', flag: 'epi' },
    { id: 'HH-04', head: 'Jamal Uddin', members: 3, village: 'Union A', need: 'BP recheck', flag: 'ncd' },
    { id: 'HH-05', head: 'Nasima Khatun', members: 7, village: 'Union B', need: 'Newborn check', flag: 'anc' }
  ];
  var EPI = [
    { child: 'Child, HH-03', vaccine: 'Pentavalent 3', due: '12 Oct', status: 'Overdue' },
    { child: 'Child, HH-05', vaccine: 'BCG', due: '18 Oct', status: 'Due' },
    { child: 'Child, HH-01', vaccine: 'Measles 1', due: '25 Oct', status: 'Scheduled' }
  ];
  var ANC = [
    { mother: 'Rahima Begum', ga: '22 wk', visits: '2 of 8', risk: 'Low', next: '28 Oct' },
    { mother: 'Nasima Khatun', ga: '34 wk', visits: '5 of 8', risk: 'High: raised BP', next: '19 Oct' }
  ];
  var STOCK = [
    { item: 'ORS sachets', onHand: 14, par: 40, status: 'low' },
    { item: 'Iron-folate', onHand: 120, par: 60, status: 'ok' },
    { item: 'Glucose test strips', onHand: 9, par: 25, status: 'low' },
    { item: 'MUAC tapes', onHand: 6, par: 5, status: 'ok' }
  ];

  var MODS = [
    { key: 'round', label: 'Today\'s round', ic: 'TR', group: 'Field' },
    { key: 'registry', label: 'Household registry', ic: 'HR', group: 'Field' },
    { key: 'screen', label: 'Screening', ic: 'SC', group: 'Field' },
    { key: 'referrals', label: 'Referrals', ic: 'RF', group: 'Field' },
    { key: 'epi', label: 'Immunisation', ic: 'IM', group: 'Programs' },
    { key: 'anc', label: 'Antenatal care', ic: 'AN', group: 'Programs' },
    { key: 'stock', label: 'Supplies', ic: 'SP', group: 'Programs' },
    { key: 'sync', label: 'Offline sync', ic: 'SY', group: 'System' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IC', group: 'System' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function referred(hh) { return X.referrals().some(function (r) { return r.household === hh && r.byOrgId === cur.id; }); }

  function moduleBody() {
    if (mod === 'round') {
      return head('Today\'s round', HOUSEHOLDS.length + ' households on the list in ' + cur.region + '. Works fully offline; actions queue and sync when back online.') +
        '<div style="margin-bottom:14px"><span class="offline">offline-first &middot; ' + queued + ' actions queued</span></div>' +
        kpis([[HOUSEHOLDS.length, 'visits today'], [X.referrals().filter(function (r) { return r.byOrgId === cur.id; }).length, 'referred'], [EPI.filter(function (e) { return e.status === 'Overdue'; }).length, 'EPI overdue'], ['1', 'high-risk ANC']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Household</th><th>Village</th><th>Members</th><th>Reason</th><th></th></tr></thead><tbody>' +
        HOUSEHOLDS.map(function (h) {
          return '<tr><td class="nm">' + esc(h.head) + '</td><td>' + esc(h.village) + '</td><td class="num">' + h.members + '</td><td>' + esc(h.need) + '</td>' +
            '<td style="text-align:right">' + (referred(h.id) ? '<span class="chip verified">referred</span>' : '<button class="btn btn-ghost btn-sm" data-screen="' + esc(h.id) + '">Screen</button> <button class="btn btn-primary btn-sm" data-refer="' + esc(h.id) + '">Refer</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('a referral writes a REFERRAL event; the district hospital in Apex sees it the moment you sync');
    }
    if (mod === 'registry') {
      return head('Household registry', 'Every family this worker covers, with members and the record that follows each person on the exchange.') +
        kpis([[Math.round(214 * (scale() / 1)), 'households'], [Math.round(980 * (scale() / 1)), 'people'], ['92%', 'with a Qäre record'], ['3', 'new this week']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Household</th><th>Village</th><th>Members</th><th>Record</th><th>Last visit</th></tr></thead><tbody>' +
        HOUSEHOLDS.map(function (h) { return '<tr><td class="nm">' + esc(h.head) + '</td><td>' + esc(h.village) + '</td><td class="num">' + h.members + '</td><td><span class="chip verified">on exchange</span></td><td class="mono">08 Oct</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('each person carries one record across every Qäre app');
    }
    if (mod === 'screen') {
      return head('Screening', 'Point-of-care screening on a phone. Readings are entered once and travel with the record.') +
        '<div class="split"><div class="card shadow">' +
          '<div style="font-family:var(--font-brand);font-weight:700;margin-bottom:12px">New encounter</div>' +
          field('Household', '<select><option>Rahima Begum (HH-01)</option><option>Abdul Karim (HH-02)</option></select>') +
          field('Blood pressure (mmHg)', '<input value="150/95">') +
          field('Random glucose (mmol/L)', '<input value="11.2">') +
          field('Danger signs', '<select><option>None</option><option>Severe headache</option><option>Reduced fetal movement</option></select>') +
          '<button class="btn btn-primary" style="margin-top:14px;width:100%" data-refer="HH-01">Record and refer if needed</button>' +
        '</div><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">IRIS guidance</div>' +
          '<div class="sub" style="font-size:13px">BP 150/95 with glucose 11.2 in a pregnant woman meets the referral threshold. Refer to the district hospital today and flag antenatal. IRIS advises; the decision to refer is the worker\'s.</div></div></div>' +
        prov('one entry, no paper; the reading is on the record before you leave the household');
    }
    if (mod === 'referrals') {
      var refs = X.referrals().filter(function (r) { return r.byOrgId === cur.id; });
      var admitted = X.admissions().map(function (a) { return a.household; });
      return head('Referrals', 'Referrals you have made and where they stand at the hospital. Status updates when Apex admits.') +
        (refs.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Patient</th><th>Village</th><th>Reason</th><th>Status at hospital</th></tr></thead><tbody>' +
          refs.slice().reverse().map(function (r) { var adm = admitted.indexOf(r.household) >= 0; return '<tr><td class="nm">' + esc(r.patientName) + '</td><td>' + esc(r.village) + '</td><td>' + esc(r.reason) + '</td><td>' + (adm ? '<span class="chip verified">admitted</span>' : '<span class="chip claimed">awaiting admission</span>') + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">None yet. Refer a household from the round and track it here; open Apex to admit it.</div></div>') +
        prov('referral status is read back from Apex admissions on the exchange, closing the loop');
    }
    if (mod === 'epi') {
      return head('Immunisation', 'The EPI schedule for children in this catchment. Overdue first.') +
        kpis([['89%', 'fully immunised'], [EPI.filter(function (e) { return e.status === 'Overdue'; }).length, 'overdue'], [EPI.filter(function (e) { return e.status === 'Due'; }).length, 'due this week'], ['2', 'defaulters traced']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Child</th><th>Vaccine</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>' +
        EPI.map(function (e) { var c = e.status === 'Overdue' ? 'inconsistent' : e.status === 'Due' ? 'claimed' : ''; return '<tr><td class="nm">' + esc(e.child) + '</td><td>' + esc(e.vaccine) + '</td><td class="mono">' + esc(e.due) + '</td><td><span class="chip ' + c + '">' + esc(e.status) + '</span></td><td style="text-align:right"><button class="btn btn-ghost btn-sm">Record dose</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('the schedule is computed per child from the birth record on the exchange');
    }
    if (mod === 'anc') {
      return head('Antenatal care', 'Pregnancies in the catchment with gestational age, visit count and risk.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Mother</th><th>Gestation</th><th>Visits</th><th>Risk</th><th>Next</th></tr></thead><tbody>' +
        ANC.map(function (a) { var high = a.risk.indexOf('High') === 0; return '<tr><td class="nm">' + esc(a.mother) + '</td><td class="mono">' + esc(a.ga) + '</td><td>' + esc(a.visits) + '</td><td>' + (high ? '<span class="chip inconsistent">' + esc(a.risk) + '</span>' : '<span class="chip verified">' + esc(a.risk) + '</span>') + '</td><td class="mono">' + esc(a.next) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a high-risk flag becomes a referral into Apex with one tap');
    }
    if (mod === 'stock') {
      return head('Supplies', 'Field commodities against par. Two lines need resupply from the program store.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Item</th><th class="num">On hand</th><th class="num">Par</th><th>Status</th><th></th></tr></thead><tbody>' +
        STOCK.map(function (s) { return '<tr><td class="nm">' + esc(s.item) + '</td><td class="num">' + s.onHand + '</td><td class="num">' + s.par + '</td><td>' + (s.status === 'low' ? '<span class="chip inconsistent">resupply</span>' : '<span class="chip verified">ok</span>') + '</td><td style="text-align:right">' + (s.status === 'low' ? '<button class="btn btn-primary btn-sm">Request</button>' : '') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a resupply request routes to the program and can be fulfilled through Relay');
    }
    if (mod === 'sync') {
      return head('Offline sync', 'How the app behaves with no signal, and what is waiting to upload.') +
        kpis([[queued, 'actions queued'], ['last sync', '2h ago'], ['100%', 'captured offline'], ['0', 'conflicts']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Every screening, referral and dose is written to the phone first and signed. When a signal returns, the queue uploads to the exchange in order, and nothing is entered twice. A referral made offline still reaches Apex the moment you reconnect.</div>' +
        '<button class="btn btn-primary" style="margin-top:14px" data-sync>Simulate sync now</button></div>' +
        prov('offline-first by design, for last-mile work on low-end hardware');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'What this program contributes to the EESG Health Impact framework, and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Access and coverage', measure: 'Households reached, quarter', value: String(Math.round(2140 * (scale() / 1))), status: 'Verified' },
          { front: 'Health outcomes', measure: 'Referrals completed', value: '88%', status: 'Claimed' },
          { front: 'Social', measure: 'Immunisation coverage', value: '89%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function field(label, control) { return '<label class="tenant" style="display:block;border:0;background:transparent;padding:0;cursor:default"><span style="display:block;font-size:11px;color:var(--mid);font-weight:600;margin:10px 0 4px">' + esc(label) + '</span></label><div style="margin-top:-6px">' + control.replace('<select', '<select style="width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface)"').replace('<input', '<input style="width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface)"') + '</div>'; }

  function render() {
    var who = cur.personas[0];
    var overdue = EPI.filter(function (e) { return e.status === 'Overdue'; }).length;
    var mods = MODS.map(function (m) { return m.key === 'epi' ? Object.assign({}, m, { badge: overdue || null }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Bridge', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    if (e.target.hasAttribute('data-sync')) { queued = 0; render(); UI.toast('Synced', 'Offline queue uploaded to the exchange.'); return; }
    var sc = e.target.getAttribute('data-screen');
    if (sc) { queued++; mod = 'screen'; render(); return; }
    var hh = e.target.getAttribute('data-refer');
    if (hh) {
      var h = HOUSEHOLDS.filter(function (x) { return x.id === hh; })[0] || HOUSEHOLDS[0];
      X.append('REFERRAL', { household: h.id, patientName: h.head, village: h.village, reason: h.need, byOrgId: cur.id, region: cur.region }, { app: 'bridge', persona: cur.personas[0].id });
      UI.toast('Referred', h.head + ' referred to the district hospital.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Last-mile access, Q current', status: 'Verified' }, { app: 'bridge', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
