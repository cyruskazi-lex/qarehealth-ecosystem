<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 28px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .med { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .med.fresh { animation: flash 1.4s ease; }
  @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .med .m-d { font-size: 14px; font-weight: 600; }
  .med .m-m { font-size: 12px; color: var(--mid); }
  .consent { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .consent .c-t { font-size: 14px; font-weight: 600; }
  .consent .c-m { font-size: 12px; color: var(--mid); }
  .toggle { border: none; cursor: pointer; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; font-family: var(--font-ui); }
  .toggle.on { background: var(--verified-tint); color: var(--verified); }
  .toggle.off { background: var(--unmeasured-tint); color: var(--mid); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('nova');
  var pt = X.PATIENT;
  var seen = {};

  function render() {
    var meds = X.prescriptions().filter(function (r) { return r.patientId === pt.id; });
    var care = X.consentGranted('pulse') !== false; // default granted for care coordination
    var research = X.consentGranted('research') === true;
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Nova', personaName: pt.name, personaRole: 'Patient · owns this record' }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Your health record</div>' +
        '<div class="greet">Hello, Amara. Your record is yours.</div>' +
        '<div class="sub"><span class="mono">' + UI.esc(pt.mrn) + '</span> · ' + pt.age + ' · ' + UI.esc(pt.conditions.join(', ')) + '</div>' +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Medicines</h2>' +
            (meds.length ? meds.slice().reverse().map(function (r) {
              var fresh = !seen[r.rxId]; seen[r.rxId] = true;
              var disp = X.isDispensed(r.rxId);
              return '<div class="med' + (fresh ? ' fresh' : '') + '"><div><div class="m-d">' + UI.esc(r.drugName) + ' x' + r.qty + '</div>' +
                '<div class="m-m">prescribed by ' + UI.esc(r.prescriber) + '</div></div>' +
                (disp ? '<span class="chip verified">picked up</span>' : '<span class="chip claimed">at pharmacy</span>') + '</div>';
            }).join('') : '<p class="sub" style="margin-top:6px">When your clinician prescribes in Pulse, it shows here at once.</p>') +
            '<p class="provenance">reads your record from the exchange; nothing here is entered twice</p>' +
          '</section>' +
          '<section>' +
            '<div class="card shadow"><h2 class="sec">Who can see your record</h2>' +
              '<div class="consent"><div><div class="c-t">Bhorosha Primary Care</div><div class="c-m">care coordination · your clinician</div></div>' +
                '<button class="toggle ' + (care ? 'on' : 'off') + '" data-consent="pulse">' + (care ? 'Granted' : 'Grant') + '</button></div>' +
              '<div class="consent"><div><div class="c-t">Anonymous research and impact</div><div class="c-m">secondary use · only de-identified aggregates reach GIC</div></div>' +
                '<button class="toggle ' + (research ? 'on' : 'off') + '" data-consent="research">' + (research ? 'Sharing' : 'Share') + '</button></div>' +
              '<p class="provenance">two separate keys; granting one never grants the other</p>' +
            '</div>' +
            '<div class="card shadow" style="margin-top:16px"><h2 class="sec">Your contribution to health impact</h2>' +
              '<p class="sub" style="margin-top:0">With your consent, your de-identified outcomes join the national picture that institutions publish, verified, to the Global Impact Commons to raise capital for care. Your identity never leaves this record.</p>' +
              '<a class="btn btn-ghost" href="' + X.GIC_URL + '" target="_blank" rel="noopener" style="margin-top:12px">See the Commons</a>' +
            '</div>' +
          '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var c = e.target.getAttribute('data-consent');
    if (!c) return;
    var currentlyOn = (c === 'pulse') ? (X.consentGranted('pulse') !== false) : (X.consentGranted(c) === true);
    X.append(currentlyOn ? 'CONSENT_REVOKED' : 'CONSENT_GRANTED', { to: c, patientId: pt.id }, { app: 'nova', persona: pt.id });
    UI.toast('Consent', (currentlyOn ? 'Revoked' : 'Granted') + ' access: ' + (c === 'pulse' ? 'your clinician' : 'anonymous research'));
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_WRITTEN' && ev.payload.patientId === pt.id) return { k: 'Pulse', msg: 'New prescription on your record: ' + UI.esc(ev.payload.drugName) + '.' };
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'Your ' + UI.esc(ev.payload.drugName) + ' is ready to collect.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
