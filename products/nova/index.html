<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  .med { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .med.fresh { animation: flash 1.4s ease; } @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .med .m-d { font-size: 14px; font-weight: 600; } .med .m-m { font-size: 12px; color: var(--mid); }
  .consent { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .consent .c-t { font-size: 14px; font-weight: 600; } .consent .c-m { font-size: 12px; color: var(--mid); }
  .toggle { border: none; cursor: pointer; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; font-family: var(--font-ui); }
  .toggle.on { background: var(--verified-tint); color: var(--verified); }
  .toggle.off { background: var(--unmeasured-tint); color: var(--mid); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc;
  UI.init('nova');
  var pt = X.PATIENT;
  var mod = 'home';
  var seen = {};

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  var MODS = [
    { key: 'home', label: 'My health', ic: 'MH', group: 'Record' },
    { key: 'meds', label: 'Medicines', ic: 'MD', group: 'Record' },
    { key: 'results', label: 'Results', ic: 'RS', group: 'Record' },
    { key: 'appointments', label: 'Appointments', ic: 'AP', group: 'Record' },
    { key: 'consent', label: 'Consent and sharing', ic: 'CS', group: 'Control' },
    { key: 'contribution', label: 'Impact contribution', ic: 'IC', group: 'Control' }
  ];

  function moduleBody() {
    var meds = X.prescriptions().filter(function (r) { return r.patientId === pt.id; });
    var results = X.labResults().filter(function (r) { return r.patientId === pt.id; });
    var care = X.consentGranted('pulse') !== false;
    var research = X.consentGranted('research') === true;
    if (mod === 'home') {
      return head('Hello, Amara', 'Your health in one place, and it is yours. Everything here is assembled from the exchange with your consent.') +
        '<div class="figs" style="margin-bottom:16px"><div class="fig"><div class="fv">' + meds.length + '</div><div class="fk">active medicines</div></div><div class="fig"><div class="fv">' + results.length + '</div><div class="fk">recent results</div></div><div class="fig"><div class="fv">2</div><div class="fk">upcoming visits</div></div><div class="fig"><div class="fv">' + (research ? 'on' : 'off') + '</div><div class="fk">research sharing</div></div></div>' +
        '<div class="split"><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Summary</div>' +
        '<div class="med"><div><div class="m-d">Conditions</div></div><span>' + esc(pt.conditions.join(', ')) + '</span></div>' +
        '<div class="med"><div><div class="m-d">Allergies</div></div><span style="color:var(--inconsistent)">' + esc(pt.allergies.join(', ')) + '</span></div>' +
        '<div class="med"><div><div class="m-d">Record ID</div></div><span class="mono">' + esc(pt.mrn) + '</span></div></div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">What changed recently</div>' +
        (meds.length || results.length ? (meds.slice(-2).map(function (r) { return '<div class="med"><div class="m-d">' + esc(r.drugName) + ' prescribed</div>' + (X.isDispensed(r.rxId) ? '<span class="chip verified">picked up</span>' : '<span class="chip claimed">at pharmacy</span>') + '</div>'; }).join('') + results.slice(-2).map(function (r) { return '<div class="med"><div class="m-d">' + esc(r.testName) + ' result</div>' + (r.flag ? '<span class="chip inconsistent">review</span>' : '<span class="chip verified">normal</span>') + '</div>'; }).join('')) : '<div class="sub">When your clinician prescribes or your lab releases a result, it shows here at once.</div>') +
        '</div></div>' + prov('reads your record from the exchange; nothing here was entered twice');
    }
    if (mod === 'meds') {
      return head('Medicines', 'What you have been prescribed, and whether it is ready at the pharmacy.') +
        (meds.length ? meds.slice().reverse().map(function (r) { var fresh = !seen['m' + r.rxId]; seen['m' + r.rxId] = true; var disp = X.isDispensed(r.rxId); return '<div class="med' + (fresh ? ' fresh' : '') + '"><div><div class="m-d">' + esc(r.drugName) + ' x' + r.qty + '</div><div class="m-m">prescribed by ' + esc(r.prescriber) + '</div></div>' + (disp ? '<span class="chip verified">picked up</span>' : '<span class="chip claimed">ready at pharmacy</span>') + '</div>'; }).join('') : '<div class="card"><div class="sub">No medicines yet. When your clinician prescribes in Pulse, it appears here live.</div></div>') +
        prov('your medicines update the moment a clinician prescribes and a pharmacist dispenses');
    }
    if (mod === 'results') {
      return head('Results', 'Your lab results, in plain terms, as soon as the lab releases them.') +
        (results.length ? results.slice().reverse().map(function (r) { var fresh = !seen['r' + r.test]; seen['r' + r.test] = true; return '<div class="med' + (fresh ? ' fresh' : '') + '"><div><div class="m-d">' + esc(r.testName) + '</div><div class="m-m">' + esc(r.value) + ' ' + esc(r.unit) + (r.flag ? ' &middot; your clinician will discuss this' : ' &middot; in the normal range') + '</div></div>' + (r.flag ? '<span class="chip inconsistent">out of range</span>' : '<span class="chip verified">normal</span>') + '</div>'; }).join('') : '<div class="card"><div class="sub">No results yet. When the lab in Prism releases one, it appears here.</div></div>') +
        prov('results are released to you and your clinician at the same time, no waiting for a callback');
    }
    if (mod === 'appointments') {
      return head('Appointments', 'Your upcoming and past visits across the health system.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>When</th><th>With</th><th>Where</th><th>Status</th></tr></thead><tbody>' +
        [['24 Oct, 10:00', 'Dr. Imran Chowdhury', 'Bhorosha Primary Care', 'Confirmed'], ['02 Nov, 09:30', 'Diabetes clinic', 'Shapla District Hospital', 'Confirmed'], ['08 Oct', 'Dr. Imran Chowdhury', 'Bhorosha Primary Care', 'Attended']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + (r[3] === 'Attended' ? '<span class="chip">attended</span>' : '<span class="chip verified">confirmed</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('appointments are shared with the facility, so they have your record before you arrive');
    }
    if (mod === 'consent') {
      return head('Consent and sharing', 'You decide who sees your record. Two separate keys: your care team, and anonymous research. Granting one never grants the other.') +
        '<div class="consent"><div><div class="c-t">Bhorosha Primary Care</div><div class="c-m">care coordination &middot; your clinician</div></div><button class="toggle ' + (care ? 'on' : 'off') + '" data-consent="pulse">' + (care ? 'Granted' : 'Grant') + '</button></div>' +
        '<div class="consent"><div><div class="c-t">Shapla District Hospital</div><div class="c-m">care coordination &middot; for your referral</div></div><button class="toggle on" disabled>Granted</button></div>' +
        '<div class="consent"><div><div class="c-t">Anonymous research and impact</div><div class="c-m">secondary use &middot; only de-identified aggregates reach the Commons</div></div><button class="toggle ' + (research ? 'on' : 'off') + '" data-consent="research">' + (research ? 'Sharing' : 'Share') + '</button></div>' +
        '<div class="card shadow" style="margin-top:14px"><div class="sub" style="font-size:13px">Every grant is live and you can withdraw it at any time. A withdrawal is honoured immediately: the research cohort in Lumen drops your record on its next build, and your care team loses access the moment you revoke.</div></div>' +
        prov('the consent ledger is append-only; grant, revoke and every access is recorded');
    }
    if (mod === 'contribution') {
      return head('Impact contribution', 'With your consent, your de-identified outcomes join the national picture that institutions publish, verified, to raise capital for care. Your identity never leaves your record.') +
        '<div class="split"><div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">What you contribute</div>' +
        '<div class="med"><div class="m-d">Diabetes control outcome</div><span>' + (research ? '<span class="chip verified">contributing</span>' : '<span class="chip">not shared</span>') + '</span></div>' +
        '<div class="med"><div class="m-d">Access and coverage</div><span>' + (research ? '<span class="chip verified">contributing</span>' : '<span class="chip">not shared</span>') + '</span></div>' +
        '<div class="sub" style="font-size:13px;margin-top:12px">' + (research ? 'You are sharing anonymised outcomes. This is what lets your clinic and hospital prove their impact and attract funding for better care.' : 'You are not sharing for research. Turn it on in Consent to contribute anonymously.') + '</div></div>' +
        '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;margin-bottom:10px">Where it goes</div><div class="sub" style="font-size:13px">Only de-identified, verified aggregates reach the Global Impact Commons. No name, no record ID, nothing that points back to you. You can see the Commons for yourself.</div><a class="btn btn-ghost" style="margin-top:12px" href="' + X.GIC_URL + '" target="_blank" rel="noopener">See the Commons</a></div></div>' +
        prov('your contribution is anonymous and verifiable; the two are not in tension');
    }
    return '';
  }

  function render() {
    var who = { name: pt.name };
    var abn = X.labResults().filter(function (r) { return r.patientId === pt.id && r.flag; }).length;
    var mods = MODS.map(function (m) { return m.key === 'results' ? Object.assign({}, m, { badge: abn || null }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Nova', personaName: pt.name, personaRole: 'Patient · owns this record' }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main"><div style="margin-top:4px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var c = e.target.getAttribute('data-consent');
    if (c) {
      var on = (c === 'pulse') ? (X.consentGranted('pulse') !== false) : (X.consentGranted(c) === true);
      X.append(on ? 'CONSENT_REVOKED' : 'CONSENT_GRANTED', { to: c, patientId: pt.id }, { app: 'nova', persona: pt.id });
      UI.toast('Consent', (on ? 'Revoked' : 'Granted') + ' access: ' + (c === 'pulse' ? 'your clinician' : 'anonymous research'));
      return;
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_WRITTEN' && ev.payload.patientId === pt.id) return { k: 'Pulse', msg: 'New prescription on your record: ' + esc(ev.payload.drugName) + '.' };
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'Your ' + esc(ev.payload.drugName) + ' is ready to collect.' };
    if (ev.type === 'LAB_RESULT' && ev.payload.patientId === pt.id) return { k: 'Prism', msg: 'A new result is on your record: ' + esc(ev.payload.testName) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
