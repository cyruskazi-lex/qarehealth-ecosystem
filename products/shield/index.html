<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .row.fresh { animation: flash 1.4s ease; } @keyframes flash { 0%{background:var(--iris-tint)} 100%{background:transparent} }
  .row .d { font-size: 14px; font-weight: 600; } .row .m { font-size: 12px; color: var(--mid); margin-top: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('shield');
  var orgs = X.orgsFor('shield');
  var cur = X.org('ORG-SHIELD-MID');
  var seen = {};

  function render() {
    var who = cur.personas[0];
    // A claim is a dispensed prescription that this payer has not yet adjudicated.
    var open = X.dispenses().filter(function (d) { return !X.isClaimed(d.rxId); });
    var done = X.claims();
    var paid = done.reduce(function (a, c) { return a + (c.amount || 0); }, 0);
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Shield', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Insurer and payer</div>' +
        '<div class="greet">' + (open.length ? (open.length + ' claim' + (open.length > 1 ? 's' : '') + ' to adjudicate against the record.') : 'No open claims. Everything dispensed is reconciled.') + '</div>' +
        '<div class="sub">Each claim is matched to a real dispensing event on the exchange; no claim without a record</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="figs" style="margin-top:18px">' +
          '<div class="fig"><div class="fv">' + open.length + '</div><div class="fk">open claims</div></div>' +
          '<div class="fig"><div class="fv">' + done.length + '</div><div class="fk">adjudicated</div></div>' +
          '<div class="fig"><div class="fv">' + UI.money(paid, '$') + '</div><div class="fk">paid this session</div></div>' +
          '<div class="fig"><div class="fv">0</div><div class="fk">unmatched claims</div></div>' +
        '</div>' +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Claims queue</h2>' +
            (open.length ? open.slice().reverse().map(function (d) {
              var drug = X.drug(d.drug); var amt = drug ? drug.unitPrice * d.qty : 0; var copay = Math.round(amt * 0.2);
              var fresh = !seen[d.rxId]; seen[d.rxId] = true;
              return '<div class="row' + (fresh ? ' fresh' : '') + '"><div><div class="d">' + UI.esc(d.drugName) + ' x' + d.qty + '</div>' +
                '<div class="m">' + UI.esc(d.patientName || 'member') + ' · <span class="mono">' + UI.esc(d.rxId) + '</span> · claim ' + UI.money(amt, '$') + ' · copay ' + UI.money(copay, '$') + '</div></div>' +
                '<button class="btn btn-primary btn-sm" data-adj="' + UI.esc(d.rxId) + '">Adjudicate</button></div>';
            }).join('') : '<p class="sub" style="margin-top:6px">Dispense a prescription in Cura and the claim appears here live.</p>') +
            '<p class="provenance">reads RX_DISPENSED events; adjudication writes a CLAIM_ADJUDICATED event, matched to the record</p>' +
          '</section>' +
          '<section>' + UI.impactPanel(cur, { measures: [
            { front: 'Affordability and financial protection', measure: 'Claims paid on record', value: '100%', status: 'Verified' },
            { front: 'Governance', measure: 'Fraud flags cleared', value: '0 open', status: 'Verified' }
          ] }) + '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var rx = e.target.getAttribute('data-adj');
    if (rx) {
      var d = X.dispenses().filter(function (x) { return x.rxId === rx; })[0];
      var drug = X.drug(d.drug); var amt = drug ? drug.unitPrice * d.qty : 0;
      X.append('CLAIM_ADJUDICATED', { rxId: rx, drugName: d.drugName, amount: amt - Math.round(amt * 0.2), copay: Math.round(amt * 0.2), orgId: cur.id }, { app: 'shield', persona: cur.personas[0].id });
      UI.toast('Adjudicated', d.drugName + ' claim approved against pack ' + (d.packSerial || rx) + '.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Financial protection, Q current', status: 'Verified' }, { app: 'shield', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'New claim to adjudicate: ' + UI.esc(ev.payload.drugName) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
