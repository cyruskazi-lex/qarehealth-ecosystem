<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('shield');
  var orgs = X.orgsFor('shield');
  var cur = X.org('ORG-SHIELD-MID');
  var mod = 'claims';
  var seen = {};

  function scale() { return cur.sizeClass === 'LARGE' ? 20 : cur.sizeClass === 'MEDIUM' ? 1 : 0.2; }

  var PLANS = [
    { name: 'Essential', members: 240000, premium: 'subsidised', cover: 'Primary care, generics, maternal' },
    { name: 'Standard', members: 86000, premium: '420 BDT/mo', cover: 'Adds secondary care, labs' },
    { name: 'Comprehensive', members: 22000, premium: '1,150 BDT/mo', cover: 'Adds tertiary, oncology' }
  ];
  var NETWORK = [
    { prov: 'Shapla District Hospital', type: 'Hospital', claims: 1240, status: 'In network' },
    { prov: 'Probaho Diagnostics', type: 'Lab', claims: 820, status: 'In network' },
    { prov: 'Shetu Community Pharmacy', type: 'Pharmacy', claims: 2110, status: 'In network' },
    { prov: 'Metro Polyclinic Network', type: 'Clinic', claims: 640, status: 'Review' }
  ];
  var FRAUD = [
    { flag: 'Duplicate claim', detail: 'Same pack serial billed twice, SHP pharmacy', sev: 'High' },
    { flag: 'Upcoding', detail: 'Consult billed as procedure, 3 instances', sev: 'Medium' }
  ];

  var MODS = [
    { key: 'claims', label: 'Claims queue', ic: 'CQ', group: 'Claims' },
    { key: 'adjudicated', label: 'Adjudicated', ic: 'AJ', group: 'Claims' },
    { key: 'fraud', label: 'Fraud and anomaly', ic: 'FA', group: 'Claims' },
    { key: 'members', label: 'Members', ic: 'MB', group: 'Scheme' },
    { key: 'plans', label: 'Benefit plans', ic: 'BP', group: 'Scheme' },
    { key: 'network', label: 'Provider network', ic: 'PN', group: 'Scheme' },
    { key: 'payments', label: 'Payments', ic: 'PY', group: 'Finance' },
    { key: 'riskpool', label: 'Risk pool', ic: 'RP', group: 'Finance' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }

  function moduleBody() {
    var open = X.dispenses().filter(function (d) { return !X.isClaimed(d.rxId); });
    var done = X.claims();
    var paid = done.reduce(function (a, c) { return a + (c.amount || 0); }, 0);
    if (mod === 'claims') {
      return head('Claims queue', 'Every claim is a real dispensing event on the exchange. No claim exists without a matching record.') +
        kpis([[open.length, 'open claims'], [done.length, 'adjudicated'], [money(paid), 'paid this session'], ['0', 'unmatched claims']]) +
        (open.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Member</th><th>Item</th><th>Pack serial</th><th class="num">Claim</th><th class="num">Copay</th><th></th></tr></thead><tbody>' +
          open.slice().reverse().map(function (d) {
            var drug = X.drug(d.drug); var amt = drug ? drug.unitPrice * d.qty : 0; var copay = Math.round(amt * 0.2);
            var fresh = !seen[d.rxId]; seen[d.rxId] = true;
            return '<tr' + (fresh ? ' style="background:var(--iris-tint)"' : '') + '><td class="nm">' + esc(d.patientName || 'member') + '</td><td>' + esc(d.drugName) + ' x' + d.qty + '</td><td class="mono sub2">' + esc(d.packSerial || d.rxId) + '</td><td class="num">' + money(amt) + '</td><td class="num">' + money(copay) + '</td><td style="text-align:right"><button class="btn btn-primary btn-sm" data-adj="' + esc(d.rxId) + '">Adjudicate</button></td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="card"><div class="sub">No open claims. Dispense a prescription in Cura and the claim appears here live.</div></div>') +
        prov('reads RX_DISPENSED events; adjudication writes CLAIM_ADJUDICATED, matched to the pack serial');
    }
    if (mod === 'adjudicated') {
      return head('Adjudicated', 'Claims settled this session, each tied to the record that justifies it.') +
        (done.length ? '<div class="qt-wrap"><table class="qt"><thead><tr><th>Claim</th><th>Item</th><th class="num">Paid</th><th class="num">Copay</th><th>Basis</th></tr></thead><tbody>' +
          done.slice().reverse().map(function (c) { return '<tr><td class="mono">' + esc(c.rxId) + '</td><td class="nm">' + esc(c.drugName) + '</td><td class="num">' + money(c.amount) + '</td><td class="num">' + money(c.copay) + '</td><td>' + UI.statusChip('Verified') + '</td></tr>'; }).join('') +
          '</tbody></table></div>' : '<div class="card"><div class="sub">Nothing adjudicated yet.</div></div>') +
        prov('every settled claim traces to a dispensing event, so audit is one lookup');
    }
    if (mod === 'fraud') {
      return head('Fraud and anomaly', 'Patterns the exchange makes visible: a claim without a record, a serial billed twice, a code that does not fit the encounter.') +
        kpis([[FRAUD.length, 'open flags'], ['0', 'claims without a record'], ['1.2%', 'flagged rate'], [money(Math.round(34000 * scale())), 'recovered, quarter']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Flag</th><th>Detail</th><th>Severity</th><th></th></tr></thead><tbody>' +
        FRAUD.map(function (f) { return '<tr><td class="nm">' + esc(f.flag) + '</td><td>' + esc(f.detail) + '</td><td>' + (f.sev === 'High' ? '<span class="chip inconsistent">High</span>' : '<span class="chip claimed">Medium</span>') + '</td><td style="text-align:right"><button class="btn btn-ghost btn-sm">Investigate</button></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a claim that cannot be matched to a dispensing or admission event never pays');
    }
    if (mod === 'members') {
      var n = Math.round(348000 * scale());
      return head('Members', 'Enrolled lives, their plan and their coverage status.') +
        kpis([[n.toLocaleString(), 'members'], ['94%', 'coverage active'], [Math.round(n * 0.03).toLocaleString(), 'renewals due'], ['31%', 'female head of household']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Member</th><th>Plan</th><th>Status</th><th>Renews</th></tr></thead><tbody>' +
        [['Amara Okonkwo', 'Standard', 'Active', '14 Jan'], ['M. Rahman', 'Essential', 'Active', '02 Dec'], ['S. Begum', 'Comprehensive', 'Active', '20 Mar'], ['K. Das', 'Essential', 'Lapsed', 'overdue']].map(function (r) {
          return '<tr><td class="nm">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + (r[2] === 'Lapsed' ? '<span class="chip inconsistent">lapsed</span>' : '<span class="chip verified">active</span>') + '</td><td class="mono">' + esc(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('enrollment and claims read the same member record, so eligibility is never stale');
    }
    if (mod === 'plans') {
      return head('Benefit plans', 'The scheme\'s plans, their membership and what each covers.') +
        '<div class="cards3">' + PLANS.map(function (p) {
          return '<div class="card shadow"><div style="font-family:var(--font-brand);font-weight:700;font-size:16px">' + esc(p.name) + '</div><div class="mono" style="font-size:12px;color:var(--mid);margin:4px 0 10px">' + esc(p.premium) + '</div>' +
            '<div style="font-family:var(--font-mono);font-size:20px;font-weight:600">' + p.members.toLocaleString() + '</div><div class="sub2">members</div>' +
            '<div class="sub" style="font-size:12.5px;margin-top:10px">' + esc(p.cover) + '</div></div>';
        }).join('') + '</div>' + prov('benefits adjudicate automatically against the member plan and the record');
    }
    if (mod === 'network') {
      return head('Provider network', 'Contracted providers, their claim volume and standing.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Provider</th><th>Type</th><th class="num">Claims, quarter</th><th>Status</th></tr></thead><tbody>' +
        NETWORK.map(function (p) { return '<tr><td class="nm">' + esc(p.prov) + '</td><td>' + esc(p.type) + '</td><td class="num">' + p.claims.toLocaleString() + '</td><td>' + (p.status === 'Review' ? '<span class="chip claimed">review</span>' : '<span class="chip verified">in network</span>') + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('a provider\'s claims reconcile against their own dispensing and admission records');
    }
    if (mod === 'payments') {
      return head('Payments', 'Settlement to providers. The payer never touches the record; it pays against what the exchange verifies.') +
        kpis([[money(Math.round(1240000 * scale())), 'settled, month'], [money(paid), 'this session'], ['4.2d', 'mean settlement'], ['99.1%', 'clean first-pass']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Because every claim is matched to a dispensing or admission event before it pays, first-pass settlement is high and disputes are rare. Payment runs reconcile through the same mobile-money adapter Core operates.</div></div>' +
        prov('settlement follows verification; an unverified claim is never paid');
    }
    if (mod === 'riskpool') {
      return head('Risk pool', 'The scheme\'s financial health: contributions in, claims out, reserve.') +
        kpis([[money(Math.round(2100000 * scale())), 'contributions, month'], [money(Math.round(1680000 * scale())), 'claims, month'], ['80%', 'loss ratio'], [money(Math.round(5400000 * scale())), 'reserve']]) +
        '<div class="card shadow"><div class="sub" style="font-size:13px">Loss ratio at 80% is healthy for a subsidised scheme. The affordability front of the impact framework reads directly from this: lower out-of-pocket means the pool is doing its job. Verified claims data makes the actuarial basis real rather than estimated.</div></div>' +
        prov('a verified claims history is what lets a payer price risk in a market with thin data');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'The payer\'s contribution to the framework and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Affordability and financial protection', measure: 'Claims paid on record', value: '100%', status: 'Verified' },
          { front: 'Affordability and financial protection', measure: 'Out-of-pocket reduced', value: '22%', status: 'Claimed' },
          { front: 'Governance', measure: 'Fraud flags cleared', value: '0 open', status: 'Verified' }
        ] });
    }
    return '';
  }

  function render() {
    var who = cur.personas[0];
    var open = X.dispenses().filter(function (d) { return !X.isClaimed(d.rxId); }).length;
    var mods = MODS.map(function (m) { return m.key === 'claims' ? Object.assign({}, m, { badge: open || null, calm: true }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Shield', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var rx = e.target.getAttribute('data-adj');
    if (rx) {
      var d = X.dispenses().filter(function (x) { return x.rxId === rx; })[0];
      var drug = X.drug(d.drug); var amt = drug ? drug.unitPrice * d.qty : 0;
      X.append('CLAIM_ADJUDICATED', { rxId: rx, drugName: d.drugName, amount: amt - Math.round(amt * 0.2), copay: Math.round(amt * 0.2), orgId: cur.id }, { app: 'shield', persona: cur.personas[0].id });
      UI.toast('Adjudicated', d.drugName + ' claim approved against pack ' + (d.packSerial || rx) + '.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Financial protection, Q current', status: 'Verified' }, { app: 'shield', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  UI.watchToasts(function (ev) {
    if (ev.type === 'RX_DISPENSED') return { k: 'Cura', msg: 'New claim to adjudicate: ' + esc(ev.payload.drugName) + '.' };
    return null;
  });
  render();
})();
</script>
</body>
</html>
