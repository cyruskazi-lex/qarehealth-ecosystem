<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/spine.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI, esc = UI.esc, money = UI.money;
  UI.init('relay');
  var orgs = X.orgsFor('relay');
  var cur = X.org('ORG-RELAY-MID');
  var mod = 'tower';

  function scale() { return cur.sizeClass === 'LARGE' ? 6 : cur.sizeClass === 'MEDIUM' ? 1 : 0.3; }

  var SHIPMENTS = [
    { id: 'SHP-07', product: 'OncoNex-100', units: 400, lane: 'Tongi to US hub', temp: 12.9, cap: 8, cold: true, eta: 'delayed', trace: [4, 5, 6, 7, 9, 11, 13, 12, 10] },
    { id: 'SHP-11', product: 'CardiNex-10', units: 6000, lane: 'Tongi to Chattogram', temp: 22, cap: 30, cold: false, eta: 'on time', trace: [21, 22, 23, 22, 22, 23, 22] },
    { id: 'SHP-14', product: 'OncoNex-100', units: 220, lane: 'Tongi to Sylhet', temp: 5.5, cap: 8, cold: true, eta: 'on time', trace: [5, 5, 6, 5, 5, 6, 5] },
    { id: 'SHP-18', product: 'Metformin 500', units: 12000, lane: 'Tongi to Khulna', temp: 24, cap: 30, cold: false, eta: 'on time', trace: [23, 24, 24, 23, 24] }
  ];
  var WAREHOUSE = [
    { node: 'Tongi central', cap: '12,000 pallets', used: 71, cold: '98% uptime' },
    { node: 'Chattogram DC', cap: '4,000 pallets', used: 55, cold: '99% uptime' },
    { node: 'Sylhet depot', cap: '900 pallets', used: 82, cold: '95% uptime' }
  ];
  var FLEET = [
    { v: 'Reefer TRK-11', route: 'Tongi to Chattogram', status: 'En route', temp: '22°C' },
    { v: 'Reefer TRK-04', route: 'Tongi to Sylhet', status: 'En route', temp: '5.5°C' },
    { v: 'Van VAN-22', route: 'Dhaka metro drops', status: 'Delivering', temp: 'ambient' },
    { v: 'Reefer TRK-07', route: 'Airport to US hub', status: 'Breach hold', temp: '12.9°C' }
  ];

  var MODS = [
    { key: 'tower', label: 'Control tower', ic: 'CT', group: 'Operations' },
    { key: 'coldchain', label: 'Cold chain', ic: 'CC', group: 'Operations' },
    { key: 'trace', label: 'Track and trace', ic: 'TT', group: 'Operations' },
    { key: 'warehouse', label: 'Warehouse', ic: 'WH', group: 'Network' },
    { key: 'fleet', label: 'Fleet and routes', ic: 'FL', group: 'Network' },
    { key: 'pod', label: 'Proof of delivery', ic: 'PD', group: 'Network' },
    { key: 'exceptions', label: 'Exceptions', ic: 'EX', group: 'Risk' },
    { key: 'recalls', label: 'Recalls', ic: 'RC', group: 'Risk' },
    { key: 'impact', label: 'Impact and GIC', ic: 'IM', group: 'Oversight' }
  ];

  function head(t, d) { return '<div class="sec-head"><div><div class="t">' + esc(t) + '</div><div class="d">' + esc(d) + '</div></div></div>'; }
  function kpis(arr) { return '<div class="figs" style="margin-bottom:16px">' + arr.map(function (a) { return '<div class="fig"><div class="fv">' + esc(a[0]) + '</div><div class="fk">' + esc(a[1]) + '</div></div>'; }).join('') + '</div>'; }
  function prov(t) { return '<p class="provenance">' + esc(t) + '</p>'; }
  function breaches() { return SHIPMENTS.filter(function (s) { return s.cold && s.temp > s.cap; }); }
  function raised(id) { return X.coldChainAlerts().some(function (a) { return a.shipment === id; }); }
  function spark(trace, cap) { return '<div class="spark">' + trace.map(function (v) { var h = Math.min(100, v / (cap * 1.6) * 100); return '<i class="' + (v > cap ? 'hot' : '') + '" style="height:' + h + '%"></i>'; }).join('') + '</div>'; }

  function moduleBody() {
    var br = breaches();
    if (mod === 'tower') {
      return head('Control tower', SHIPMENTS.length + ' shipments in transit. A cold-chain breach alerts the manufacturer in Nexus the moment you raise it.') +
        kpis([[SHIPMENTS.length, 'in transit'], [br.length, 'breaching'], [SHIPMENTS.filter(function (s) { return s.eta === 'delayed'; }).length, 'delayed'], ['97.4%', 'cold-chain compliance']]) +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Shipment</th><th>Product</th><th class="num">Units</th><th>Lane</th><th>Temp</th><th>ETA</th><th></th></tr></thead><tbody>' +
        SHIPMENTS.map(function (s) {
          var breach = s.cold && s.temp > s.cap;
          return '<tr><td class="mono">' + esc(s.id) + '</td><td class="nm">' + esc(s.product) + '</td><td class="num">' + s.units.toLocaleString() + '</td><td>' + esc(s.lane) + '</td>' +
            '<td><span class="mono" style="color:' + (breach ? 'var(--inconsistent)' : 'var(--verified)') + '">' + s.temp + '°C</span>' + (s.cold ? ' <span class="sub2">/ ' + s.cap + '</span>' : '') + '</td>' +
            '<td>' + (s.eta === 'delayed' ? '<span class="chip inconsistent">delayed</span>' : '<span class="chip verified">on time</span>') + '</td>' +
            '<td style="text-align:right">' + (breach ? (raised(s.id) ? '<span class="chip inconsistent">alerted</span>' : '<button class="btn btn-primary btn-sm" data-alert="' + esc(s.id) + '">Raise alert</button>') : '<button class="btn btn-ghost btn-sm">Track</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('reads IoT temperature per shipment; a breach writes a COLD_CHAIN_ALERT the maker sees in Nexus');
    }
    if (mod === 'coldchain') {
      return head('Cold chain', 'Temperature trace per cold shipment against its cap. SHP-07 broke the cap on the airport leg.') +
        SHIPMENTS.filter(function (s) { return s.cold; }).map(function (s) {
          var breach = s.temp > s.cap;
          return '<div class="card shadow" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><strong>' + esc(s.id) + ' &middot; ' + esc(s.product) + '</strong><div class="sub2">' + esc(s.lane) + ' &middot; cap ' + s.cap + '°C</div></div>' + (breach ? '<span class="chip inconsistent">excursion</span>' : '<span class="chip verified">in range</span>') + '</div>' + spark(s.trace, s.cap) + '</div>';
        }).join('') + prov('an excursion holds the lot; release needs a QP sign-off in Nexus');
    }
    if (mod === 'trace') {
      return head('Track and trace', 'GS1 serialisation from plant to shelf. Every pack scans at each handoff, so a counterfeit cannot enter the chain.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Serial (SGTIN)</th><th>Product</th><th>Last scan</th><th>Location</th><th>Status</th></tr></thead><tbody>' +
        [['(01)0847...(21)1049', 'OncoNex-100', '08:40', 'Airport export', 'In custody'], ['(01)0847...(21)1050', 'OncoNex-100', '08:41', 'Airport export', 'In custody'], ['(01)0312...(21)7781', 'CardiNex-10', '07:10', 'Chattogram DC', 'Received'], ['(01)0312...(21)7782', 'CardiNex-10', '07:10', 'Chattogram DC', 'Received']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td><span class="chip verified">' + esc(r[4]) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>' + prov('the same serial a pharmacist scans in Cura reconciles against this chain');
    }
    if (mod === 'warehouse') {
      return head('Warehouse', 'Network nodes with utilisation and cold-room uptime.') +
        kpis([['3', 'nodes'], ['69%', 'mean utilisation'], ['97%', 'cold uptime'], [money(Math.round(2400000 * scale())), 'inventory value']]) +
        '<div class="cards3">' + WAREHOUSE.map(function (w) {
          return '<div class="card shadow"><strong>' + esc(w.node) + '</strong><div class="sub2" style="margin:4px 0 10px">' + esc(w.cap) + '</div>' +
            '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span>utilisation</span><span class="mono">' + w.used + '%</span></div><div class="meter"><div class="fill ' + (w.used > 80 ? 'warn' : '') + '" style="width:' + w.used + '%"></div></div>' +
            '<div class="sub2" style="margin-top:10px">cold room ' + esc(w.cold) + '</div></div>';
        }).join('') + '</div>' + prov('a hospital requisition in Apex can draw from the nearest node');
    }
    if (mod === 'fleet') {
      return head('Fleet and routes', 'Vehicles live, with route and current temperature. One reefer is on a breach hold.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Vehicle</th><th>Route</th><th>Temp</th><th>Status</th></tr></thead><tbody>' +
        FLEET.map(function (f) { var c = f.status === 'Breach hold' ? 'inconsistent' : f.status === 'Delivering' ? 'claimed' : 'verified'; return '<tr><td class="nm mono">' + esc(f.v) + '</td><td>' + esc(f.route) + '</td><td class="mono">' + esc(f.temp) + '</td><td><span class="chip ' + c + '">' + esc(f.status) + '</span></td></tr>'; }).join('') +
        '</tbody></table></div>' + prov('route and temperature are logged continuously to the shipment record');
    }
    if (mod === 'pod') {
      return head('Proof of delivery', 'Deliveries reconciled against the order, pack by pack. A short delivery is flagged, not silently accepted.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Delivery</th><th>Destination</th><th class="num">Ordered</th><th class="num">Received</th><th>Reconciliation</th></tr></thead><tbody>' +
        [['POD-3301', 'Shapla District Hospital', 500, 500, 'Matched'], ['POD-3302', 'Shetu Community Pharmacy', 120, 118, 'Short 2'], ['POD-3303', 'Probaho Diagnostics', 40, 40, 'Matched']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="num">' + r[2] + '</td><td class="num">' + r[3] + '</td><td>' + (r[4] === 'Matched' ? '<span class="chip verified">matched</span>' : '<span class="chip inconsistent">' + esc(r[4]) + '</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('a mismatch stays Inconsistent until a record resolves it, never cleared by assertion');
    }
    if (mod === 'exceptions') {
      var alerts = X.coldChainAlerts();
      return head('Exceptions', 'Open exceptions across the network. Cold-chain breaches raised to a manufacturer appear here with their status.') +
        (br.length || alerts.length ?
          '<div class="qt-wrap"><table class="qt"><thead><tr><th>Shipment</th><th>Type</th><th>Detail</th><th>Status</th></tr></thead><tbody>' +
          br.map(function (s) { var r = raised(s.id); return '<tr><td class="mono">' + esc(s.id) + '</td><td>Cold-chain excursion</td><td>' + esc(s.product) + ' peaked ' + s.temp + '°C, cap ' + s.cap + '</td><td>' + (r ? '<span class="chip inconsistent">alerted to maker</span>' : '<span class="chip claimed">unraised</span>') + '</td></tr>'; }).join('') +
          '<tr><td class="mono">POD-3302</td><td>Short delivery</td><td>Shetu pharmacy, 2 units short</td><td><span class="chip claimed">investigating</span></td></tr>' +
          '</tbody></table></div>' : '<div class="card"><div class="sub">No open exceptions.</div></div>') +
        prov('raising a breach from the control tower posts it to Nexus and logs it here');
    }
    if (mod === 'recalls') {
      return head('Recalls', 'Active and historic recalls, traced to the exact packs and their current custody.') +
        '<div class="qt-wrap"><table class="qt"><thead><tr><th>Recall</th><th>Product</th><th>Batch</th><th class="num">Units</th><th class="num">Recovered</th><th>Status</th></tr></thead><tbody>' +
        [['BN-2026-003', 'OncoNex-100', 'BATCH-ONCO-0097', 1000, 847, 'Active'], ['BN-2025-044', 'CardiNex-10', 'BATCH-CARD-0210', 500, 500, 'Closed']].map(function (r) {
          return '<tr><td class="mono">' + esc(r[0]) + '</td><td class="nm">' + esc(r[1]) + '</td><td class="mono">' + esc(r[2]) + '</td><td class="num">' + r[3] + '</td><td class="num">' + r[4] + '</td><td>' + (r[5] === 'Active' ? '<span class="chip inconsistent">active</span>' : '<span class="chip verified">closed</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>' + prov('serialisation makes a recall exact: only the affected packs, and where each one is now');
    }
    if (mod === 'impact') {
      return head('Impact and GIC', 'What this logistics operation contributes to the EESG Health Impact framework, and its verified publication to the Commons.') +
        UI.impactPanel(cur, { measures: [
          { front: 'Supply integrity and pharmacovigilance', measure: 'Cold-chain compliance', value: '97.4%', status: 'Claimed' },
          { front: 'Environment', measure: 'Route emissions vs target', value: '-4%', status: 'Claimed' },
          { front: 'Access and coverage', measure: 'On-time last-mile delivery', value: '94%', status: 'Claimed' }
        ] });
    }
    return '';
  }

  function render() {
    var who = cur.personas[0];
    var br = breaches().filter(function (s) { return !raised(s.id); }).length;
    var mods = MODS.map(function (m) { return m.key === 'exceptions' ? Object.assign({}, m, { badge: br || null }) : m; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Relay', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<div class="os">' + UI.osNav(mods, mod) +
        '<main class="os-main">' + UI.tenantBar(orgs, cur.id) + '<div style="margin-top:16px">' + moduleBody() + '</div></main>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var m = e.target.closest('[data-mod]'); if (m) { mod = m.getAttribute('data-mod'); render(); return; }
    var sid = e.target.getAttribute('data-alert');
    if (sid) {
      var s = SHIPMENTS.filter(function (x) { return x.id === sid; })[0];
      X.append('COLD_CHAIN_ALERT', { shipment: sid, product: s.product, units: s.units, temp: s.temp, cap: s.cap, lane: s.lane, byOrgId: cur.id, maker: 'ORG-NEXAGEN' }, { app: 'relay', persona: cur.personas[0].id });
      UI.toast('Alert raised', s.product + ' ' + sid + ' flagged to the manufacturer.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Cold-chain integrity, Q current', measures: UI.verifiedMeasures(), status: 'Verified' }, { app: 'relay', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
