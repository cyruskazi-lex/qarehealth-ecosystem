<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qäre Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/tokens.css" />
<link rel="stylesheet" href="../../assets/qare.css" />
<style>
  main { padding: 24px 0 80px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--font-brand); font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
  .row .d { font-size: 14px; font-weight: 600; } .row .m { font-size: 12px; color: var(--mid); margin-top: 2px; }
  .temp { font-family: var(--font-mono); font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../assets/exchange.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  var X = window.QareExchange, UI = window.QareUI;
  UI.init('relay');
  var orgs = X.orgsFor('relay');
  var cur = X.org('ORG-RELAY-MID');
  var SHIPMENTS = [
    { id: 'SHP-07', product: 'OncoNex-100', units: 400, lane: 'Tongi to US hub', temp: 12.9, cap: 8, cold: true },
    { id: 'SHP-11', product: 'CardiNex-10', units: 6000, lane: 'Tongi to Chattogram', temp: 22, cap: 30, cold: false },
    { id: 'SHP-14', product: 'OncoNex-100', units: 220, lane: 'Tongi to Sylhet', temp: 5.5, cap: 8, cold: true }
  ];

  function render() {
    var who = cur.personas[0];
    var flagged = X.coldChainAlerts().map(function (a) { return a.shipment; });
    document.getElementById('root').innerHTML =
      UI.topbar({ appName: 'Relay', personaName: who.name, personaRole: who.role + ' · ' + cur.name }) +
      '<main><div class="wrap">' +
        '<div class="eyebrow">Supply chain and 3PL</div>' +
        '<div class="greet">One shipment is over its cold-chain cap.</div>' +
        '<div class="sub">Serialised movement plant to shelf; a breach alerts the manufacturer in Nexus live</div>' +
        UI.tenantBar(orgs, cur.id) +
        '<div class="cols">' +
          '<section class="card shadow"><h2 class="sec">Shipments in transit</h2>' +
            SHIPMENTS.map(function (s) {
              var breach = s.cold && s.temp > s.cap;
              var raised = flagged.indexOf(s.id) >= 0;
              return '<div class="row"><div><div class="d">' + UI.esc(s.product) + ' · ' + s.units + ' units</div>' +
                '<div class="m">' + UI.esc(s.lane) + ' · <span class="mono">' + UI.esc(s.id) + '</span> · <span class="temp" style="color:' + (breach ? 'var(--inconsistent)' : 'var(--verified)') + '">' + s.temp + '°C</span>' + (s.cold ? ' (cap ' + s.cap + '°C)' : '') + '</div></div>' +
                (breach ? (raised ? '<span class="chip inconsistent">alert sent</span>' : '<button class="btn btn-primary btn-sm" data-alert="' + UI.esc(s.id) + '">Raise cold-chain alert</button>') : '<span class="chip verified">in range</span>') + '</div>';
            }).join('') +
            '<p class="provenance">reads IoT temperature; an alert writes a COLD_CHAIN_ALERT the maker sees in Nexus</p>' +
          '</section>' +
          '<section>' + UI.impactPanel(cur, { measures: [
            { front: 'Supply integrity and pharmacovigilance', measure: 'Cold-chain compliance', value: '97.4%', status: 'Claimed' },
            { front: 'Environment', measure: 'Route emissions vs target', value: '-4%', status: 'Verified' }
          ] }) + '</section>' +
        '</div>' +
      '</div></main>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-tenant'); if (t) { cur = X.org(t); render(); return; }
    var sid = e.target.getAttribute('data-alert');
    if (sid) {
      var s = SHIPMENTS.filter(function (x) { return x.id === sid; })[0];
      X.append('COLD_CHAIN_ALERT', { shipment: sid, product: s.product, units: s.units, temp: s.temp, cap: s.cap, lane: s.lane, byOrgId: cur.id, maker: 'ORG-NEXAGEN' }, { app: 'relay', persona: cur.personas[0].id });
      UI.toast('Alert raised', s.product + ' ' + sid + ' flagged to the manufacturer.');
      return;
    }
    if (e.target.matches('[data-gic-publish]')) {
      X.append('GIC_PUBLISHED', { orgId: cur.id, orgName: cur.name, outcome: 'Cold-chain integrity, Q current', status: 'Verified' }, { app: 'relay', persona: cur.personas[0].id });
      UI.toast('Published to GIC', cur.name + ' posted a verified record to the Commons.');
    }
  });

  X.subscribe(render);
  render();
})();
</script>
</body>
</html>
